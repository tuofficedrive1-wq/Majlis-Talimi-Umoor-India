<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تدریسی کورس معلومات فارم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    
    <style>
        @font-face {
            font-family: 'Jameel Noori Nastaleeq';
            src: url('https://cdn.jsdelivr.net/gh/font-to-width/jameel-noori-nastaleeq-regular@1.1/jameel-noori-nastaleeq-regular.woff2') format('woff2');
        }
        body { font-family: 'Jameel Noori Nastaleeq', serif; background-color: #f8fafc; }
        .english-font { font-family: 'Poppins', sans-serif; }
        
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }
        
        input:focus, select:focus {
            border-color: #0f766e;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1);
        }
        
        .file-upload-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #e2e8f0;
            background-color: #f1f5f9;
            cursor: pointer;
        }
        .file-upload-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .file-upload-icon {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            text-align: center;
            padding: 5px 0;
            font-size: 12px;
        }
    </style>
</head>
<body class="bg-gray-100">

    <div class="app-container">
        
        <div class="bg-teal-700 text-white p-5 rounded-b-3xl shadow-lg text-center relative z-10">
            <h1 class="text-2xl font-bold pt-2">تدریسی کورس معلومات فارم</h1>
            <p class="text-teal-100 text-sm mt-1">تعلیمی سال: <span id="display-year" class="font-bold font-sans"></span></p>
        </div>

        <div class="flex-1 p-6">
            <form id="student-entry-form" class="space-y-5">
                
                <div class="text-center mb-6">
                    <label for="photo-input" class="file-upload-wrapper block shadow-md group transition hover:border-teal-500" id="photo-container">
                        <img id="photo-preview" src="https://placehold.co/150x150/e2e8f0/94a3b8?text=Photo" alt="Profile">
                        <div class="file-upload-icon group-hover:bg-teal-600 transition">
                            <i class="fas fa-camera"></i> اپلوڈ
                        </div>
                    </label>
                    <input type="file" id="photo-input" accept="image/*" class="hidden">
                    <p class="text-xs text-red-500 mt-2 font-bold" id="photo-error">* تصویر اپلوڈ کرنا لازمی ہے</p>
                </div>

                <!-- 1. NAME & FATHER NAME FIRST -->
                <div class="grid grid-cols-1 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">نام</label>
                        <input type="text" id="name" class="w-full p-3 border border-gray-300 rounded-xl focus:bg-white transition" placeholder="اپنا نام لکھیں" required>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">ولدیت</label>
                        <input type="text" id="fatherName" class="w-full p-3 border border-gray-300 rounded-xl focus:bg-white transition" placeholder="والد کا نام" required>
                    </div>
                </div>

                <!-- 2. MANSAB (DESIGNATION) -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1 flex items-center gap-2">
                        <i class="fas fa-user-tag text-teal-600"></i> منصب
                    </label>
                    <select id="mansab-select" class="w-full p-3 border border-gray-300 rounded-xl bg-white focus:bg-white transition" onchange="handleMansabChange()">
                        <option value="طالب علم">طالب علم</option>
                        <option value="ناظم">ناظم</option>
                        <option value="نائب ناظم">نائب ناظم</option>
                        <option value="دیگر">دیگر</option>
                    </select>
                    <!-- Custom Mansab Box (Hidden by default) -->
                    <div id="mansab-custom-div" class="hidden mt-2">
                        <input type="text" id="mansab-custom" class="w-full p-3 border border-gray-300 rounded-xl bg-gray-50 focus:bg-white transition" placeholder="اپنا منصب لکھیں...">
                    </div>
                </div>

                <!-- 3. JAMIA LOGIC (Dynamic based on Mansab) -->
                <div id="jamia-section">
                    
                    <!-- A. Dropdown (For Talib-e-Ilm) -->
                    <div id="jamia-dropdown-container">
                        <label class="block text-sm font-bold text-gray-700 mb-1 flex items-center gap-2">
                            <i class="fas fa-mosque text-teal-600"></i> جامعۃ المدینہ کا نام
                        </label>
                        <select id="jamia-select" class="w-full p-3 border border-gray-300 rounded-xl bg-white focus:bg-white transition">
                            <option value="">منتخب کریں...</option>
                            <option value="ناگپور">ناگپور</option>
                            <option value="ممبئی">ممبئی</option>
                            <option value="احمدآباد">احمدآباد</option>
                            <option value="موڈاسہ">موڈاسہ</option>
                            <option value="آگرہ">آگرہ</option>
                            <option value="شاہ جہانپور">شاہ جہانپور</option>
                            <!-- 'other' ka option yahan se hata diya gaya hai -->
                        </select>
                    </div>

                    <!-- B. Text Boxes (For Nazim, Naib Nazim, Other) -->
                    <div id="jamia-text-container" class="hidden grid grid-cols-1 gap-4 mt-2">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1 flex items-center gap-2">
                                <i class="fas fa-mosque text-teal-600"></i> جامعہ
                            </label>
                            <input type="text" id="jamia-text" class="w-full p-3 border border-gray-300 rounded-xl focus:bg-white transition" placeholder="اپنے جامعہ کا نام لکھیں">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-teal-700 mb-1">کس جامعہ میں ٹیسٹ دیں گے؟</label>
                            <input type="text" id="test-center" class="w-full p-3 border-2 border-teal-200 rounded-xl focus:bg-white transition" placeholder="ٹیسٹ دینے والے جامعہ کا نام">
                        </div>
                    </div>
                </div>

                <!-- 4. OTHER DETAILS -->
                <div class="grid grid-cols-1 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1 flex items-center gap-2">
                            <i class="fas fa-phone-alt text-teal-600"></i> موبائل نمبر (Whatsapp)
                        </label>
                        <input type="number" id="mobile" class="w-full p-3 border border-gray-300 rounded-xl focus:bg-white transition english-font" placeholder="9012345678" oninput="validatePhone(this)">
                        <p class="text-xs text-red-500 hidden mt-1" id="phone-error">براہ کرم درست 10 ہندسے لکھیں۔</p>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1 flex items-center gap-2">
                            <i class="fas fa-map-marker-alt text-teal-600"></i> شہر کا نام (جہاں آپ رہتے ہیں)
                        </label>
                        <input type="text" id="city" class="w-full p-3 border border-gray-300 rounded-xl focus:bg-white transition" placeholder="اپنے شہر کا نام لکھیں" required>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-teal-600 to-teal-800 hover:from-teal-700 hover:to-teal-900 text-white font-bold py-4 rounded-xl shadow-lg transform transition active:scale-95 flex justify-center items-center gap-2 mt-4 text-lg">
                    <span>محفوظ کریں</span> <i class="fas fa-paper-plane"></i>
                </button>

            </form>

            <!-- 5. NEW SUCCESS MESSAGE W/ TRACKING CODE -->
            <div id="success-msg" class="hidden flex flex-col items-center justify-center py-8 px-2">
                <div class="bg-green-100 p-4 rounded-full text-green-600 mb-4 animate-bounce">
                    <i class="fas fa-check-circle text-5xl"></i>
                </div>
                
                <p class="text-gray-800 text-lg font-bold mb-1 text-center leading-relaxed">
                    آپ کی دی گئ معلومات ہم تک پہنچ گئی ہے۔
                </p>
                <p class="text-teal-700 text-sm mb-4 text-center leading-relaxed px-4">
                    نیچے دئے گئے کوڈ کو محفوظ فرما لیں اسی کے ذریعے آپ رزلٹ معلوم کر سکیں گے۔
                </p>

                <!-- Code Display Box -->
                <div class="w-full bg-gray-50 border-2 border-teal-500 rounded-xl p-5 mb-6 text-center relative shadow-sm">
                    <p class="text-sm text-gray-500 mb-2">آپ کا ٹریکنگ کوڈ</p>
                    <p class="text-4xl font-mono font-black text-teal-900 tracking-widest" id="generated-code-display">------</p>
                    <button onclick="copyCode()" class="mt-3 bg-teal-100 text-teal-800 px-4 py-1.5 rounded-full text-sm font-bold hover:bg-teal-200 transition">
                        <i class="fas fa-copy"></i> کوڈ کاپی کریں
                    </button>
                </div>

                <button onclick="resetForm()" class="bg-teal-600 text-white w-full py-3 rounded-xl shadow hover:bg-teal-700 transition font-bold text-lg">
                    نیا فارم پُر کریں
                </button>
            </div>
        </div>

        <div class="bg-gray-50 p-4 text-center border-t border-gray-200 mt-auto">
            <p class="text-teal-800 font-bold text-lg">مجلس تعلیمی امور ہند</p>
            <p class="text-xs text-gray-400 mt-1">&copy; 2026 All Rights Reserved</p>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDhPuyX0y1gb3uXoIRcdcQPkd5Q4KJFgl0", authDomain: "data-f15ab.firebaseapp.com", projectId: "data-f15ab", storageBucket: "data-f15ab.appspot.com", messagingSenderId: "449137002393", appId: "1:449137002393:web:6a23721d00b1b0daeb3508", measurementId: "G-1PHNJQWNPZ" };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const jamiaParam = urlParams.get('jamia');
        const yearParam = urlParams.get('year'); 
        
        let currentAcademicYear = "2026";

        async function fetchCurrentYear() {
            if (yearParam) {
                currentAcademicYear = yearParam;
                document.getElementById('display-year').innerText = currentAcademicYear;
            } else {
                try {
                    const snap = await getDocs(collection(db, 'tadrisi_years'));
                    let years = snap.docs.map(d => d.data().year);
                    if (years.length > 0) {
                        currentAcademicYear = years.sort()[years.length - 1]; 
                    }
                    document.getElementById('display-year').innerText = currentAcademicYear;
                } catch (e) { console.error("Year fetch error", e); }
            }
        }
        
        fetchCurrentYear();

        // 1. MANSAB & JAMIA LOGIC
        window.handleMansabChange = () => {
            const m = document.getElementById('mansab-select').value;
            const mCustom = document.getElementById('mansab-custom-div');
            
            const jDrop = document.getElementById('jamia-dropdown-container');
            const jText = document.getElementById('jamia-text-container');

            // Show/Hide custom mansab input
            if (m === 'دیگر') {
                mCustom.classList.remove('hidden');
                document.getElementById('mansab-custom').required = true;
            } else {
                mCustom.classList.add('hidden');
                document.getElementById('mansab-custom').required = false;
            }

            // Show/Hide Jamia dropdown vs text boxes
            if (m === 'طالب علم') {
                jDrop.classList.remove('hidden');
                jText.classList.add('hidden');
                document.getElementById('jamia-select').required = true;
                document.getElementById('jamia-text').required = false;
                document.getElementById('test-center').required = false;
            } else {
                jDrop.classList.add('hidden');
                jText.classList.remove('hidden');
                document.getElementById('jamia-select').required = false;
                document.getElementById('jamia-text').required = true;
                document.getElementById('test-center').required = true;
            }
        };

        // Call on load to set initial UI state
        handleMansabChange();

        // Check Jamia Param for Talib-e-Ilm
        if(jamiaParam) {
            const select = document.getElementById('jamia-select');
            let exists = false;
            for(let i=0; i<select.options.length; i++){
                if(select.options[i].value === jamiaParam){
                    select.selectedIndex = i;
                    exists = true;
                    break;
                }
            }
            if(!exists) {
                // Agar link me diya gaya jamia dropdown me na ho
                document.getElementById('mansab-select').value = 'ناظم'; // Switch to non-student view
                handleMansabChange();
                document.getElementById('jamia-text').value = jamiaParam;
                document.getElementById('jamia-text').readOnly = true;
            } else {
                select.disabled = true; 
            }
        }

        const photoInput = document.getElementById('photo-input');
        const photoPreview = document.getElementById('photo-preview');
        let photoBase64 = null;

        photoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    photoPreview.src = e.target.result;
                    photoBase64 = e.target.result;
                    document.getElementById('photo-error').style.display = 'none';
                    document.getElementById('photo-container').style.borderColor = '#e2e8f0';
                }
                reader.readAsDataURL(file);
            }
        });

        window.validatePhone = (input) => {
            const errorMsg = document.getElementById('phone-error');
            if (input.value.length > 10) input.value = input.value.slice(0, 10);
            
            if (input.value.length === 10) {
                errorMsg.classList.add('hidden');
                input.classList.remove('border-red-500');
                input.classList.add('border-green-500');
            } else {
                errorMsg.classList.remove('hidden');
                input.classList.add('border-red-500');
                input.classList.remove('border-green-500');
            }
        };

        // Generating a random 6 character alphanumeric code
        function generateTrackingCode() {
            return Math.random().toString(36).substring(2, 8).toUpperCase();
        }

        // Copy Code to Clipboard
        window.copyCode = () => {
            const code = document.getElementById('generated-code-display').innerText;
            navigator.clipboard.writeText(code).then(() => {
                alert("کوڈ کاپی ہو گیا ہے: " + code);
            });
        };

        document.getElementById('student-entry-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!photoBase64) {
                alert("تصویر اپلوڈ کرنا لازمی ہے!");
                document.getElementById('photo-error').style.display = 'block';
                document.getElementById('photo-container').style.borderColor = 'red';
                document.getElementById('photo-container').scrollIntoView({behavior: 'smooth'});
                return;
            }

            const mobile = document.getElementById('mobile').value.trim();
            if (mobile.length !== 10) {
                alert("موبائل نمبر 10 ہندسوں کا ہونا چاہیے۔");
                return;
            }

            // Extract Mansab Data
            let mansabValue = document.getElementById('mansab-select').value;
            if (mansabValue === 'دیگر') {
                mansabValue = document.getElementById('mansab-custom').value.trim();
            }

            // Extract Jamia Data based on Mansab
            let jamiaValue = "";
            let testCenterValue = "";

            if (document.getElementById('mansab-select').value === 'طالب علم') {
                jamiaValue = document.getElementById('jamia-select').value;
                if (!jamiaValue) { alert("جامعہ کا نام منتخب کریں۔"); return; }
            } else {
                jamiaValue = document.getElementById('jamia-text').value.trim();
                testCenterValue = document.getElementById('test-center').value.trim();
                if (!jamiaValue) { alert("جامعہ کا نام لکھیں۔"); return; }
                if (!testCenterValue) { alert("ٹیسٹ سینٹر کا نام لکھیں۔"); return; }
            }

            const btn = document.getElementById('submit-btn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> محفوظ ہو رہا ہے...';

            try {
                // Generate Tracking Code
                let uniqueCode = generateTrackingCode();
                
                await addDoc(collection(db, 'tadrisi_students'), {
                    mansab: mansabValue,
                    jamia: jamiaValue,
                    testCenter: testCenterValue, // For Nazims only
                    trackingCode: uniqueCode,    // Uniqe code for result checking
                    mobile: mobile,
                    name: document.getElementById('name').value.trim(),
                    fatherName: document.getElementById('fatherName').value.trim(),
                    city: document.getElementById('city').value.trim(),
                    photoBase64: photoBase64,
                    groupId: null, 
                    academicYear: currentAcademicYear,
                    createdAt: new Date()
                });

                // Show Success Message and Tracking Code
                document.getElementById('generated-code-display').innerText = uniqueCode;
                document.getElementById('student-entry-form').classList.add('hidden');
                document.getElementById('success-msg').classList.remove('hidden');
                window.scrollTo(0, 0);

            } catch (error) {
                console.error(error);
                alert("ایرر! انٹرنیٹ چیک کریں۔");
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        window.resetForm = () => {
            document.getElementById('student-entry-form').reset();
            document.getElementById('photo-preview').src = "https://placehold.co/150x150/e2e8f0/94a3b8?text=Photo";
            photoBase64 = null;
            handleMansabChange(); // Reset UI based on default dropdown
            
            if(jamiaParam || yearParam) {
                window.location.reload(); 
            } else {
                document.getElementById('success-msg').classList.add('hidden');
                document.getElementById('student-entry-form').classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
