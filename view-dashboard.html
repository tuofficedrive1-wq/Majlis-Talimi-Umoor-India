<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Majlis Talimi Umoor India - View Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--ink:#0f2c35;--teal:#1d9a8e;--tealD:#147970;--paper:#f4f6f6;--line:#dbe3e3;--mut:#64797f;--ok:#1d9a8e;--no:#d9534f;--std:#2f6fb5;--insp:#7a4fb0;--qir:#1f8a5b}
*{box-sizing:border-box}body{margin:0;font:13px/1.45 Poppins,system-ui,sans-serif;background:var(--paper);color:var(--ink)}
.ur{font-family:'Noto Nastaliq Urdu',serif;line-height:1.9;color:var(--tealD);font-size:12px}
header{background:var(--ink);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
header h1{font-size:15px;margin:0;font-weight:600}header small{color:#9fd3cc;display:block;font-weight:400;font-size:11px}
.btn{border:1px solid #ffffff40;background:#ffffff14;color:#fff;border-radius:8px;padding:6px 11px;font:inherit;font-weight:500;cursor:pointer}.btn:hover{background:#ffffff26}
main{max-width:1280px;margin:0 auto;padding:14px 14px 40px}
.bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
label{font-size:11px;font-weight:600;color:var(--mut);display:block;margin-bottom:3px}
select,input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
#warn{display:none;margin:10px 0;padding:9px 12px;background:#fff3e0;border:1px solid #f0c27b;border-radius:8px;color:#7a4a00}
#kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.kpi{text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit;color:inherit}
.kpi.on{border-color:var(--no);box-shadow:0 0 0 2px #d9534f33}.kpi b{font-size:22px;display:block;line-height:1.1}.kpi b small{font-size:12px;color:var(--mut);font-weight:500}
.kpi span{font-size:11.5px;color:var(--mut)}.kpi em{display:block;height:5px;background:#e8eeee;border-radius:3px;margin-top:6px;overflow:hidden}.kpi u{display:block;height:100%;background:var(--ok)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tab{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--teal);color:#fff;border-color:var(--teal)}.tab i{font-style:normal;opacity:.75;margin-left:5px}
.sc{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}th{background:#eef3f3;text-align:left;font-size:11.5px;color:var(--mut);padding:8px 10px;white-space:nowrap;position:sticky;top:0}
td{padding:7px 10px;border-top:1px solid #edf1f1;vertical-align:middle}tr[data-j]:hover,tr[data-u]:hover{background:#f1f8f7;cursor:pointer}
.tb{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px;color:var(--mut);font-size:12px}.tb select{width:auto}
.d{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:10px;font-style:normal;font-weight:700}
.d.ok{background:var(--ok);color:#fff}.d.no{border:2px solid var(--no)}.d.na{width:14px;height:2px;border-radius:1px;background:#b9c6c8}
.dots{display:flex;gap:7px}th.ty{text-align:center;font-weight:600}td.ty{text-align:center}
.r{display:inline-block;color:#fff;border-radius:4px;font-size:9.5px;font-weight:700;padding:0 4px;margin-right:4px}.r.standard{background:var(--std)}.r.inspector{background:var(--insp)}.r.qirat{background:var(--qir)}
.z{white-space:nowrap}.mut{color:var(--mut)}.sc2{font-weight:700}
.pg{min-width:84px}.pg em{display:block;height:5px;background:#e8eeee;border-radius:3px;margin-top:2px;overflow:hidden}.pg u{display:block;height:100%;background:var(--ok)}
.c{font-size:11px;font-weight:600;padding:1px 6px;border-radius:9px}.c.f{background:#dff3f0;color:var(--tealD)}.c.p{background:#fdf0d5;color:#8a5a00}.c.z{background:#fbe3e2;color:#a33}
#ov{position:fixed;inset:0;background:#0f2c35cc;display:none;align-items:center;justify-content:center;z-index:60}
#md{position:fixed;inset:0;background:#0f2c3599;display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:20px 10px}
#mb{background:#fff;border-radius:12px;max-width:960px;width:100%;padding:18px}
#mb h2{margin:0;font-size:17px}#mb h4{margin:14px 0 6px;font-size:13px}#mb h4 small{color:var(--mut)}
.g th.cur,.g td.cur{background:#e6f4f2}.g th button{all:unset;cursor:pointer;color:var(--ink);font-weight:600}.g td{text-align:center}.g td:first-child{text-align:left;white-space:nowrap;font-weight:500}
@media(max-width:700px){.hide-s{display:none}}
</style>
</head>
<body>
<div id="ov"><div style="background:#fff;padding:20px 26px;border-radius:12px;font-weight:600" id="ovt">Loading...</div></div>
<header>
  <div><h1>Majlis Talimi Umoor India<small id="who">Loading user...</small></h1></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <button class="btn" id="b-ref">Refresh</button><button class="btn" id="b-xls">Export Excel</button><button class="btn" id="b-out">Logout</button>
  </div>
</header>
<main>
  <section class="bar">
    <div><label for="f-month">Month</label><select id="f-month"></select></div>
    <div><label for="f-region">Region</label><select id="f-region"><option value="all">All regions</option></select></div>
    <div><label for="f-state">State</label><select id="f-state"><option value="all">All states</option></select></div>
    <div><label for="f-q">Search jamia, code or zimmedar</label><input id="f-q" placeholder="e.g. Bhopal, Qari Ahmad..."></div>
    <div style="display:flex;align-items:end"><button class="btn" id="b-reset" style="background:var(--ink);width:100%">Reset filters</button></div>
  </section>
  <div id="warn"></div>
  <div id="kpis"></div>
  <nav class="tabs" id="tabs"></nav>
  <div id="view"></div>
</main>
<div id="md"><div id="mb"></div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import {getAuth,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import {getFirestore,collection,getDocs,doc,getDoc} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyDhPuyX0y1gb3uXoIRcdcQPkd5Q4KJFgl0",authDomain:"data-f15ab.firebaseapp.com",projectId:"data-f15ab",storageBucket:"data-f15ab.firebasestorage.app",messagingSenderId:"1064843477156",appId:"1:1064843477156:web:ea4c1d6837da821ea3a669"});
const auth=getAuth(app),db=getFirestore(app),ADMIN_UID="hK5Q8P2uYqZ7jL4mN9vX1cR6tW3";

// Report types -> which zimmedar role submits them
const TYPES=[['jaiza','Jaiza','standard'],['karkardagi','Karkardagi','standard'],['recording','Tadris Recording','standard'],['test','Monthly Test','standard'],['inspection','Inspection','inspector'],['qirat','Qirat Jaiza','qirat']];
const ROLES=['standard','inspector','qirat'];
const RLAB={standard:'Standard',inspector:'Inspector',qirat:'Shoba Qirat'};
const RT={standard:['jaiza','karkardagi','recording','test'],inspector:['inspection'],qirat:['qirat']};
const COLS={jaiza:[['cls','Class'],['pr','Present'],['st','Students'],['pct','%']],karkardagi:[['t','Teacher'],['cls','Class'],['book','Book'],['pct','Achievement %']],recording:[['t','Teacher'],['cls','Class'],['book','Kitab'],['url','Audio']],test:[['cls','Class'],['st','Students']],inspection:[['t','Inspector'],['ty','Type'],['score','Score'],['date','Date']],qirat:[['cls','Class'],['t','Teacher'],['pct','%']]};
const MS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ALIAS={'PURNEA':'PURNIA','KOTA JUCTION':'KOTA STATION','KOTA JUNCTION':'KOTA STATION','LATUR':'LATOOR'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
const nReg=r=>{r=String(r||'').trim().toUpperCase();return r==='DEHLI'?'DELHI':r==='BENGALORE'?'BANGALORE':r};
const nSt=s=>String(s||'').trim().toUpperCase();
const mlabel=m=>MS[+m.slice(5)-1]+" '"+m.slice(2,4);

const S={users:[],byId:{},jamiaat:[],byKey:{},z:{},idx:{},months:[],tab:'jamiaat',focus:null,sort:'name',modal:null,dm:null,isSuper:false,scope:'all',aRegion:'',aState:'',failed:[]};
const loader=(on,t)=>{$('ov').style.display=on?'flex':'none';if(t)$('ovt').textContent=t};

// ---- helpers: names, months, counting ----
const keyCache={};
function jkey(name){
  const n=norm(name);if(!n)return '';
  const a=norm(ALIAS[n.toUpperCase()]||n);
  if(keyCache[a]!==undefined)return keyCache[a];
  let k=S.byKey[a]?a:'';
  if(!k&&a.length>3)k=Object.keys(S.byKey).find(x=>x.includes(a)||a.includes(x))||'';
  return keyCache[a]=k||a;
}
const roleOf=u=>{const r=String(u?.role||'').toLowerCase().replace(/[\s-]/g,'_');return r==='standard'?'standard':(r==='inspector'||r==='academic_inspector')?'inspector':(r==='shoba_qirat'||r==='qirat')?'qirat':null};
function userJamias(u){
  const out=[];
  [u.jamiaatList,u.assignedJamiaat,u.jamiaat].forEach(l=>Array.isArray(l)&&l.forEach(i=>{const n=typeof i==='object'&&i?(i.name||i.jamiaName||i.jamia):i;if(n)out.push(jkey(n))}));
  return [...new Set(out.filter(Boolean))];
}
function ymOf(d){
  for(const f of [d.monthKey,d.month]){const m=String(f||'').match(/^(\d{4})-(\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')}
  if(d.year!=null&&d.monthNum!=null&&!isNaN(d.monthNum))return d.year+'-'+String(+d.monthNum+1).padStart(2,'0');
  const nm=String(d.month||d.monthKey||'').toLowerCase().slice(0,3),mi=MS.findIndex(x=>x.toLowerCase()===nm);
  if(mi>=0){const ay=String(d.academicYear||'').split('-');const y=d.year||(mi>=3?ay[0]:ay[1]);if(y)return y+'-'+String(mi+1).padStart(2,'0')}
  const ts=d.createdAt||d.updatedAt||d.submittedAt;
  if(ts?.seconds){const x=new Date(ts.seconds*1000);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')}
  return 'unknown';
}
const add=(k,m,t,it)=>{if(!k)return;((S.idx[k]??={})[m]??={});(S.idx[k][m][t]??=[]).push(it)};
const items=(k,m,t)=>S.idx[k]?.[m]?.[t]||[];
const cnt=(k,m,t)=>items(k,m,t).filter(i=>!i.nc).length;
const zs=(k,r)=>S.z[k]?.[r]||[];

// ---- data load ----
async function load(){
  loader(true,'Loading all records...');S.failed=[];S.idx={};Object.keys(keyCache).forEach(k=>delete keyCache[k]);
  const get=async n=>{try{return (await getDocs(collection(db,n))).docs.map(d=>({id:d.id,...d.data()}))}catch(e){console.error(n,e);S.failed.push(n+' ('+(e.code||e.message)+')');return[]}};
  const names=['users','jamiaat_master','jaiza_forms','monthly_reports','monthly_test_sheets','inspection_reports','academic_inspections'];
  const [users,master,jaiza,monthly,tests,insp,acad]=await Promise.all(names.map(get));
  // 146 official jamiaat from jamiaat_master
  S.byKey={};S.jamiaat=[];
  master.forEach(d=>{const name=String(d.jamiaName||d.name||'').trim(),k=norm(name);if(!k||S.byKey[k])return;
    const j={key:k,name,urdu:d.urduName||'',region:nReg(d.region),state:nSt(d.state),code:d.code||''};S.byKey[k]=j;S.jamiaat.push(j)});
  S.users=users;S.byId={};users.forEach(u=>S.byId[u.id]=u);
  if(!S.jamiaat.length)users.forEach(u=>[u.jamiaatList].flat().forEach(i=>{const n=typeof i==='object'&&i?(i.name||i.jamiaName):i;const k=norm(n);if(k&&!S.byKey[k]){const j={key:k,name:n,urdu:'',region:nReg(u.region),state:nSt(u.state),code:''};S.byKey[k]=j;S.jamiaat.push(j)}}));
  S.jamiaat.sort((a,b)=>a.name.localeCompare(b.name));
  // zimmedar <-> jamia
  S.z={};S.jamiaat.forEach(j=>S.z[j.key]={standard:[],inspector:[],qirat:[]});
  users.forEach(u=>{u._r=roleOf(u);if(!u._r)return;u._j=userJamias(u);u._j.forEach(k=>S.z[k]?.[u._r].push(u))});
  // index reports: jamia -> month -> type -> items
  jaiza.forEach(d=>add(jkey(d.jamiaName||d.name),ymOf(d),'jaiza',{cls:d.className,pr:d.presentStudents,st:d.totalStudents,pct:d.classPercentage!=null?Math.round(d.classPercentage)+'%':''}));
  monthly.forEach(r=>{const u=S.byId[r.userId],role=roleOf(u),m=ymOf(r);
    (r.karkardagiReport?.data||[]).forEach(e=>add(jkey(e.jamiaName),m,'karkardagi',{t:e.teacherName,cls:e.className,book:e.bookName,pct:e.achievement!=null?e.achievement+'%':''}));
    (r.tadrisRecording?.data||[]).forEach(e=>add(jkey(e.jamiaName),m,'recording',{t:e.teacherName,cls:e.className,book:e.kitabName,url:e.audioUrl||e.audioURL||e.recordingUrl||e.url||e.fileUrl||''}));
    (r.jaizaReport?.data||[]).forEach(e=>add(jkey(e.name||e.jamiaName),m,role==='qirat'?'qirat':'jaiza',{cls:e.details?.class||e.className,t:e.details?.teacher,pr:'',st:e.details?.totalStudents,pct:e.percentage||''}))});
  tests.forEach(t=>add(jkey(t.jamiaName||t.jamia),ymOf(t),'test',{cls:t.class,st:(t.students||[]).length}));
  insp.forEach(r=>add(jkey(r.jamiaName),ymOf(r),'inspection',{t:r.inspectorName,ty:r.type,score:r.score,date:r.date,nc:r.type==='Not Conduct'}));
  acad.forEach(r=>add(jkey(r.jamiaName),ymOf(r),'inspection',{t:S.byId[r.inspectorId]?.name||'',ty:'Detailed form',score:r.overallPercentage,date:r.inspectionDate?.seconds?new Date(r.inspectionDate.seconds*1000).toLocaleDateString():''}));
  const w=$('warn');
  w.style.display=S.failed.length?'block':'none';
  w.textContent=S.failed.length?'Ye collections load nahi huin (Firestore rules ya network check karein): '+S.failed.join(', '):'';
  fillFilters();render();loader(false);
}

// ---- filters ----
function fillFilters(){
  const regs=[...new Set(S.jamiaat.map(j=>j.region).filter(Boolean))].sort(),sts=[...new Set(S.jamiaat.map(j=>j.state).filter(Boolean))].sort();
  const keep=(id,arr,all)=>{const s=$(id),v=s.value;s.innerHTML=`<option value="all">${all}</option>`+arr.map(x=>`<option>${esc(x)}</option>`).join('');if(arr.includes(v))s.value=v};
  keep('f-region',regs,'All regions');keep('f-state',sts,'All states');
  if(!S.isSuper&&S.scope==='region'&&S.aRegion){$('f-region').value=S.aRegion;$('f-region').disabled=true}
  if(!S.isSuper&&S.scope==='state'&&S.aState){$('f-state').value=S.aState;$('f-state').disabled=true}
}
function visible(){
  const r=$('f-region').value,s=$('f-state').value,q=norm($('f-q').value);
  return S.jamiaat.filter(j=>{
    if(!S.isSuper){if(S.scope==='region'&&S.aRegion&&j.region!==S.aRegion)return false;if(S.scope==='state'&&S.aState&&j.state!==S.aState)return false}
    if(r!=='all'&&j.region!==r)return false;if(s!=='all'&&j.state!==s)return false;
    if(!q)return true;
    const names=ROLES.flatMap(x=>zs(j.key,x)).map(u=>(u.name||'')+' '+(u.email||'')).join(' ');
    return norm([j.name,j.urdu,j.code,j.region,j.state,names].join(' ')).includes(q);
  });
}

// ---- small UI pieces ----
const dot=(n,na)=>n>0?`<i class="d ok" title="${n} report(s) jama">${n>1?n:'&#10003;'}</i>`:na?'<i class="d na" title="Is role ka koi zimmedar assign nahi"></i>':'<i class="d no" title="Report baaki hai"></i>';
const cell=(d,t)=>`<span class="c ${d===t?'f':d?'p':'z'}">${d}/${t}</span>`;
const prog=(d,t)=>`<div class="pg"><b>${d}/${t}</b><em><u style="width:${t?Math.round(d*100/t):0}%"></u></em></div>`;
const tag=(u,r)=>`<span class="z"><span class="r ${r}">${r[0].toUpperCase()}</span>${esc(u.name||u.email||'-')}</span>`;
const typeHead=()=>TYPES.map(t=>`<th class="ty">${t[1]}</th>`).join('');

function render(){
  const V=visible(),m=$('f-month').value;
  const vu=r=>S.users.filter(u=>u._r===r&&(u._j.some(k=>V.some(j=>j.key===k))||(!u._j.length&&V.length===S.jamiaat.length)));
  S.vu={standard:vu('standard'),inspector:vu('inspector'),qirat:vu('qirat')};
  $('kpis').innerHTML=TYPES.map(([t,l])=>{const d=V.filter(j=>cnt(j.key,m,t)>0).length,p=V.length?Math.round(d*100/V.length):0;
    return `<button class="kpi ${S.focus===t?'on':''}" data-t="${t}" title="Click: sirf baaki wale jamiaat dekhein"><b>${d}<small> / ${V.length}</small></b><span>${l} jama</span><em><u style="width:${p}%"></u></em></button>`}).join('');
  $('tabs').innerHTML=[['jamiaat','Jamiaat',V.length],...ROLES.map(r=>[r,RLAB[r]+' Zimmedaran',S.vu[r].length])].map(([id,l,n])=>`<button class="tab ${S.tab===id?'on':''}" data-tab="${id}">${l}<i>${n}</i></button>`).join('');
  $('view').innerHTML=S.tab==='jamiaat'?jamiaatView(V,m):userView(S.tab,V,m);
}
function jamiaatView(V,m){
  let rows=V.map(j=>({j,n:TYPES.map(([t,,r])=>cnt(j.key,m,t))}));
  if(S.focus){const i=TYPES.findIndex(t=>t[0]===S.focus);rows=rows.filter(x=>x.n[i]===0)}
  if(S.sort==='least')rows.sort((a,b)=>a.n.filter(Boolean).length-b.n.filter(Boolean).length||a.j.name.localeCompare(b.j.name));
  const fl=S.focus?` | Filter: <b>${TYPES.find(t=>t[0]===S.focus)[1]} baaki</b> (KPI dobara click karke hatayein)`:'';
  return `<div class="tb"><span>${rows.length} jamiaat${fl}</span><span>Sort: <select id="f-sort"><option value="name">Naam</option><option value="least" ${S.sort==='least'?'selected':''}>Sabse kam report pehle</option></select></span></div>
  <div class="sc"><table><thead><tr><th>#</th><th>Jamia</th><th class="hide-s">Zimmedaran</th>${typeHead()}<th>Done</th></tr></thead><tbody>`+
  (rows.map(({j,n},i)=>`<tr data-j="${esc(j.key)}"><td class="mut">${i+1}</td><td><b>${esc(j.name)}</b> <span class="mut">${esc(j.code)}</span>${j.urdu&&j.urdu!==j.name?`<div class="ur">${esc(j.urdu)}</div>`:''}<div class="mut" style="font-size:11px">${esc(j.region)}${j.state?' / '+esc(j.state):''}</div></td>
   <td class="hide-s">${ROLES.map(r=>zs(j.key,r).map(u=>tag(u,r)).join('<br>')).filter(Boolean).join('<br>')||'<span class="mut">Koi assign nahi</span>'}</td>
   ${TYPES.map(([t,,r],k)=>`<td class="ty">${dot(n[k],!zs(j.key,r).length)}</td>`).join('')}<td class="sc2">${n.filter(Boolean).length}/${TYPES.length}</td></tr>`).join('')||`<tr><td colspan="${TYPES.length+4}" class="mut" style="padding:24px;text-align:center">Koi jamia nahi mila.</td></tr>`)+`</tbody></table></div>`;
}
function userView(role,V,m){
  const types=RT[role],list=S.vu[role];
  const head=types.map(t=>`<th>${TYPES.find(x=>x[0]===t)[1]}</th>`).join('');
  return `<div class="tb"><span>${list.length} ${RLAB[role]} zimmedaran | Mahina: ${mlabel(m)}</span><span class="mut">Row par click karein: us zimmedar ki sari report</span></div>
  <div class="sc"><table><thead><tr><th>#</th><th>Naam</th><th class="hide-s">Region</th><th>Jamiaat</th>${head}</tr></thead><tbody>`+
  (list.map((u,i)=>{const ks=u._j;return `<tr data-u="${esc(u.id)}"><td class="mut">${i+1}</td><td><b>${esc(u.name||'Unnamed')}</b><div class="mut" style="font-size:11px">${esc(u.email||'')}</div></td><td class="hide-s">${esc(u.region||'-')}</td><td>${ks.length}</td>
   ${types.map(t=>`<td>${ks.length?prog(ks.filter(k=>cnt(k,m,t)>0).length,ks.length):'<span class="mut">-</span>'}</td>`).join('')}</tr>`}).join('')||`<tr><td colspan="${types.length+4}" class="mut" style="padding:24px;text-align:center">Koi zimmedar nahi mila. (Role: ${role})</td></tr>`)+`</tbody></table></div>`;
}

// ---- detail modal (one jamia OR one zimmedar, all months at a glance) ----
function grid(keys,types,cur){
  return `<div class="sc"><table class="g"><thead><tr><th></th>${S.months.map(m=>`<th class="${m===cur?'cur':''}"><button data-m="${m}">${mlabel(m)}</button></th>`).join('')}</tr></thead><tbody>`+
  types.map(t=>`<tr><td>${TYPES.find(x=>x[0]===t)[1]}</td>${S.months.map(m=>{const d=keys.filter(k=>cnt(k,m,t)>0).length;return `<td class="${m===cur?'cur':''}">${keys.length===1?dot(d,false):cell(d,keys.length)}</td>`}).join('')}</tr>`).join('')+`</tbody></table></div>`;
}
function detail(k,m){
  return TYPES.map(([t,l])=>{const it=items(k,m,t);if(!it.length)return '';
    return `<h4>${l} <small>(${it.length})</small></h4><div class="sc"><table><thead><tr>${COLS[t].map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead><tbody>${it.map(i=>`<tr>${COLS[t].map(([f])=>`<td>${f==='url'?(i.url?`<a href="${esc(i.url)}" target="_blank" rel="noopener">Play</a>`:'-'):esc(i[f]===''||i[f]==null?'-':i[f])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}).join('')||'<p class="mut">Is mahine koi report jama nahi hui.</p>';
}
function modal(){
  if(!S.modal)return;const m=S.dm,{kind,id}=S.modal;let h='';
  if(kind==='j'){const j=S.byKey[id];
    h=`<h2>${esc(j.name)} ${j.urdu?`<span class="ur">${esc(j.urdu)}</span>`:''}</h2><div class="mut">${esc(j.region)} / ${esc(j.state)} ${j.code?'| Code '+esc(j.code):''}</div>
    <p>${ROLES.map(r=>zs(id,r).map(u=>`<a href="#" data-uo="${esc(u.id)}">${tag(u,r)}</a>`).join(' &nbsp; ')).join(' &nbsp; ')||'<span class="mut">Koi zimmedar assign nahi</span>'}</p>
    <h4>Saal bhar ki report (mahine par click karein)</h4>${grid([id],TYPES.map(t=>t[0]),m)}<h4 style="font-size:14px">${mlabel(m)} ki tafseel</h4>${detail(id,m)}`;
  }else{const u=S.byId[id],r=u._r,types=RT[r];
    h=`<h2>${esc(u.name||'Unnamed')} <span class="r ${r}" style="font-size:11px">${RLAB[r]}</span></h2><div class="mut">${esc(u.email||'')} ${u.contact?'| '+esc(u.contact):''} | ${u._j.length} jamiaat</div>
    <h4>Saal bhar ki report (kitne jamiaat ne jama ki)</h4>${grid(u._j,types,m)}
    <h4 style="font-size:14px">${mlabel(m)}: jamia-wise</h4><div class="sc"><table><thead><tr><th>Jamia</th>${types.map(t=>`<th class="ty">${TYPES.find(x=>x[0]===t)[1]}</th>`).join('')}</tr></thead><tbody>${u._j.map(k=>`<tr data-jo="${esc(k)}" style="cursor:pointer"><td><b>${esc(S.byKey[k]?.name||k)}</b></td>${types.map(t=>`<td class="ty">${dot(cnt(k,m,t),false)}</td>`).join('')}</tr>`).join('')||'<tr><td class="mut">Koi jamia assign nahi</td></tr>'}</tbody></table></div>`;
  }
  $('mb').innerHTML=`<div style="text-align:right"><button class="tab" data-close>Close</button></div>`+h;$('md').style.display='flex';
}

// ---- events ----
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-t],[data-tab],[data-j],[data-u],[data-m],[data-uo],[data-jo],[data-close]');
  if(e.target.id==='md'){$('md').style.display='none';return}
  if(!t)return;const d=t.dataset;
  if(d.uo!==undefined){e.preventDefault();S.modal={kind:'u',id:d.uo};return modal()}
  if(d.jo!==undefined){S.modal={kind:'j',id:d.jo};return modal()}
  if(d.close!==undefined){$('md').style.display='none';return}
  if(d.m){S.dm=d.m;return modal()}
  if(d.t){S.focus=S.focus===d.t?null:d.t;S.tab='jamiaat';return render()}
  if(d.tab){S.tab=d.tab;return render()}
  if(d.j&&!e.target.closest('a')){S.dm=$('f-month').value;S.modal={kind:'j',id:d.j};return modal()}
  if(d.u){S.dm=$('f-month').value;S.modal={kind:'u',id:d.u};return modal()}
});
document.addEventListener('change',e=>{if(e.target.id==='f-sort'){S.sort=e.target.value;render()}});
['f-month','f-region','f-state'].forEach(i=>$(i).addEventListener('change',render));
$('f-q').addEventListener('input',render);
$('b-reset').onclick=()=>{$('f-month').value=S.curMonth;if(!$('f-region').disabled)$('f-region').value='all';if(!$('f-state').disabled)$('f-state').value='all';$('f-q').value='';S.focus=null;render()};
$('b-ref').onclick=load;
$('b-out').onclick=async()=>{if(confirm('Logout karna hai?')){sessionStorage.removeItem('impersonateUserId');await signOut(auth);location.href='index.html'}};
$('b-xls').onclick=()=>{
  const V=visible(),m=$('f-month').value;
  const rows=V.map(j=>{const o={Jamia:j.name,Code:j.code,Region:j.region,State:j.state};ROLES.forEach(r=>o[RLAB[r]]=zs(j.key,r).map(u=>u.name).join(', '));TYPES.forEach(([t,l])=>o[l]=cnt(j.key,m,t));return o});
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Jamiaat '+m);XLSX.writeFile(wb,`dashboard_${m}.xlsx`);
};

// ---- auth + scope, academic months ----
onAuthStateChanged(auth,async user=>{
  if(!user){location.href='index.html';return}
  try{
    loader(true,'Checking access...');
    let uid=user.uid;const imp=sessionStorage.getItem('impersonateUserId');if(user.uid===ADMIN_UID&&imp)uid=imp;
    const snap=await getDoc(doc(db,'users',uid));
    if(!snap.exists()&&user.uid!==ADMIN_UID){alert('User record nahi mila.');await signOut(auth);location.href='index.html';return}
    const p=snap.exists()?snap.data():{role:'admin',name:'Super Admin'};
    const role=String(p.role||'').toLowerCase().replace(/[\s-]/g,'_');
    S.isSuper=user.uid===ADMIN_UID||role==='admin';
    if(!(S.isSuper||role==='view_dashboard'||role.includes('view')||role.includes('dashboard'))){alert('Ye dashboard sirf View Dashboard users ke liye hai.');location.href='index.html';return}
    const sc=String(p.assignedScope||'').toLowerCase();
    S.aRegion=nReg(p.assignedRegion||'');S.aState=nSt(p.assignedState||'');
    S.scope=(sc==='region'&&S.aRegion)?'region':(sc==='state'&&S.aState)?'state':'all';
    $('who').textContent=(p.name||p.email||'User')+' | '+(S.scope==='region'?'Region '+S.aRegion:S.scope==='state'?'State '+S.aState:'All India');
    // academic year (Apr-Mar)
    const now=new Date();let sy=now.getMonth()>=3?now.getFullYear():now.getFullYear()-1;
    try{const c=await getDoc(doc(db,'settings','academic_config'));if(c.exists()){const ay=String(c.data().activeYear||c.data().academicYear||'').split('-')[0];if(+ay)sy=+ay}}catch(e){}
    S.months=Array.from({length:12},(_,i)=>{const mm=(3+i)%12;return (mm<3?sy+1:sy)+'-'+String(mm+1).padStart(2,'0')});
    const cur=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
    S.curMonth=S.months.includes(cur)?cur:S.months[0];S.dm=S.curMonth;
    $('f-month').innerHTML=S.months.map(m=>`<option value="${m}" ${m===S.curMonth?'selected':''}>${mlabel(m)}${m===cur?' (current)':''}</option>`).join('');
    await load();
  }catch(e){console.error(e);loader(false);alert('Dashboard load error: '+e.message)}
});
</script>
