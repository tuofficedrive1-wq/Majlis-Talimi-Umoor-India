<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Result</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
@font-face { font-family: 'Jameel Noori Nastaleeq'; src: url('https://cdn.jsdelivr.net/gh/sajjadsaeed/UrduFontsWeb@master/fonts/JameelNooriNastaleeq.woff2') format('woff2'); }
:root { --teal:#0f766e; --teal-d:#115e59; --bg:#f3f4f6; --bd:#e5e7eb; }
* { box-sizing: border-box; }
body { margin:0; font-family:'Jameel Noori Nastaleeq', Arial, sans-serif; background:var(--bg); color:#1f2937; }
.wrap { max-width:1300px; margin:0 auto; padding:16px; }
.card { background:#fff; border:1px solid var(--bd); border-radius:14px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); margin-bottom:14px; }
h1 { margin:0; font-size:26px; color:var(--teal-d); }
.sub { color:#6b7280; font-size:13px; font-family:Arial,sans-serif; margin-top:4px; }
.btn { border:0; border-radius:9px; padding:9px 14px; font-weight:700; cursor:pointer; font-size:13px; font-family:Arial,sans-serif; }
.btn-teal { background:var(--teal); color:#fff; } .btn-teal:hover { background:var(--teal-d); }
.btn-ind { background:#4f46e5; color:#fff; } .btn-ind:hover { background:#4338ca; }
.btn-gray { background:#fff; color:#374151; border:1px solid #d1d5db; }
.btn-sm { padding:5px 10px; font-size:12px; }
.btn:disabled { opacity:.5; cursor:wait; }
.tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.tab { padding:8px 14px; border-radius:9px; border:1px solid #d1d5db; background:#fff; cursor:pointer; font-size:15px; }
.tab.active { background:var(--teal); color:#fff; border-color:var(--teal); }
.bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
.bar input { flex:1; min-width:180px; padding:9px 12px; border:1px solid #d1d5db; border-radius:9px; font-size:14px; }
.tw { overflow-x:auto; border:1px solid var(--bd); border-radius:10px; }
table.res { border-collapse:collapse; width:100%; text-align:center; font-size:15px; }
table.res th { background:#1f2937; color:#fff; padding:8px; white-space:nowrap; position:sticky; top:0; }
table.res th.sj { background:var(--teal); }
table.res td { border:1px solid var(--bd); padding:6px 8px; }
table.res tr:nth-child(even) td { background:#f9fafb; }
.msg { text-align:center; padding:40px; color:#6b7280; font-family:Arial,sans-serif; }
#overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:50; }
#overlay div { background:#fff; padding:24px 34px; border-radius:14px; text-align:center; font-family:Arial,sans-serif; font-weight:700; }

/* offscreen print pages */
#print-area { position:absolute; left:-99999px; top:0; }
.pg { background:#fff; color:#000; direction:rtl; font-family:'Jameel Noori Nastaleeq', Arial, sans-serif; }
.pg-land { min-width:1123px; width:max-content; padding:22px 26px 26px; }

/* Margins Kam kiye gaye hain: padding 20px */
.pg-port { width:794px; min-height:1123px; padding:20px 20px; }

.hd { display:grid; grid-template-columns:1fr 2.4fr 1fr; align-items:start; direction:ltr; margin-bottom:12px; }
.hd .l { text-align:left; font-size:24px; padding-top:34px; }
.hd .r { text-align:right; font-size:24px; line-height:1.9; }
.hd .c { text-align:center; direction:rtl; }
.hd .c .t1 { font-size:30px; line-height:1.7; } .hd .c .t2 { font-size:28px; line-height:1.7; } .hd .c .t3 { font-size:30px; line-height:1.7; }
.xl { width:100%; border-collapse:collapse; text-align:center; border:2px solid #000; direction:ltr; }
.xl th { background:#115e59; color:#fff; border:0.5px solid #6b7280; padding:5px 3px; font-weight:700; line-height:1.5; vertical-align:middle; }
.xl td { white-space:nowrap; border:0.5px solid #d1d5db; padding:3px 6px; color:#000; font-weight:normal; line-height:1.6; }
.xl .num { display:block; font-family:Arial,sans-serif; font-size:11px; font-weight:400; }
.pg h2 { margin:0; text-align:center; font-size:30px; color:#115e59; }
.pg .tt { text-align:center; font-size:19px; margin:4px 0 12px; color:#374151; }

/* ===== Result Card (naya design) ===== */
/* Height ko 1083px kiya gaya padding margin adjust karne ke baad */
.rc-box { border:3px solid #115e59; padding:6px; min-height:1083px; display:flex; flex-direction:column; background:#fff; border-radius:6px; }
.rc-in { border:1.5px solid #c9a227; border-radius:4px; flex:1; display:flex; flex-direction:column; padding-bottom:16px; background:linear-gradient(#ffffff,#f0fdfa); }
.rc-top { background:linear-gradient(135deg,#0f766e 0%,#115e59 55%,#134e4a 100%); text-align:center; padding:14px 20px 12px; color:#fff; border-bottom:4px solid #c9a227; }
.rc-top .t-exam { font-size:42px; line-height:1.7; font-weight:700; color:#fde68a; }
.rc-top .t-idara { font-size:29px; line-height:1.7; color:#fff; }
.rc-body { padding:0 18px; flex:1; display:flex; flex-direction:column; }
.rc-title { text-align:center; margin:14px 0 6px; }
.rc-title span { display:inline-block; background:linear-gradient(90deg,#c9a227,#f5d76e,#c9a227); color:#3b2f00; font-size:25px; font-weight:700; padding:2px 36px; border-radius:30px; border:1px solid #a8861a; }
.rc-info { width:100%; border-collapse:collapse; margin:8px 0; font-size:19px; }
.rc-info td { border:1px solid #99d5cf; padding:5px 10px; width:50%; background:#fff; }
.rc-info td.ur { text-align:right; direction:rtl; }
.rc-info td.en { text-align:left; direction:ltr; font-family:Arial,sans-serif; font-size:16px; }
.rc-info .lb { display:inline-block; background:#0f766e; color:#fff; border-radius:5px; padding:0 8px; margin-left:6px; font-size:16px; }
.rc-info td.en .lb { background:#4f46e5; margin:0 6px 0 0; font-size:14px; }
.rc-small { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:6px 0 12px; }
.rc-small div { border:1px solid #cbd5e1; border-top:4px solid var(--c); background:var(--bg); border-radius:6px; padding:3px 6px; text-align:center; font-size:17px; }
.rc-small small { display:block; font-size:12px; color:#475569; }
.mk { width:100%; border-collapse:collapse; text-align:center; font-size:17px; border:1px solid #0f766e; }
.mk th { background:linear-gradient(#0f766e,#115e59); color:#fff; padding:6px 4px; border:1px solid #0f5a54; }
.mk td { border:1px solid #b6dcd8; padding:6px 4px; }
.mk tbody tr:nth-child(even) td { background:#ecfdf5; }
.mk td.sn { text-align:right; padding-right:10px; }
.mk .sen { display:block; font-family:Arial,sans-serif; font-size:11px; color:#475569; direction:ltr; text-align:right; line-height:1.2; }
.pill { display:inline-block; padding:0 12px; border-radius:20px; font-size:15px; font-weight:700; line-height:1.7; }
.pill.ok { background:#dcfce7; color:#166534; border:1px solid #86efac; }
.pill.bad { background:#fee2e2; color:#b91c1c; border:1px solid #fca5a5; }
.pill.ab { background:#ffedd5; color:#c2410c; border:1px solid #fdba74; }
.c1 .mk td { padding:3px 4px; font-size:15px; } .c1 .mk th { padding:4px; }
.c2 .mk td { padding:1px 4px; font-size:14px; } .c2 .mk .sen { font-size:10px; } .c2 .rc-top .t-exam { font-size:34px; } .c2 .rc-top .t-idara { font-size:24px; }
.rc-sum { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; text-align:center; }
.rc-sum > div { border:2px solid var(--c); background:var(--bg); border-radius:12px; padding:8px; font-size:18px; color:#334155; }
.rc-sum b { display:block; font-size:28px; color:var(--c); }
.rc-rank { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px; }
.rc-rank div { border:1px solid #e3c04d; background:#fffbeb; border-radius:8px; padding:4px; text-align:center; }
.rc-rank small { display:block; font-size:12px; color:#78560a; } .rc-rank b { font-size:19px; color:#92400e; }

/* Naye Signatures ke CSS */
.rc-foot { margin-top:auto; padding:20px 10px 10px; display:flex; justify-content:space-between; align-items:flex-end; font-size:17px; }
.sig-box { text-align: center; width: 30%; }
.sig-img { height: 60px; display: flex; align-items: flex-end; justify-content: center; margin-bottom: 5px; }
.sig-img img { max-height: 55px; max-width: 140px; object-fit: contain; }
.sig-line { border-top: 1.5px solid #115e59; margin-bottom: 4px; }
.sig-title { color: #115e59; font-size: 16px; font-weight: bold; }
.fail { color:#dc2626; font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
    <div>
      <h1 id="h-jamia">Loading…</h1>
      <div class="sub" id="h-exam"></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-teal" id="btn-class-pdf" disabled>📄 Class Result PDF</button>
      <button class="btn btn-ind" id="btn-jamia-pdf" disabled>📚 Poori Jamia PDF</button>
      <button class="btn btn-gray" id="btn-cards-pdf" disabled>🧾 Is Class ke Sab Report Cards</button>
    </div>
  </div>
  <div class="card">
    <div class="tabs" id="class-tabs"></div>
    <div class="bar"><input id="search" placeholder="Student ka naam ya roll no. se search karein…"><span class="sub" id="count"></span></div>
    <div class="tw"><table class="res" id="tbl"></table></div>
    <div class="msg" id="msg">Loading…</div>
  </div>
</div>
<div id="overlay"><div><div id="ov-text">Please wait…</div></div></div>
<div id="print-area"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDhPuyX0y1gb3uXoIRcdcQPkd5Q4KJFgl0", authDomain: "data-f15ab.firebaseapp.com", projectId: "data-f15ab",
  storageBucket: "data-f15ab.firebasestorage.app", messagingSenderId: "449137002393", appId: "1:449137002393:web:6a23721d00b1b0daeb3508"
});
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const showOv = (t) => { $('overlay').style.display = 'flex';$('ov-text').textContent = t; };
const hideOv = () => { $('overlay').style.display = 'none'; };

const P = new URLSearchParams(location.search);
const JAMIA = P.get('jamia') || '', EXAM_TYPE = P.get('examType') || '', EXAM_YEAR = P.get('examYear') || '';
const UID = P.get('uid') || '';

let classes = [], active = 0, acad = null;

// Sigs ke variables
let taleemiSigBase64 = '';
let nazimSigBase64 = '';

const getCorsFriendlyUrl = (url) => {
    if (!url) return null;
    let targetUrl = url.trim();
    if (targetUrl.includes("drive.google.com")) {
        let id = null;
        let match = targetUrl.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
        if (match) id = match[1];
        else { match = targetUrl.match(/[?&]id=([a-zA-Z0-9_-]+)/); if (match) id = match[1]; }
        if (id) {
            targetUrl = `https://docs.google.com/uc?export=view&id=${id}`;
            return `https://images.weserv.nl/?url=${encodeURIComponent(targetUrl.replace(/^https?:\/\//, ''))}`;
        }
    }
    return targetUrl;
};

const convertUrlToBase64 = async (url) => {
    if (!url) return null;
    try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("Network response was not ok.");
        const blob = await response.blob();
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.readAsDataURL(blob);
        });
    } catch (err) { return url; }
};

$('h-jamia').textContent = JAMIA || 'Jamia';$('h-exam').textContent = `${EXAM_TYPE} — ${EXAM_YEAR}`;

(async () => {
  showOv('Data aur Signatures load ho rahe hain…');
  try {
    const snap = await getDocs(query(collection(db, 'student_results'),
      where('jamia', '==', JAMIA), where('examType', '==', EXAM_TYPE), where('examYear', '==', EXAM_YEAR)));
    classes = snap.docs.map(d => d.data()).sort((a, b) => (a.order || 0) - (b.order || 0));
    
    try { const as = await getDoc(doc(db, 'settings', 'academic_config')); if (as.exists()) acad = as.data(); } catch (e) { console.warn('academic_config load nahi hua', e); }

    // Firebase se Admin/Principal ke Signatures Fetch Karna
    if (UID) {
        try {
            const uDoc = await getDoc(doc(db, 'users', UID));
            if (uDoc.exists()) {
                const uData = uDoc.data();
                if (uData.signatureTaleemi) {
                    taleemiSigBase64 = await convertUrlToBase64(getCorsFriendlyUrl(uData.signatureTaleemi));
                }
                
                let pSig = null;
                if (uData.academicYears) {
                    Object.values(uData.academicYears).forEach(yearData => {
                        if (yearData.karkardagiStructure) {
                            const jEntry = yearData.karkardagiStructure.find(j => j.jamiaName === JAMIA);
                            if (jEntry && jEntry.principalSignature) pSig = jEntry.principalSignature;
                        }
                    });
                }
                if (pSig) nazimSigBase64 = await convertUrlToBase64(getCorsFriendlyUrl(pSig));
            }
        } catch(e) { console.warn("Signature fetch error:", e); }
    }

    hideOv();
    if (!classes.length) { $('msg').textContent = 'Is jamia ka student-wise result abhi upload nahi hua.'; return; }$('msg').style.display = 'none';
    ['btn-class-pdf','btn-jamia-pdf','btn-cards-pdf'].forEach(i => $(i).disabled = false);
    renderTabs(); renderTable();
  } catch (e) { hideOv(); $('msg').textContent = 'Data load nahi hua: ' + e.message; }
})();

const renderTabs = () => {
  $('class-tabs').innerHTML = classes.map((c, i) => `<div class="tab ${i === active ? 'active' : ''}" data-i="${i}">${esc(c.darjah)} <small>(${c.students.length})</small></div>`).join('');
};
$('class-tabs').onclick = (e) => { const t = e.target.closest('.tab'); if (!t) return; active = +t.dataset.i; $('search').value = ''; renderTabs(); renderTable(); };$('search').oninput = () => renderTable();

const cellText = (v) => (v === undefined || v === null) ? '' : String(v);
const roleVal = (c, st, role) => c.roles && c.roles[role] ? cellText(st[c.roles[role]]) : '';

const renderTable = () => {
  const c = classes[active]; if (!c) return;
  const q = $('search').value.trim().toLowerCase();
  const rows = c.students.map((st, i) => ({ st, i })).filter(({ st }) => !q ||
    (roleVal(c, st, 'name') + ' ' + roleVal(c, st, 'roll') + ' ' + roleVal(c, st, 'father')).toLowerCase().includes(q));
  $('count').textContent = `${rows.length} / ${c.students.length} students`;
  $('tbl').innerHTML = `<thead><tr><th>#</th>${c.columns.map(col => `<th class="${col.isSubj ? 'sj' : ''}">${col.isSubj ? `<small style="font-family:Arial;font-weight:400">${esc(colNum(c, col))}</small><br>` : ''}${esc(col.label)}</th>`).join('')}<th>Report Card</th></tr></thead>
    <tbody>${rows.map(({ st, i }) => `<tr><td>${i + 1}</td>${c.columns.map(col => `<td style="${cellBg(c, col, st[col.key])}">${esc(cellText(st[col.key]))}</td>`).join('')}
      <td><button class="btn btn-teal btn-sm" data-card="${i}">🧾 PDF</button></td></tr>`).join('')}</tbody>`;
};
$('tbl').onclick = (e) => { const b = e.target.closest('[data-card]'); if (!b) return; const c = classes[active]; const st = c.students[+b.dataset.card]; makePdf([cardPage(c, st)], 'portrait', `ReportCard_${roleVal(c, st, 'name') || b.dataset.card}.pdf`); };

async function makePdf(pageHtmlList, orientation, filename) {
  showOv('PDF ban rahi hai…');
  try {
    await document.fonts.ready;
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation, unit: 'mm', format: 'a4' });
    const area = $('print-area');
    for (let i = 0; i < pageHtmlList.length; i++) {
      $('ov-text').textContent = `PDF ban rahi hai… ${i + 1} / ${pageHtmlList.length}`;
      area.innerHTML = pageHtmlList[i];
      const el = area.firstElementChild;
      const canvas = await window.html2canvas(el, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
      const img = canvas.toDataURL('image/jpeg', 0.92);
      const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
      let w = pw, h = canvas.height * pw / canvas.width;
      if (h > ph) { h = ph; w = canvas.width * ph / canvas.height; }
      if (i > 0) pdf.addPage();
      pdf.addImage(img, 'JPEG', (pw - w) / 2, 0, w, h);
    }
    area.innerHTML = '';
    pdf.save(filename);
  } catch (e) { alert('PDF error: ' + e.message); }
  hideOv();
}

const header = () => `<h2>${esc(JAMIA)}</h2><div class="tt">${esc(EXAM_TYPE)} — ${esc(EXAM_YEAR)}</div>`;

const isAbsent = (v) => { const t = String(v ?? '').trim(); return t === 'غ' || t === 'غائب' || t.toLowerCase() === 'a'; };
const kefColor = (v) => {
  const t = String(v ?? '').trim(); if (!t) return '';
  if (t.includes('الشرف') || t === 'A+') return '#00e04b';
  if (t.includes('ناکام') || t === 'F') return '#ff4d4d';
  if (t.includes('ضمنی') || t === 'Z') return '#ffff00';
  if (t.includes('جید جدا') || t === 'B' || t === 'B+') return '#00b0f0';
  if (t.includes('جید')) return '#bde0f5';
  if (t.includes('ممتاز') || t === 'A') return '#c4d79b';
  if (t.includes('مقبول') || t === 'C') return '#fde9a8';
  return '';
};
const colNum = (c, col) => { if (!col.isSubj) return ''; if (col.num) return col.num; const k = Object.keys(c.colMap || {}).find(n => c.colMap[n] === col.key); return k || ''; };
const cellBg = (c, col, v) => {
  if (c.roles && (col.key === c.roles.kefiyat || col.key === c.roles.grade)) { const k = kefColor(v); return k ? `background:${k};` : ''; }
  if (col.isSubj) {
    if (isAbsent(v)) return 'background:#d9d9d9;';
    const sc = c.subjects && c.subjects[colNum(c, col)];
    const t = String(v ?? '').trim();
    const m = t.includes('+') ? t.split('+').map(parseFloat).reduce((x, y) => x + y, 0) : parseFloat(t);
    if (sc && !isNaN(m) && m < (sc.pass ?? 0)) return 'background:#fbe4d5;';
  }
  return '';
};
const thHtml = (c, col) => `<th>${col.isSubj ? `<span class="num">${esc(colNum(c, col))}</span>` : ''}${esc(col.label)}</th>`;
const hasSerial = (c) => c.columns.some(col => /شمار|s\.?\s?no|sr\.?/i.test(col.label));

const pdfHeadHtml = (c) => {
  const h = c.pdfHeader || {};
  let jamiaText = esc(JAMIA);
  let regionText = '';
  
  if (c.students && c.students.length > 0) {
      const st = c.students[0];
      const jUr = roleVal(c, st, 'jamiaUr');
      if (jUr) jamiaText = esc(jUr);
      else if (c.roles && c.roles.jamia) {
          const jm = roleVal(c, st, 'jamia');
          if (jm) jamiaText = esc(jm);
      }
      const rgn = roleVal(c, st, 'region');
      if (rgn) {
          regionText = esc(rgn);
          if(!regionText.includes('ریجن')) regionText += ' ریجن';
      }
  }
  
  return `<div class="hd">
    <div class="l" style="padding-top:20px; font-size:26px; line-height:1.5; text-align:center; direction:rtl; font-weight:bold; color:#000;">
        <div>${jamiaText}</div>${regionText ? `<div>${regionText}</div>` : ''}
        ${c.course ? `<div>${esc(c.course)}</div>` : ''}
    </div>
    <div class="c" style="font-weight:bold; color:#000;">
        <div class="t1">${esc(h.title || (EXAM_TYPE + ' ' + EXAM_YEAR))}</div>
        <div class="t2">${esc(h.shoba || '')}</div>
        <div class="t3">${esc(h.idara || '')}</div>
    </div>
    <div class="r" style="padding-top:20px; font-size:36px; font-weight:bold; text-align:right; direction:rtl; color:#000;">
        ${esc(c.darjah)}
    </div>
  </div>`;
};

const classTablePages = (c) => {
  const hid = (c.pdfHeader && c.pdfHeader.hidden) || [];
  const cols = c.columns.filter(col => !hid.includes(col.key));
  const serial = !hasSerial(c);
  const perPage = 18;
  const total = Math.max(1, Math.ceil(c.students.length / perPage));
  const fs = cols.length > 20 ? 11 : cols.length > 16 ? 12 : 14;
  const pages = [];
  for (let p = 0; p < total; p++) {
    const slice = c.students.slice(p * perPage, (p + 1) * perPage);
    pages.push(`<div class="pg pg-land" style="font-size:${fs}px">${pdfHeadHtml(c)}
      <table class="xl"><thead><tr>${serial ? '<th>نمبر شمار</th>' : ''}${cols.map(col => thHtml(c, col)).join('')}</tr></thead>
      <tbody>${slice.map((st, k) => `<tr>${serial ? `<td>${p * perPage + k + 1}</td>` : ''}${cols.map(col => { const v = cellText(st[col.key]); return `<td style="${cellBg(c, col, v)}"><bdi>${esc(v)}</bdi></td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`);
  }
  return pages;
};

const rv = (c, st, role) => roleVal(c, st, role);
const biRow = (labUr, ur, labEn, en, noEn) => (ur || en) ? `<tr><td class="ur"><span class="lb">${labUr}</span> ${esc(ur || '—')}</td><td class="en">${noEn ? '' : `<span class="lb">${labEn}</span> <bdi>${esc(en || '—')}</bdi>`}</td></tr>` : '';

const norm = (s) => String(s ?? '').replace(/[\u064B-\u065F\u0670\u200c\u200d]/g, '').replace(/ي/g, 'ی').replace(/ك/g, 'ک').replace(/[ۃھه]/g, 'ہ').replace(/\s+/g, ' ').trim().toLowerCase();
const acadClass = (c) => {
  if (!acad || !acad.classes) return null;
  const d = norm(c.darjah); if (!d) return null;
  return acad.classes.find(x => norm(x.classNameUrdu) === d || norm(x.classNameEng) === d)
      || acad.classes.find(x => x.classNameUrdu && (d.includes(norm(x.classNameUrdu)) || norm(x.classNameUrdu).includes(d))) || null;
};
const acadSubjEn = (ac, name) => { if (!ac || !ac.subjects) return ''; const n = norm(name); const s = ac.subjects.find(x => norm(x.urdu) === n || norm(x.eng) === n); return s ? (s.eng || '') : ''; };
const CHIP = [['#2563eb', '#eff6ff'], ['#7c3aed', '#f5f3ff'], ['#db2777', '#fdf2f8'], ['#ea580c', '#fff7ed']];

const cardPage = (c, st) => {
  const ac = acadClass(c);
  const classEn = ac ? (ac.classNameEng || '') : '';
  let sumObt = 0, sumMax = 0, anyNum = false, n = 0;
  
  const rowsHtml = c.keys.map((num) => {
    const sc = c.subjects[num], key = c.colMap[num]; if (!sc || !key) return '';
    n++;
    const raw = cellText(st[key]).trim();
    const m = raw.includes('+') ? raw.split('+').map(parseFloat).reduce((a, b) => a + b, 0) : parseFloat(raw);
    const isAbs = raw === '' || isAbsent(raw);
    let status = '', cls = '';
    if (isAbs) { status = 'غائب'; cls = 'ab'; }
    else if (!isNaN(m)) { const ok = m >= sc.pass; status = ok ? 'کامیاب' : 'ناکام'; cls = ok ? 'ok' : 'bad'; sumObt += m; anyNum = true; }
    if (sc.max) sumMax += Number(sc.max) || 0;
    const en = acadSubjEn(ac, sc.name);
    return `<tr><td>${n}</td><td class="sn">${esc(sc.name)}${en ? `<span class="sen">${esc(en)}</span>` : ''}</td><td>${esc(sc.max ?? '')}</td><td>${esc(sc.pass ?? '')}</td><td style="font-weight:700">${esc(raw || '—')}</td><td>${status ? `<span class="pill ${cls}">${status}</span>` : ''}</td></tr>`;
  }).join('');
  
  const maxT = rv(c, st, 'maxTotal') || (sumMax ? String(sumMax) : '');
  const total = rv(c, st, 'total') || (anyNum ? String(sumObt) : '—');
  let pct = rv(c, st, 'percent');
  if (!pct && anyNum && sumMax) pct = (sumObt * 100 / sumMax).toFixed(2);
  const kef = rv(c, st, 'kefiyat') || '—';
  const grade = rv(c, st, 'grade');
  const kc = kefColor(kef) || '#ecfdf5';
  const ranks = c.columns.filter(col => /رینک|rank/i.test(col.label)).map(col => `<div><small>${esc(col.label)}</small><b>${esc(cellText(st[col.key]) || '—')}</b></div>`).join('');
  const jamiaUr = rv(c, st, 'jamiaUr'), jamiaEn = c.roles && c.roles.jamia ? cellText(st[c.roles.jamia]) : JAMIA;
  
  let ci = 0;
  const small = [['رول نمبر', 'roll'], ['داخلہ نمبر', 'admission'], ['تاریخ پیدائش', 'dob'], ['ریجن', 'region']].map(([l, r]) => { if (!rv(c, st, r)) return ''; const [cc, bg] = CHIP[ci++ % 4]; return `<div style="--c:${cc};--bg:${bg}"><small>${l}</small><bdi>${esc(rv(c, st, r))}</bdi></div>`; }).join('');
  
  const h = c.pdfHeader || {};
  const examTitle = h.title || (EXAM_TYPE + ' ' + EXAM_YEAR);
  const idara = h.idara || 'جامعات المدینہ لبنین دعوت اسلامی هند';
  const density = n > 14 ? 'c2' : n > 10 ? 'c1' : '';
  
  const nazimImg = nazimSigBase64 ? `<img src="${nazimSigBase64}" crossorigin="anonymous">` : '';
  const taleemiImg = taleemiSigBase64 ? `<img src="${taleemiSigBase64}" crossorigin="anonymous">` : '';

  const rcFoot = `
  <div class="rc-foot">
      <div class="sig-box">
          <div class="sig-img">${nazimImg}</div>
          <div class="sig-line"></div>
          <div class="sig-title">ناظم جامعہ</div>
      </div>
      <div class="sig-box">
          <div class="sig-img"></div>
          <div class="sig-line"></div>
          <div class="sig-title">مدرس</div>
      </div>
      <div class="sig-box">
          <div class="sig-img">${taleemiImg}</div>
          <div class="sig-line"></div>
          <div class="sig-title">تعلیمی ذمہ دار</div>
      </div>
  </div>`;

  return `<div class="pg pg-port"><div class="rc-box ${density}"><div class="rc-in">
    <div class="rc-top"><div class="t-exam">${esc(examTitle)}</div><div class="t-idara">${esc(idara)}</div></div>
    <div class="rc-body">
      <div class="rc-title"><span>رزلٹ کارڈ / Result Card</span></div>
      <table class="rc-info">${biRow('نام', rv(c, st, 'name'), 'Name', rv(c, st, 'nameEn'))}${biRow('ولدیت', rv(c, st, 'father'), 'Father', rv(c, st, 'fatherEn'))}${biRow('جامعہ', jamiaUr, 'Jamia', jamiaEn)}${biRow('درجہ', c.darjah, 'Class', classEn, !classEn)}</table>
      <div class="rc-small">${small}</div>
      <table class="mk"><thead><tr><th>#</th><th>مضمون</th><th>کل نمبر</th><th>پاسنگ</th><th>حاصل نمبر</th><th>نتیجہ</th></tr></thead><tbody>${rowsHtml}</tbody></table>
      <div class="rc-sum">
        <div style="--c:#1d4ed8;--bg:#eff6ff">حاصل / کل نمبر<b><bdi>${esc(total)}${maxT ? ' / ' + esc(maxT) : ''}</bdi></b></div>
        <div style="--c:#6d28d9;--bg:#f5f3ff">فیصد<b><bdi>${esc(pct || '—')}</bdi></b></div>
        <div style="--c:#115e59;--bg:${kc}">کیفیت${grade ? ' (' + esc(grade) + ')' : ''}<b>${esc(kef)}</b></div>
      </div>
      ${ranks ? `<div class="rc-rank">${ranks}</div>` : ''}
    </div>
    ${rcFoot}
  </div></div></div>`;
};

$('btn-class-pdf').onclick = () => { const c = classes[active]; makePdf(classTablePages(c), 'landscape', `Result_${JAMIA}_${c.darjah}.pdf`); };
$('btn-jamia-pdf').onclick = () => makePdf(classes.flatMap(classTablePages), 'landscape', `Result_${JAMIA}_${EXAM_YEAR}.pdf`);
$('btn-cards-pdf').onclick = () => { const c = classes[active]; makePdf(c.students.map(st => cardPage(c, st)), 'portrait', `ReportCards_${JAMIA}_${c.darjah}.pdf`); };
</script>
</body>
</html>
