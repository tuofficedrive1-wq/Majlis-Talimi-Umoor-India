<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c3a">
<title>استاد پورٹل</title>
<link href="https://fonts.cdnfonts.com/css/jameel-noori-nastaleeq" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<style>
:root{--g:#0f4c3a;--g2:#1b6b52;--gold:#c9a24b;--bg:#f6f1e6;--card:#fffdf7;--ink:#1f2a26;--mut:#7a857f;--line:#e6dfcd;--red:#b3392f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Jameel Noori Nastaleeq',serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.9}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.hdr{background:var(--g);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 22px;border-radius:0 0 26px 26px;position:sticky;top:0;z-index:5}
.hdr h1{margin:0;font-size:22px;line-height:1.5}.hdr small{opacity:.8;display:block}
.hdr .out{position:absolute;left:14px;top:calc(14px + env(safe-area-inset-top,0px));background:#ffffff22;border:0;color:#fff;border-radius:10px;padding:2px 10px;font:inherit;font-size:14px}
main{flex:1;padding:16px 14px calc(90px + env(safe-area-inset-bottom,0px))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:18px;color:var(--g)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font:700 28px/1.2 system-ui;color:var(--g)}.stat span{font-size:14px;color:var(--mut)}
.stat.warn b{color:var(--red)}
label{display:block;font-size:15px;color:var(--mut);margin:8px 2px 2px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-size:17px;color:var(--ink)}
input[type=number],input[dir=ltr]{direction:ltr;text-align:right}
textarea{min-height:110px}
.btn{width:100%;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:700;font-size:18px;background:var(--g);color:#fff;margin-top:12px}
.btn.alt{background:var(--gold);color:#2a2208}.btn.red{background:var(--red)}.btn:disabled{opacity:.55}
.tabs{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.tabs button{flex:1;border:0;background:none;padding:8px 0 6px;font:inherit;font-size:14px;color:var(--mut)}
.tabs button i{display:block;font-size:20px;line-height:1.4}
.tabs button.on{color:var(--g);font-weight:700}.tabs button.on i{color:var(--gold)}
.pill{display:inline-block;font-size:13px;padding:0 10px;border-radius:99px;background:#e3efe9;color:var(--g)}
.pill.no{background:#f6dedb;color:var(--red)}
.tas{background:#fbf3dc;border-right:4px solid var(--gold);border-radius:10px;padding:6px 10px;margin-top:8px;font-size:16px}
.muted{color:var(--mut);font-size:14px}.center{text-align:center}
.rec{width:78px;height:78px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:30px;margin:6px auto;display:block}
.rec.on{animation:p 1s infinite}@keyframes p{50%{transform:scale(1.1)}}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 18px;border-radius:12px;z-index:20;font-size:16px}
#login{padding:40px 20px;text-align:center}#login .logo{width:84px;height:84px;border-radius:24px;background:var(--g);color:var(--gold);font-size:38px;display:flex;align-items:center;justify-content:center;margin:20px auto}
</style>
</head>
<body>
<div id="app"><div id="login"><i class="fas fa-spinner fa-spin"></i> لوڈ ہو رہا ہے...</div></div>
<script>
firebase.initializeApp({apiKey:"AIzaSyDhPuyX0y1gb3uXoIRcdcQPkd5Q4KJFgl0",authDomain:"data-f15ab.firebaseapp.com",projectId:"data-f15ab",storageBucket:"data-f15ab.firebasestorage.app",messagingSenderId:"449137002393",appId:"1:449137002393:web:6a23721d00b1b0daeb3508"});
const db=firebase.firestore(),st=firebase.storage(),auth=firebase.auth();
const $=s=>document.querySelector(s),app=$('#app');
const MONTHS=['جنوری','فروری','مارچ','اپریل','مئی','جون','جولائی','اگست','ستمبر','اکتوبر','نومبر','دسمبر'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null,jamia=null,teacher=null,tab='home',cache={};
let rec={mr:null,chunks:[],blob:null,t:0,iv:null};

function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
const ls={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

async function boot(){
  await auth.signInAnonymously().catch(()=>{});
  const q=new URLSearchParams(location.search);
  S=q.get('jamiaId')&&q.get('userId')&&q.get('activeYear')?{jamiaId:decodeURIComponent(q.get('jamiaId')),userId:q.get('userId'),year:q.get('activeYear')}:ls.get('tp_s');
  if(!S)return loginView('لنک نامکمل ہے۔ اپنے ذمہ دار سے پورٹل کا لنک لیں۔',true);
  ls.set('tp_s',S);
  try{
    const u=await db.collection('users').doc(S.userId).get();
    const y=u.data()?.academicYears?.[S.year]?.karkardagiStructure||[];
    jamia=y.find(j=>j.jamiaName===S.jamiaId);
    if(!jamia)throw 0;
    S.zimmedar=u.data().name||'';
  }catch(e){return loginView('جامعہ کا ڈیٹا نہیں ملا۔',true)}
  const saved=ls.get('tp_code');
  if(saved){const t=jamia.teachers.find(x=>String(x.loginCode)===String(saved));if(t){teacher=t;return shell()}}
  loginView();
}
function loginView(err,dead){
  app.innerHTML=`<div id="login"><div class="logo"><i class="fas fa-chalkboard-user"></i></div>
  <h1 style="margin:0;color:var(--g)">استاد پورٹل</h1><p class="muted">${esc(S?.jamiaId||'مجلس تعلیمی امور')}</p>
  ${err?`<p style="color:var(--red)">${err}</p>`:''}
  ${dead?'':`<label>اپنا اجیر کوڈ درج کریں</label><input id="code" dir="ltr" inputmode="numeric" maxlength="5" placeholder="12345" style="text-align:center;font-size:24px;letter-spacing:6px">
  <button class="btn" onclick="doLogin()">داخل ہوں</button>`}</div>`;
}
function doLogin(){
  const c=$('#code').value.trim(),t=jamia.teachers.find(x=>String(x.loginCode)===c);
  if(!t)return toast('کوڈ غلط ہے');
  teacher=t;ls.set('tp_code',c);shell();
}
function logout(){localStorage.removeItem('tp_code');teacher=null;cache={};loginView()}

function shell(){
  app.innerHTML=`<div class="hdr"><button class="out" onclick="logout()">خروج</button><small>السلام علیکم</small><h1>${esc(teacher.name)}</h1><small>${esc(jamia.jamiaName)}</small></div><main id="v"></main>
  <nav class="tabs">${[['home','fa-house','ہوم'],['kark','fa-clipboard-list','کارکردگی'],['rec','fa-microphone','ریکارڈنگ'],['waz','fa-comment-dots','وضاحت']].map(t=>`<button data-t="${t[0]}" onclick="go('${t[0]}')"><i class="fas ${t[1]}"></i>${t[2]}</button>`).join('')}</nav>`;
  go('home');
}
function go(t){tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));scrollTo(0,0);({home:vHome,kark:vKark,rec:vRec,waz:vWaz})[t]()}
const V=h=>$('#v').innerHTML=h;
const loading=()=>V('<p class="center muted"><i class="fas fa-spinner fa-spin"></i></p>');

/* ---------- data ---------- */
async function getSubs(){
  if(cache.subs)return cache.subs;
  const s=await db.collection('teacher_submissions').where('teacherId','==',teacher.id).get();
  return cache.subs=s.docs.map(d=>d.data()).filter(x=>x.jamiaId===jamia.jamiaName);
}
async function getRecs(){
  if(cache.recs)return cache.recs;
  const now=new Date(),ids=[];
  for(let i=0;i<6;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);ids.push(`${S.userId}_${d.getFullYear()}_${d.getMonth()}`)}
  const out=[];
  await Promise.all(ids.map(async id=>{try{const d=await db.collection('monthly_reports').doc(id).get();(d.data()?.tadrisRecording?.data||[]).forEach(e=>{if(e.teacherName===teacher.name)out.push(e)})}catch(e){}}));
  return cache.recs=out.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}
async function getWaz(){
  if(cache.waz)return cache.waz;
  const c=ls.get('tp_code');
  const s=await db.collection('mahana_wazahat_records').where('ajeerCode','==',String(c)).get();
  return cache.waz=s.docs.map(d=>d.data()).sort((a,b)=>(b.timestamp||'').localeCompare(a.timestamp||''));
}
const tasOf=e=>e.tasurat||e.mufattishComment||'';

/* ---------- home ---------- */
async function vHome(){
  loading();
  const [subs,recs,waz]=await Promise.all([getSubs(),getRecs(),getWaz()]);
  const m=new Date().getMonth(),y=new Date().getFullYear();
  const done=subs.some(x=>+x.submissionMonth===m&&+x.submissionYear===y);
  const mr=recs.filter(e=>(e.date||'').startsWith(`${y}-${String(m+1).padStart(2,'0')}`));
  const tas=recs.filter(tasOf);
  V(`<div class="card"><h3>${MONTHS[m]} ${y}</h3>
   <p style="margin:0">ماہانہ کارکردگی: <span class="pill ${done?'':'no'}">${done?'جمع ہو چکی':'باقی ہے'}</span></p>
   ${done?'':`<button class="btn" onclick="go('kark')">ابھی رپورٹ بھریں</button>`}</div>
   <div class="grid"><div class="stat"><b>${mr.length}</b><span>اس ماہ ریکارڈنگ</span></div>
   <div class="stat"><b>${tas.length}</b><span>مفتش کے تاثرات</span></div>
   <div class="stat"><b>${waz.length}</b><span>جمع شدہ وضاحتیں</span></div>
   <div class="stat"><b>${(teacher.periods||[]).length}</b><span>میری کتب/پیریڈ</span></div></div>
   ${tas[0]?`<div class="card" style="margin-top:12px"><h3>تازہ تاثر</h3><div class="muted">${esc(tas[0].className)} - ${esc(tas[0].kitabName)} • ${esc(tas[0].date)}</div><div class="tas">${esc(tasOf(tas[0]))}</div></div>`:''}
   <button class="btn alt" onclick="go('rec')"><i class="fas fa-microphone"></i> نئی ریکارڈنگ</button>`);
}

/* ---------- karkardagi ---------- */
async function vKark(){
  loading();const subs=await getSubs();
  const now=new Date(),m=now.getMonth(),y=now.getFullYear();
  const sem=(()=>{return null})();
  const periods=(teacher.periods||[]);
  const doneIds=new Set(subs.filter(x=>+x.submissionMonth===m&&+x.submissionYear===y).map(x=>x.periodId));
  const rows=periods.map((p,i)=>{const pid=p.id||`${p.className}|${p.bookName}`;
    return doneIds.has(pid)?`<div class="card"><b>${esc(p.className)} - ${esc(p.bookName)}</b> <span class="pill">جمع ہو چکا</span></div>`:
    `<div class="card" data-p="${i}"><b>${esc(p.className)} - ${esc(p.bookName)}</b>
     <label>صفحات پڑھائے</label><input type="number" min="0" class="pg" inputmode="numeric">
     <label>سبق کی آخری عبارت</label><input class="ib">
     <label>آخری سبق کا صفحہ نمبر</label><input class="pn" dir="ltr"></div>`}).join('');
  const hist={};subs.forEach(x=>{const k=`${x.submissionYear}-${String(+x.submissionMonth).padStart(2,'0')}`;(hist[k]=hist[k]||[]).push(x)});
  V(`<div class="card"><h3>${MONTHS[m]} ${y} کی کارکردگی</h3><p class="muted" style="margin:0">ہر کتاب کے خانے بھر کر ایک ہی بار جمع کریں۔</p></div>
   ${rows||'<p class="center muted">کوئی پیریڈ مقرر نہیں</p>'}
   ${doneIds.size<periods.length?`<button class="btn" id="ks" onclick="saveKark()">جمع کریں</button>`:''}
   <h3 style="color:var(--g);margin:22px 4px 8px">میرا ریکارڈ</h3>
   ${Object.keys(hist).sort().reverse().map(k=>{const [yy,mm]=k.split('-');return `<div class="card"><b>${MONTHS[+mm]} ${yy}</b>${hist[k].map(x=>`<div class="muted">${esc(x.className)} - ${esc(x.bookName)}: ${x.pagesTaught} صفحات • ${esc(x.lastIbarat)}</div>`).join('')}</div>`}).join('')||'<p class="center muted">ابھی کوئی ریکارڈ نہیں</p>'}`);
}
async function saveKark(){
  const now=new Date(),batch=db.batch(),periods=teacher.periods||[];let n=0;
  for(const c of document.querySelectorAll('[data-p]')){
    const p=periods[+c.dataset.p],pg=c.querySelector('.pg').value,ib=c.querySelector('.ib').value.trim(),pn=c.querySelector('.pn').value.trim();
    if(pg===''||!ib||!pn)return toast('ہر کارڈ کے تینوں خانے بھریں');
    batch.set(db.collection('teacher_submissions').doc(),{jamiaId:jamia.jamiaName,teacherId:teacher.id,teacherName:teacher.name,periodId:p.id||`${p.className}|${p.bookName}`,className:p.className,bookName:p.bookName,pagesTaught:+pg,lastIbarat:ib,lastPageNo:pn,submissionMonth:now.getMonth(),submissionYear:now.getFullYear(),activeYear:S.year,submittedAt:firebase.firestore.FieldValue.serverTimestamp(),source:'teacher-portal'});n++;
  }
  if(!n)return;
  $('#ks').disabled=true;
  try{await batch.commit();cache.subs=null;toast('رپورٹ جمع ہو گئی');vKark()}catch(e){toast('خرابی: '+e.message);$('#ks').disabled=false}
}

/* ---------- recording ---------- */
async function vRec(){
  loading();const recs=await getRecs();
  const opts=(teacher.periods||[]).map(p=>`<option value="${esc(p.className)}|${esc(p.bookName)}">${esc(p.className)} - ${esc(p.bookName)}</option>`).join('');
  V(`<div class="card"><h3>نئی ریکارڈنگ</h3>
   <label>کلاس اور کتاب</label><select id="rc"><option value="">منتخب کریں</option>${opts}</select>
   <label>تاریخ</label><input type="date" id="rd" value="${new Date().toISOString().slice(0,10)}">
   <label>صفحہ نمبر</label><input id="rp" dir="ltr">
   <label>مکتبہ</label><input id="rm">
   <button class="rec" id="rb" onclick="toggleRec()"><i class="fas fa-microphone"></i></button>
   <p class="center muted" id="rt">ریکارڈنگ شروع کرنے کے لیے دبائیں</p>
   <audio id="ra" controls style="width:100%;display:none"></audio>
   <label>یا آڈیو فائل اپلوڈ کریں</label><input type="file" id="rf" accept="audio/*">
   <button class="btn" id="rs" onclick="saveRec()">محفوظ کریں</button></div>
   <h3 style="color:var(--g);margin:18px 4px 8px">میری ریکارڈنگز</h3>
   ${recs.map(e=>`<div class="card"><b>${esc(e.className)} - ${esc(e.kitabName)}</b><div class="muted">${esc(e.date)} • ${esc(e.duration||'')}</div>
    <audio controls preload="none" src="${esc(e.url)}" style="width:100%;margin-top:6px"></audio>
    ${tasOf(e)?`<div class="tas"><i class="fas fa-user-check"></i> ${esc(tasOf(e))}</div>`:'<span class="pill no" style="margin-top:6px">تاثرات کا انتظار</span>'}</div>`).join('')||'<p class="center muted">ابھی کوئی ریکارڈنگ نہیں</p>'}`);
}
async function toggleRec(){
  const b=$('#rb');
  if(rec.mr&&rec.mr.state!=='inactive'){rec.mr.stop();return}
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    rec.chunks=[];rec.blob=null;rec.t=0;rec.mr=new MediaRecorder(s);
    rec.mr.ondataavailable=e=>rec.chunks.push(e.data);
    rec.mr.onstop=()=>{clearInterval(rec.iv);s.getTracks().forEach(t=>t.stop());rec.blob=new Blob(rec.chunks,{type:'audio/webm'});b.classList.remove('on');b.innerHTML='<i class="fas fa-microphone"></i>';const a=$('#ra');a.src=URL.createObjectURL(rec.blob);a.style.display='block';$('#rt').textContent='ریکارڈنگ مکمل — سن کر محفوظ کریں'};
    rec.mr.start();b.classList.add('on');b.innerHTML='<i class="fas fa-stop"></i>';
    rec.iv=setInterval(()=>{rec.t++;$('#rt').textContent=`ریکارڈنگ جاری ہے ${Math.floor(rec.t/60)}:${String(rec.t%60).padStart(2,'0')}`},1000);
  }catch(e){toast('مائیک کی اجازت نہیں ملی')}
}
async function saveRec(){
  const cv=$('#rc').value,dt=$('#rd').value,f=$('#rf').files[0],file=f||rec.blob;
  if(!cv||!dt)return toast('کلاس اور تاریخ منتخب کریں');
  if(!file)return toast('ریکارڈنگ کریں یا فائل چنیں');
  const btn=$('#rs');btn.disabled=true;btn.textContent='اپلوڈ ہو رہا ہے...';
  try{
    const name=`Rec_${Date.now()}.${f?f.name.split('.').pop():'webm'}`,ref=st.ref().child('recordings/teachers/'+name);
    await ref.put(file);const url=await ref.getDownloadURL();
    const [className,kitabName]=cv.split('|'),d=new Date(dt),mm=Math.floor(rec.t/60)+':'+String(rec.t%60).padStart(2,'0');
    const entry={id:String(Date.now()),jamiaName:jamia.jamiaName,zimmedarName:S.zimmedar,teacherName:teacher.name,className,kitabName,date:dt,url,fileName:name,duration:f?'--:--':mm,uploadedBy:'TeacherPortal',createdAt:new Date().toISOString()};
    const pn=$('#rp').value.trim(),mk=$('#rm').value.trim();if(pn)entry.pageNumber=pn;if(mk)entry.maktaba=mk;
    await db.collection('monthly_reports').doc(`${S.userId}_${d.getFullYear()}_${d.getMonth()}`).set({tadrisRecording:{data:firebase.firestore.FieldValue.arrayUnion(entry)}},{merge:true});
    cache.recs=null;rec.blob=null;toast('ریکارڈنگ محفوظ ہو گئی');vRec();
  }catch(e){toast('خرابی: '+e.message);btn.disabled=false;btn.textContent='محفوظ کریں'}
}

/* ---------- wazahat ---------- */
async function vWaz(){
  loading();const w=await getWaz(),m=new Date().getMonth();
  V(`<div class="card"><h3>نئی وضاحت / کمزوری کی تفصیل</h3>
   <label>مہینہ</label><select id="wm">${MONTHS.map((n,i)=>`<option ${i===m?'selected':''}>${n}</option>`).join('')}</select>
   <label>وضاحت</label><textarea id="wt" placeholder="یہاں تفصیل لکھیں..."></textarea>
   <button class="btn" id="ws" onclick="saveWaz()">جمع کریں</button></div>
   <h3 style="color:var(--g);margin:18px 4px 8px">میری وضاحتیں</h3>
   ${w.map(x=>`<div class="card"><b>${esc(x.month)}</b> <span class="muted">${x.timestamp?new Date(x.timestamp).toLocaleDateString('ur-PK'):''}</span><div style="margin-top:4px">${esc(x.wazahat)}</div></div>`).join('')||'<p class="center muted">ابھی کوئی وضاحت نہیں</p>'}`);
}
async function saveWaz(){
  const t=$('#wt').value.trim();if(!t)return toast('وضاحت لکھیں');
  $('#ws').disabled=true;
  try{await db.collection('mahana_wazahat_records').add({jamia:jamia.jamiaName,teacherName:teacher.name,ajeerCode:String(ls.get('tp_code')),month:$('#wm').value,subjectsDetails:[],wazahat:t,linkId:'teacher-portal',timestamp:new Date().toISOString()});
    cache.waz=null;toast('وضاحت جمع ہو گئی');vWaz()}catch(e){toast('خرابی: '+e.message);$('#ws').disabled=false}
}
boot();
</script>
</body>
</html>
