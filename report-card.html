<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Report Card - MTUI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* 1. Font Definition */
        @font-face {
            font-family: 'Jameel Noori Nastaleeq';
            src: url('https://cdn.jsdelivr.net/gh/sajjadsaeed/UrduFontsWeb@master/fonts/JameelNooriNastaleeq.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
            unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF;
        }

        /* 2. Body Font Setting */
        body {
            font-family: 'Poppins', 'Jameel Noori Nastaleeq', sans-serif;
            background-color: #f3f4f6;
        }

        /* 3. Urdu Font Class */
        .urdu-font {
            font-family: 'Poppins', 'Jameel Noori Nastaleeq', sans-serif;
            font-size: 1.15rem;
            line-height: 1.8;
        }

        input, select, button {
            font-family: 'Poppins', 'Jameel Noori Nastaleeq', sans-serif;
        }

        /* A4 Page Styling */
        .a4-page {
            width: 210mm;
            min-height: 297mm;
            margin: 0 auto;
            background: white;
            padding: 15mm;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            direction: rtl;
        }

        .report-table th, .report-table td {
            border: 1px solid #d1d5db;
            padding: 8px;
            text-align: center;
        }
        
        .report-table th {
            background-color: #f8fafc;
            font-weight: 600;
            color: #1e293b;
        }

        /* Print Settings */
        @media print {
            body { background: white; margin: 0; padding: 0; }
            #control-panel, #site-header { display: none !important; }
            .a4-page { 
                width: 100%; height: auto; box-shadow: none; border-radius: 0; 
                margin: 0; padding: 10mm; page-break-after: always; 
            }
            .no-print { display: none !important; }
        }

        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #0d9488; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-800">

    <!-- Header -->
    <header id="site-header" class="bg-white shadow px-6 py-4 flex justify-between items-center relative z-10">
        <h1 class="text-2xl font-bold text-teal-700"><i class="fas fa-file-invoice mr-2"></i> Master Report Card</h1>
        <button onclick="window.location.href='index.html'" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg font-semibold transition">
            <i class="fas fa-arrow-left mr-2"></i> Dashboard
        </button>
    </header>

    <!-- Full Page Loader -->
    <div id="loader" class="fixed inset-0 bg-gray-900 bg-opacity-60 flex justify-center items-center z-50 hidden">
        <div class="bg-white p-6 rounded-xl flex flex-col items-center">
            <div class="loader mb-4"></div>
            <p class="text-teal-700 font-semibold">Generating Report...</p>
        </div>
    </div>

    <!-- Control Panel -->
    <div id="control-panel" class="max-w-6xl mx-auto mt-8 px-4">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row gap-4 items-end">
            <div class="w-full md:w-1/4">
                <label class="block text-sm font-bold text-gray-600 mb-1 uppercase">Select Month</label>
                <input type="month" id="filter-month" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500">
            </div>
            <div class="w-full md:w-1/4">
                <label class="block text-sm font-bold text-gray-600 mb-1 uppercase">Select Jamia</label>
                <select id="filter-jamia" class="w-full p-2.5 border border-gray-300 rounded-lg urdu-font focus:ring-2 focus:ring-teal-500">
                    <option value="">Jamia Select Karein</option>
                </select>
            </div>
            <div class="w-full md:w-1/4">
                <label class="block text-sm font-bold text-gray-600 mb-1 uppercase">Select Teacher</label>
                <select id="filter-teacher" class="w-full p-2.5 border border-gray-300 rounded-lg urdu-font focus:ring-2 focus:ring-teal-500" disabled>
                    <option value="">Pehle Jamia Select Karein</option>
                </select>
            </div>
            <div class="w-full md:w-1/4 flex gap-2">
                <button id="btn-generate" class="flex-1 bg-teal-600 hover:bg-teal-700 text-white font-bold py-2.5 px-4 rounded-lg transition shadow-md">
                    Generate
                </button>
            </div>
        </div>

        <div id="action-buttons" class="mt-4 flex justify-end gap-3 hidden">
            <button onclick="window.print()" class="bg-gray-800 hover:bg-gray-900 text-white px-5 py-2 rounded-lg font-semibold shadow transition">
                <i class="fas fa-print mr-2"></i> Print PDF
            </button>
            <button id="btn-download-img" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg font-semibold shadow transition">
                <i class="fas fa-image mr-2"></i> Save Image
            </button>
        </div>
    </div>

    <!-- Report Output Area -->
    <div class="w-full overflow-x-auto py-8">
        <div id="report-output-container" class="hidden">
            <!-- Report Card Inject Here -->
        </div>
        
        <div id="empty-state" class="text-center mt-12">
            <i class="fas fa-file-alt text-6xl text-gray-300 mb-4"></i>
            <h3 class="text-xl font-medium text-gray-500">Upar filter select kar ke Report Generate karein</h3>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDhPuyX0y1gb3uXoIRcdcQPkd5Q4KJFgl0",
          authDomain: "data-f15ab.firebaseapp.com",
          projectId: "data-f15ab",
          storageBucket: "data-f15ab.appspot.com",
          messagingSenderId: "449137002393",
          appId: "1:449137002393:web:6a23721d00b1b0daeb3508"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State Variables
        let currentUser = null;
        let userProfileData = {};
        let activeAcademicYear = null;
        let currentKarkardagiStructure = [];
        
        // DOM Elements
        const filterMonth = document.getElementById('filter-month');
        const filterJamia = document.getElementById('filter-jamia');
        const filterTeacher = document.getElementById('filter-teacher');
        const btnGenerate = document.getElementById('btn-generate');
        const loader = document.getElementById('loader');
        const reportOutput = document.getElementById('report-output-container');
        const emptyState = document.getElementById('empty-state');
        const actionButtons = document.getElementById('action-buttons');

        // Initializer
        onAuthStateChanged(auth, async user => {
            if (user) {
                currentUser = user;
                showLoader(true);
                await loadUserProfile();
                
                // Set default month
                const now = new Date();
                filterMonth.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
                
                showLoader(false);
            } else {
                window.location.href = 'index.html';
            }
        });

        const showLoader = (show) => loader.classList.toggle('hidden', !show);

        // Load User Data & Populate Jamia Dropdown
        async function loadUserProfile() {
            try {
                // Get Settings
                const settingsDoc = await getDoc(doc(db, "settings", "academic_config"));
                if (settingsDoc.exists()) activeAcademicYear = settingsDoc.data().activeYear;

                // Get User Profile
                const userDoc = await getDoc(doc(db, 'users', currentUser.uid));
                if (userDoc.exists()) {
                    userProfileData = userDoc.data();
                    
                    if (activeAcademicYear && userProfileData.academicYears && userProfileData.academicYears[activeAcademicYear]) {
                        currentKarkardagiStructure = userProfileData.academicYears[activeAcademicYear].karkardagiStructure || [];
                    }

                    // Populate Jamia Dropdown
                    const jamiaat = userProfileData.jamiaatList || [];
                    filterJamia.innerHTML = '<option value="">Jamia Select Karein</option>';
                    jamiaat.forEach(j => filterJamia.innerHTML += `<option value="${j}">${j}</option>`);
                }
            } catch (err) {
                console.error("Profile load error:", err);
                alert("Data load karne mein masla aaya.");
            }
        }

        // On Jamia Change -> Populate Teachers
        filterJamia.addEventListener('change', (e) => {
            const jamiaName = e.target.value;
            filterTeacher.innerHTML = '';
            
            if (!jamiaName) {
                filterTeacher.innerHTML = '<option value="">Pehle Jamia Select Karein</option>';
                filterTeacher.disabled = true;
                return;
            }

            filterTeacher.disabled = false;
            filterTeacher.innerHTML = '<option value="ALL" class="font-bold text-teal-700 bg-teal-50">Jamia Overall Summary</option>';
            
            const jamiaData = currentKarkardagiStructure.find(j => j.jamiaName === jamiaName);
            if (jamiaData && jamiaData.teachers) {
                jamiaData.teachers.forEach(t => {
                    filterTeacher.innerHTML += `<option value="${t.id}">${t.name}</option>`;
                });
            }
        });

        // -----------------------------------------------------
        // MAIN GENERATOR LOGIC
        // -----------------------------------------------------
        btnGenerate.addEventListener('click', async () => {
            const monthVal = filterMonth.value;
            const jamiaName = filterJamia.value;
            const teacherId = filterTeacher.value;

            if (!monthVal || !jamiaName || !teacherId) {
                alert("Barae karam Month, Jamia aur Teacher select karein.");
                return;
            }

            showLoader(true);
            emptyState.classList.add('hidden');
            reportOutput.classList.add('hidden');
            actionButtons.classList.add('hidden');

            try {
                // Calculate Parameters for Database Query
                const [yearStr, monthStr] = monthVal.split('-');
                const yearNum = parseInt(yearStr);
                const monthNum = parseInt(monthStr) - 1; // 0-11
                const academicYear = (monthNum >= 3) ? `${yearNum}-${yearNum + 1}` : `${yearNum - 1}-${yearNum}`;
                const reportId = `${currentUser.uid}_${academicYear}_${yearNum}_${monthNum}`;
                
                // Fetch Main Report Data
                const reportDoc = await getDoc(doc(db, 'monthly_reports', reportId));
                let reportData = { karkardagiReport: {}, jaizaReport: {}, monthlyTest: {}, tadrisRecording: {} };
                if (reportDoc.exists()) reportData = reportDoc.data();

                // Fetch Jaiza Detailed Forms (For book-wise weakness)
                const qJaiza = query(collection(db, "jaiza_forms"), where("jamiaId", "==", jamiaName), where("monthKey", "==", monthVal));
                const jaizaSnap = await getDocs(qJaiza);
                const jaizaForms = jaizaSnap.docs.map(d => d.data());

                // Fetch Monthly Test Sheets (For present/pass/fail)
                const qTest = query(collection(db, "monthly_test_sheets"), where("jamiaName", "==", jamiaName), where("month", "==", monthVal));
                const testSnap = await getDocs(qTest);
                const testSheets = testSnap.docs.map(d => d.data());

                // Fetch Teacher Submissions (For Deeni Kaam)
                const qSub = query(collection(db, "teacher_submissions"), where("submissionYear", "==", yearNum), where("submissionMonth", "==", monthNum), where("jamiaName", "==", jamiaName));
                const subSnap = await getDocs(qSub);
                const submissions = subSnap.docs.map(d => d.data());

                const rawData = { reportData, jaizaForms, testSheets, submissions };

                // Route to correct renderer
                if (teacherId === "ALL") {
                    renderJamiaSummaryCard(jamiaName, monthVal, rawData);
                } else {
                    renderTeacherCard(jamiaName, teacherId, monthVal, rawData);
                }

                reportOutput.classList.remove('hidden');
                actionButtons.classList.remove('hidden');

            } catch (err) {
                console.error("Generate error:", err);
                alert("Report generate karne me error aayi: " + err.message);
                emptyState.classList.remove('hidden');
            } finally {
                showLoader(false);
            }
        });

        // -----------------------------------------------------
        // 1. TEACHER REPORT CARD
        // -----------------------------------------------------
        function renderTeacherCard(jamiaName, teacherId, monthVal, raw) {
            // Get Teacher Info from Structure
            const jamiaStruct = currentKarkardagiStructure.find(j => j.jamiaName === jamiaName);
            const teacherInfo = jamiaStruct.teachers.find(t => t.id === teacherId);
            const teacherName = teacherInfo.name;
            
            // Format Month Name
            const dateObj = new Date(monthVal + "-01");
            const monthText = dateObj.toLocaleDateString('en-PK', { month: 'long', year: 'numeric' });

            // Fetch Teacher's Specific Data
            const kkdData = (raw.reportData.karkardagiReport?.data || []).filter(d => d.teacherId === teacherId);
            const tadrisData = (raw.reportData.tadrisRecording?.data || []).filter(d => d.teacherName === teacherName && d.jamiaName === jamiaName);
            const subData = raw.submissions.find(s => s.teacherId === teacherId && s.role !== 'user_update');
            const deeniKaam = subData?.deeniKaam || null;

            // HTML Construction
            let html = `
            <div class="a4-page" id="report-canvas">
                
                <!-- HEADER -->
                <div class="border-b-4 border-teal-700 pb-4 mb-6 text-center">
                    <h1 class="text-3xl font-bold text-teal-800 urdu-font mb-2">مجلس تعلیمی امور انڈیا</h1>
                    <h2 class="text-2xl font-bold text-gray-800 urdu-font bg-gray-100 inline-block px-6 py-2 rounded-full border border-gray-300">ماہانہ کارکردگی رپورٹ برائے اساتذہ</h2>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-6 bg-teal-50 p-4 rounded-lg border border-teal-200">
                    <div class="text-right">
                        <p class="text-sm text-gray-500">استاد کا نام</p>
                        <p class="text-xl font-bold text-gray-800 urdu-font">${teacherName}</p>
                    </div>
                    <div class="text-left">
                        <p class="text-sm text-gray-500">جامعۃ المدینہ</p>
                        <p class="text-xl font-bold text-gray-800 urdu-font" dir="rtl">${jamiaName}</p>
                    </div>
                    <div class="text-right mt-2">
                        <p class="text-sm text-gray-500">رپورٹ برائے ماہ</p>
                        <p class="text-lg font-semibold text-teal-700">${monthText}</p>
                    </div>
                </div>

                <!-- SECTION 1: NISAB (SYLLABUS) -->
                <h3 class="text-xl font-bold text-white bg-teal-700 py-2 px-4 rounded-t-lg urdu-font mb-0">تدریسی کارکردگی (نصاب)</h3>
                <table class="w-full report-table text-sm urdu-font mb-6">
                    <thead>
                        <tr>
                            <th>درجہ</th>
                            <th>کتاب</th>
                            <th>ماہانہ ہدف</th>
                            <th>پڑھایا گیا</th>
                            <th>فیصد (%)</th>
                            <th>کیفیت</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            if (kkdData.length === 0) {
                html += `<tr><td colspan="6" class="py-4 text-gray-500">اس ماہ کا کوئی ریکارڈ موجود نہیں ہے۔</td></tr>`;
            } else {
                kkdData.forEach(k => {
                    const color = k.kaifiyat === 'Mumtaz' ? 'text-green-600' : (k.kaifiyat === 'Behtar' ? 'text-blue-600' : 'text-red-600');
                    html += `
                    <tr>
                        <td>${k.className}</td>
                        <td class="font-bold text-gray-700">${k.bookName}</td>
                        <td>${k.monthlyTarget || 0}</td>
                        <td class="font-bold text-blue-700">${k.pagesTaught || 0}</td>
                        <td class="font-bold">${k.achievement || 0}%</td>
                        <td class="font-bold ${color}">${k.kaifiyat === 'Mumtaz' ? 'ممتاز' : (k.kaifiyat === 'Behtar' ? 'بہتر' : 'مناسب')}</td>
                    </tr>`;
                });
            }
            html += `</tbody></table>`;

            // SECTION 2 & 3: JAIZA AND TEST SIDE BY SIDE
            html += `<div class="grid grid-cols-2 gap-4 mb-6">`;

            // JAIZA
            html += `<div>
                <h3 class="text-lg font-bold text-white bg-indigo-600 py-1.5 px-4 rounded-t-lg urdu-font mb-0">جائزہ رپورٹ (Inspection)</h3>
                <table class="w-full report-table text-xs urdu-font">
                    <thead><tr><th>کتاب</th><th>فیصد</th><th>کمزوری / ریمارکس</th></tr></thead>
                    <tbody>`;
            
            let jaizaRows = '';
            raw.jaizaForms.forEach(form => {
                if(form.books) {
                    form.books.forEach(b => {
                        // Matching teacher name (Jaiza form saves name directly)
                        if (b.teacherName === teacherName) {
                            jaizaRows += `<tr><td>${b.bookName}</td><td class="font-bold">${b.percentage ? b.percentage.toFixed(1)+'%' : '-'}</td><td class="text-[11px] text-red-600">${b.weakness || '-'}</td></tr>`;
                        }
                    });
                }
            });
            html += jaizaRows ? jaizaRows : `<tr><td colspan="3" class="py-2 text-gray-500">اس ماہ جائزہ نہیں ہوا۔</td></tr>`;
            html += `</tbody></table></div>`;

            // MONTHLY TEST
            html += `<div>
                <h3 class="text-lg font-bold text-white bg-purple-600 py-1.5 px-4 rounded-t-lg urdu-font mb-0">ماہانہ ٹیسٹ</h3>
                <table class="w-full report-table text-xs urdu-font">
                    <thead><tr><th>کتاب</th><th>کل طلبہ</th><th>پاس</th><th>پاس فیصد</th></tr></thead>
                    <tbody>`;
            
            let testRows = '';
            // Test sheets save logic is complex, checking if class/book matches teacher's assigned books
            // Simplest approach: Match teacher's assigned classes/books in this jamia with the test sheets
            const teacherClasses = teacherInfo.periods.map(p => p.className);
            raw.testSheets.forEach(sheet => {
                // If sheet class matches teacher's class
                if (teacherClasses.includes(sheet.className)) {
                    let total = sheet.students?.length || 0;
                    let pass = sheet.students?.filter(s => s.status === 'Test Pass').length || 0;
                    let perc = total > 0 ? Math.round((pass/total)*100) : 0;
                    testRows += `<tr><td>${sheet.bookName || sheet.className}</td><td>${total}</td><td class="text-green-600 font-bold">${pass}</td><td class="font-bold">${perc}%</td></tr>`;
                }
            });
            html += testRows ? testRows : `<tr><td colspan="4" class="py-2 text-gray-500">ٹیسٹ کا ریکارڈ نہیں ملا۔</td></tr>`;
            html += `</tbody></table></div></div>`;

            // SECTION 4: TADRIS & DEENI KAAM
            html += `<h3 class="text-xl font-bold text-white bg-slate-700 py-2 px-4 rounded-t-lg urdu-font mb-0">تدریس ریکارڈنگ اور مدنی کام</h3>
            <div class="border border-slate-300 rounded-b-lg p-4 bg-white mb-6 grid grid-cols-2 gap-4">`;
            
            // Tadris Comments
            let tCommentAdmin = tadrisData.length > 0 ? tadrisData[0].tasurat : 'ریکارڈنگ جمع نہیں کروائی گئی۔';
            let tCommentZimmedar = tadrisData.length > 0 ? tadrisData[0].adminTasurat : '-';
            html += `<div class="urdu-font border-l border-gray-200 pl-4">
                        <p class="font-bold text-slate-700 mb-1">انسپکٹر کے تاثرات (تدریس):</p>
                        <p class="text-sm text-gray-600 bg-gray-50 p-2 rounded mb-2">${tCommentAdmin || '-'}</p>
                        <p class="font-bold text-slate-700 mb-1">ناظم / تعلیمی ذمہ دار کے تاثرات:</p>
                        <p class="text-sm text-gray-600 bg-gray-50 p-2 rounded">${tCommentZimmedar || '-'}</p>
                     </div>`;

            // Deeni Kaam Ticks
            const getIcon = (val) => val === 'ہاں' ? '<i class="fas fa-check-circle text-green-500"></i>' : '<i class="fas fa-times-circle text-red-500"></i>';
            if (deeniKaam) {
                html += `<div class="urdu-font text-sm flex flex-col justify-center gap-3 pr-4">
                    <div class="flex justify-between border-b pb-1"><span>ظہر درس:</span> <span>${getIcon(deeniKaam.zoharDars)}</span></div>
                    <div class="flex justify-between border-b pb-1"><span>ہفتہ وار اجتماع:</span> <span>${getIcon(deeniKaam.haftawarIjtima)}</span></div>
                    <div class="flex justify-between border-b pb-1"><span>مدنی مذاکرہ:</span> <span>${getIcon(deeniKaam.madaniMuzakarah)}</span></div>
                    <div class="flex justify-between border-b pb-1"><span>نیک اعمال:</span> <span>${getIcon(deeniKaam.naikAmaal)}</span></div>
                    <div class="flex justify-between"><span>مدنی قافلہ:</span> <span>${getIcon(deeniKaam.madaniQafilah)}</span></div>
                </div>`;
            } else {
                html += `<div class="text-gray-400 flex items-center justify-center">دینی کام کی رپورٹ جمع نہیں ہوئی۔</div>`;
            }
            html += `</div>`;

            // FOOTER (SIGNATURES)
            const zimmedarSig = userProfileData.signatureTaleemi ? `<img src="${userProfileData.signatureTaleemi}" class="h-12 w-auto mx-auto border-b border-black">` : `<div class="h-12 border-b border-black w-32 mx-auto"></div>`;
            
            html += `
                <div class="mt-12 flex justify-between px-10 text-center urdu-font">
                    <div>
                        ${zimmedarSig}
                        <p class="mt-2 font-bold text-gray-700">دستخط تعلیمی ذمہ دار</p>
                    </div>
                    <div>
                        <div class="h-12 border-b border-black w-32 mx-auto"></div>
                        <p class="mt-2 font-bold text-gray-700">دستخط ناظم / پرنسپل</p>
                    </div>
                    <div>
                        <div class="h-12 border-b border-black w-32 mx-auto"></div>
                        <p class="mt-2 font-bold text-gray-700">دستخط استاد</p>
                    </div>
                </div>
            </div>`;

            reportOutput.innerHTML = html;
        }

        // -----------------------------------------------------
        // 2. JAMIA SUMMARY REPORT CARD
        // -----------------------------------------------------
        function renderJamiaSummaryCard(jamiaName, monthVal, raw) {
            const dateObj = new Date(monthVal + "-01");
            const monthText = dateObj.toLocaleDateString('en-PK', { month: 'long', year: 'numeric' });

            const jamiaStruct = currentKarkardagiStructure.find(j => j.jamiaName === jamiaName);
            const totalTeachers = jamiaStruct.teachers.length;

            // Overall Stats Calculation
            const kkdData = (raw.reportData.karkardagiReport?.data || []).filter(d => d.jamiaName === jamiaName);
            let kkdTotal = 0; let kkdAchieved = 0;
            kkdData.forEach(k => { kkdTotal += k.monthlyTarget; kkdAchieved += k.pagesTaught; });
            const kkdOverallPerc = kkdTotal > 0 ? Math.round((kkdAchieved/kkdTotal)*100) : 0;

            const jaizaEntry = (raw.reportData.jaizaReport?.data || []).find(j => j.name === jamiaName);
            const jaizaOverall = jaizaEntry ? (jaizaEntry.percentage || jaizaEntry.type) : 'Pending';

            const testEntry = (raw.reportData.monthlyTest?.data || []).find(t => t.name === jamiaName);
            const testOverall = testEntry ? (testEntry.percentage || testEntry.status) : 'Pending';

            // HTML Construction
            let html = `
            <div class="a4-page" id="report-canvas">
                
                <div class="border-b-4 border-blue-800 pb-4 mb-6 text-center">
                    <h1 class="text-3xl font-bold text-blue-900 urdu-font mb-2">مجلس تعلیمی امور انڈیا</h1>
                    <h2 class="text-2xl font-bold text-gray-800 urdu-font bg-gray-100 inline-block px-6 py-2 rounded-full border border-gray-300">مجموعی کارکردگی رپورٹ برائے جامعہ</h2>
                </div>

                <div class="grid grid-cols-3 gap-4 mb-6 bg-blue-50 p-4 rounded-lg border border-blue-200 text-center">
                    <div><p class="text-sm text-gray-500">جامعۃ المدینہ</p><p class="text-xl font-bold text-blue-800 urdu-font">${jamiaName}</p></div>
                    <div class="border-x border-blue-200"><p class="text-sm text-gray-500">رپورٹ برائے ماہ</p><p class="text-lg font-semibold text-gray-800">${monthText}</p></div>
                    <div><p class="text-sm text-gray-500">کل اساتذہ</p><p class="text-xl font-bold text-gray-800">${totalTeachers}</p></div>
                </div>

                <div class="grid grid-cols-3 gap-4 mb-6">
                    <div class="bg-teal-100 border border-teal-300 p-3 rounded text-center shadow-sm">
                        <p class="urdu-font font-bold text-teal-800">مجموعی نصاب (Syllabus)</p>
                        <p class="text-2xl font-black text-teal-600 mt-1">${kkdOverallPerc}%</p>
                    </div>
                    <div class="bg-indigo-100 border border-indigo-300 p-3 rounded text-center shadow-sm">
                        <p class="urdu-font font-bold text-indigo-800">مجموعی جائزہ (Inspection)</p>
                        <p class="text-2xl font-black text-indigo-600 mt-1">${jaizaOverall}</p>
                    </div>
                    <div class="bg-purple-100 border border-purple-300 p-3 rounded text-center shadow-sm">
                        <p class="urdu-font font-bold text-purple-800">مجموعی ٹیسٹ (Test)</p>
                        <p class="text-2xl font-black text-purple-600 mt-1">${testOverall}</p>
                    </div>
                </div>

                <h3 class="text-xl font-bold text-white bg-blue-800 py-2 px-4 rounded-t-lg urdu-font mb-0">اساتذہ کی انفرادی کارکردگی</h3>
                <table class="w-full report-table text-sm urdu-font mb-6">
                    <thead>
                        <tr>
                            <th>استاد کا نام</th>
                            <th>نصاب مکمل (%)</th>
                            <th>جائزہ / کمزوری</th>
                            <th>تدریس ریکارڈنگ</th>
                            <th>مدنی کام</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            let weakPoints = [];

            jamiaStruct.teachers.forEach(t => {
                // Calc teacher syllabus
                let tTarget = 0; let tTaught = 0;
                kkdData.filter(d => d.teacherId === t.id).forEach(k => { tTarget += k.monthlyTarget; tTaught += k.pagesTaught; });
                const tPerc = tTarget > 0 ? Math.round((tTaught/tTarget)*100) : 0;
                
                if (tPerc < 60 && tTarget > 0) weakPoints.push(`استاد ${t.name} کا نصاب ہدف سے کافی پیچھے ہے۔ (${tPerc}%)`);

                // Jaiza Weakness
                let jWeakness = '-';
                raw.jaizaForms.forEach(form => {
                    form.books?.forEach(b => {
                        if (b.teacherName === t.name && b.weakness) {
                            jWeakness = b.weakness;
                            weakPoints.push(`استاد ${t.name} کے جائزے میں کمزوری: ${b.weakness}`);
                        }
                    });
                });

                // Tadris
                const tadrisDone = (raw.reportData.tadrisRecording?.data || []).some(d => d.teacherName === t.name) ? 'جمع ہے' : 'نہیں آئی';
                
                // Deeni Kaam
                const deeniKaam = raw.submissions.find(s => s.teacherId === t.id)?.deeniKaam;
                let dStatus = 'Missing';
                if(deeniKaam) {
                    const activeCount = Object.values(deeniKaam).filter(v => v === 'ہاں').length;
                    dStatus = activeCount >= 3 ? 'بہتر' : 'کمزور';
                }

                html += `
                <tr>
                    <td class="font-bold text-gray-800">${t.name}</td>
                    <td class="${tPerc < 60 ? 'text-red-600 font-bold' : 'text-blue-600'}">${tPerc}%</td>
                    <td class="text-[11px] text-red-600 max-w-xs">${jWeakness}</td>
                    <td class="${tadrisDone === 'جمع ہے' ? 'text-green-600' : 'text-red-500'}">${tadrisDone}</td>
                    <td class="${dStatus === 'بہتر' ? 'text-green-600' : 'text-red-500'}">${dStatus}</td>
                </tr>`;
            });

            html += `</tbody></table>`;

            // SECTION: KAMZOR PAHLU
            if (weakPoints.length > 0) {
                html += `
                <div class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
                    <h4 class="font-bold text-red-800 urdu-font mb-2"><i class="fas fa-exclamation-triangle mr-1"></i> توجہ طلب امور (Weak Areas)</h4>
                    <ul class="list-disc list-inside urdu-font text-red-700 text-sm space-y-1 pr-4">
                        ${weakPoints.slice(0, 5).map(w => `<li>${w}</li>`).join('')}
                    </ul>
                </div>`;
            }

            // FOOTER (SIGNATURES)
            const zimmedarSig = userProfileData.signatureTaleemi ? `<img src="${userProfileData.signatureTaleemi}" class="h-12 w-auto mx-auto border-b border-black">` : `<div class="h-12 border-b border-black w-32 mx-auto"></div>`;
            
            html += `
                <div class="mt-12 flex justify-around px-10 text-center urdu-font">
                    <div>
                        ${zimmedarSig}
                        <p class="mt-2 font-bold text-gray-700">دستخط تعلیمی ذمہ دار</p>
                    </div>
                    <div>
                        <div class="h-12 border-b border-black w-40 mx-auto"></div>
                        <p class="mt-2 font-bold text-gray-700">دستخط ناظمِ جامعہ / پرنسپل</p>
                    </div>
                </div>
            </div>`;

            reportOutput.innerHTML = html;
        }

        // -----------------------------------------------------
        // IMAGE DOWNLOAD LOGIC
        // -----------------------------------------------------
        document.getElementById('btn-download-img').addEventListener('click', async () => {
            const element = document.getElementById('report-canvas');
            if (!element) return;
            
            showLoader(true);
            try {
                const canvas = await html2canvas(element, { scale: 2, useCORS: true, allowTaint: true });
                const link = document.createElement('a');
                link.download = `Report_Card_${filterJamia.value}_${filterMonth.value}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            } catch (err) {
                console.error("Image generation error:", err);
                alert("Image banne mein masla aaya.");
            } finally {
                showLoader(false);
            }
        });
    </script>
</body>
</html>
