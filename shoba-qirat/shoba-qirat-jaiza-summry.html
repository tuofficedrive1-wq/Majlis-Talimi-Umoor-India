<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شعبہ قراءت - جائزہ سمری</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
    
    <style>
        @font-face {
            font-family: 'Jameel Noori Nastaleeq';
            src: url('https://cdn.jsdelivr.net/gh/sajjadsaeed/UrduFontsWeb@master/fonts/JameelNooriNastaleeq.woff2') format('woff2');
            font-weight: normal; font-style: normal; font-display: swap;
        }
        body { font-family: 'Poppins', 'Jameel Noori Nastaleeq', sans-serif; background-color: #f8fafc; margin: 0; padding: 0; }
        .urdu-font { font-family: 'Poppins', 'Jameel Noori Nastaleeq', sans-serif; font-size: 1.1rem; line-height: 1.8; }
        .eng-font { font-family: 'Poppins', sans-serif !important; }

        /* Custom Scrollbar for Table */
        .table-container::-webkit-scrollbar { width: 8px; height: 8px; }
        .table-container::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Loader */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #0d9488; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-6 text-slate-800">

    <div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        
        <!-- HEADER & FILTERS -->
        <div class="bg-teal-700 p-5 md:p-6 text-white border-b-4 border-teal-900">
            <h1 class="text-2xl md:text-3xl font-bold urdu-font text-center mb-6">تفصیلی جائزہ رپورٹ (طلبہ)</h1>
            
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 bg-teal-800/50 p-4 rounded-xl border border-teal-600/50 shadow-inner">
                <!-- Month Filter -->
                <div class="flex flex-col">
                    <label class="text-teal-100 text-xs font-bold mb-1 urdu-font">مہینہ (Month)</label>
                    <input type="month" id="filter-month" class="w-full p-2.5 rounded-lg text-slate-800 eng-font font-semibold outline-none focus:ring-2 focus:ring-teal-300 border-none shadow-sm">
                </div>
                <!-- Jamia Filter -->
                <div class="flex flex-col">
                    <label class="text-teal-100 text-xs font-bold mb-1 urdu-font">جامعہ (Jamia)</label>
                    <select id="filter-jamia" class="w-full p-2.5 rounded-lg text-slate-800 urdu-font font-bold outline-none focus:ring-2 focus:ring-teal-300 border-none shadow-sm">
                        <option value="All">تمام جامعات (All)</option>
                    </select>
                </div>
                <!-- Class Filter -->
                <div class="flex flex-col">
                    <label class="text-teal-100 text-xs font-bold mb-1 urdu-font">درجہ (Class)</label>
                    <select id="filter-class" class="w-full p-2.5 rounded-lg text-slate-800 urdu-font font-bold outline-none focus:ring-2 focus:ring-teal-300 border-none shadow-sm">
                        <option value="All">تمام درجات (All)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- STATS SUMMARY -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 p-5 md:p-6 border-b border-slate-100 bg-slate-50">
            <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm text-center">
                <p class="text-[11px] text-slate-500 font-bold urdu-font mb-1">کل طلبہ (Filtered)</p>
                <h3 id="stat-total" class="text-2xl font-black text-slate-800 eng-font">0</h3>
            </div>
            <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-200 shadow-sm text-center">
                <p class="text-[11px] text-emerald-700 font-bold urdu-font mb-1">ممتاز / ممتاز مع الشرف</p>
                <h3 id="stat-mumtaz" class="text-2xl font-black text-emerald-800 eng-font">0</h3>
            </div>
            <div class="bg-blue-50 p-3 rounded-xl border border-blue-200 shadow-sm text-center">
                <p class="text-[11px] text-blue-700 font-bold urdu-font mb-1">بہتر</p>
                <h3 id="stat-behtar" class="text-2xl font-black text-blue-800 eng-font">0</h3>
            </div>
            <div class="bg-red-50 p-3 rounded-xl border border-red-200 shadow-sm text-center">
                <p class="text-[11px] text-red-700 font-bold urdu-font mb-1">کمزور</p>
                <h3 id="stat-kamzor" class="text-2xl font-black text-red-800 eng-font">0</h3>
            </div>
        </div>

        <!-- TABLE SECTION -->
        <div class="p-5 md:p-6 relative">
            <div id="loading-spinner" class="absolute inset-0 bg-white/80 z-10 flex flex-col items-center justify-center pt-10">
                <div class="loader"></div>
                <p class="urdu-font text-teal-700 font-bold mt-2">ڈیٹا لوڈ ہو رہا ہے...</p>
            </div>

            <div class="table-container overflow-x-auto rounded-xl border border-slate-200 shadow-sm">
                <table class="w-full text-right whitespace-nowrap min-w-[800px]">
                    <thead class="bg-slate-100 border-b border-slate-200 text-slate-600">
                        <tr>
                            <th class="p-3 text-sm font-bold urdu-font w-12 text-center">#</th>
                            <th class="p-3 text-sm font-bold urdu-font">طالب علم کا نام</th>
                            <th class="p-3 text-sm font-bold urdu-font">جامعہ</th>
                            <th class="p-3 text-sm font-bold urdu-font">درجہ و استاد</th>
                            <th class="p-3 text-sm font-bold urdu-font text-center">کل نمبر</th>
                            <th class="p-3 text-sm font-bold urdu-font text-center">کیفیت</th>
                            <th class="p-3 text-sm font-bold urdu-font w-48">ریمارکس (اغلاط)</th>
                        </tr>
                    </thead>
                    <tbody id="students-table-body" class="divide-y divide-slate-100">
                        <!-- Rows js se aayengi -->
                    </tbody>
                </table>
            </div>
            
            <div id="no-data-msg" class="hidden text-center py-10 bg-slate-50 rounded-xl mt-4 border border-dashed border-slate-300">
                <i class="fas fa-folder-open text-4xl text-slate-300 mb-3"></i>
                <p class="urdu-font text-slate-500 font-bold text-lg">اس مہینے یا جامعہ کا کوئی ڈیٹا موجود نہیں ہے۔</p>
            </div>
        </div>
    </div>

    <!-- FIREBASE & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDhPuyX0y1gb3uXoIRcdcQPkd5Q4KJFgl0",
          authDomain: "data-f15ab.firebaseapp.com",
          projectId: "data-f15ab",
          storageBucket: "data-f15ab.appspot.com",
          messagingSenderId: "449137002393",
          appId: "1:449137002393:web:6a23721d00b1b0daeb3508"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Variables
        let allFlattenedStudents = [];
        let uniqueJamias = new Set();
        let uniqueClasses = new Set();
        
        // UI Elements
        const filterMonth = document.getElementById('filter-month');
        const filterJamia = document.getElementById('filter-jamia');
        const filterClass = document.getElementById('filter-class');
        const tableBody = document.getElementById('students-table-body');
        const loadingSpinner = document.getElementById('loading-spinner');
        const noDataMsg = document.getElementById('no-data-msg');

        // Set Default Month to Current Month
        const setInitialMonth = () => {
            const now = new Date();
            const monthVal = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            filterMonth.value = monthVal;
        };
        setInitialMonth();

        // 1. Fetch Data from Firebase
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await fetchJaizaData(user.uid);
            } else {
                tableBody.innerHTML = '<tr><td colspan="7" class="text-center p-6 text-red-500 font-bold urdu-font">براہ کرم لاگ ان کریں۔</td></tr>';
                loadingSpinner.classList.add('hidden');
            }
        });

        async function fetchJaizaData(userId) {
            loadingSpinner.classList.remove('hidden');
            allFlattenedStudents = [];
            uniqueJamias.clear();
            uniqueClasses.clear();

            try {
                // Fetch all reports for the user
                const q = query(collection(db, "monthly_reports"), where("userId", "==", userId));
                const querySnapshot = await getDocs(q);

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const docMonthKey = data.monthKey || data.month; // e.g., "2026-09"
                    
                    if (data.jaizaReport && data.jaizaReport.data) {
                        data.jaizaReport.data.forEach((jamiaEntry) => {
                            // Sirf wohi entry lenge jis me student ka data ho (Visit ya Nahi Hua ko skip karenge)
                            if (jamiaEntry.status === 'Jaiza' && jamiaEntry.students && jamiaEntry.students.length > 0) {
                                const jName = jamiaEntry.name;
                                const cName = jamiaEntry.details?.class || 'نامعلوم';
                                const tName = jamiaEntry.details?.teacher || 'نامعلوم';
                                
                                uniqueJamias.add(jName);
                                uniqueClasses.add(cName);

                                // Har student ka alag record banayen table ke liye
                                jamiaEntry.students.forEach((student) => {
                                    allFlattenedStudents.push({
                                        monthKey: docMonthKey,
                                        jamia: jName,
                                        className: cName,
                                        teacher: tName,
                                        studentName: student.name || 'نامعلوم',
                                        totalMarks: student.total !== null ? student.total : '-',
                                        grade: student.grade || '-',
                                        remarks: student.remarks || '-',
                                        date: jamiaEntry.submittedAt || '-'
                                    });
                                });
                            }
                        });
                    }
                });

                populateDropdowns();
                applyFiltersAndRender();

            } catch (error) {
                console.error("Data Fetch Error:", error);
                tableBody.innerHTML = '<tr><td colspan="7" class="text-center p-6 text-red-500 font-bold urdu-font">ڈیٹا لوڈ کرنے میں ایرر آیا۔</td></tr>';
            } finally {
                loadingSpinner.classList.add('hidden');
            }
        }

        // 2. Populate Dropdowns Dynamically
        function populateDropdowns() {
            // Jamia Dropdown
            filterJamia.innerHTML = '<option value="All">تمام جامعات (All)</option>';
            Array.from(uniqueJamias).sort().forEach(j => {
                const opt = document.createElement('option'); opt.value = j; opt.textContent = j;
                filterJamia.appendChild(opt);
            });

            // Class Dropdown
            filterClass.innerHTML = '<option value="All">تمام درجات (All)</option>';
            Array.from(uniqueClasses).sort().forEach(c => {
                const opt = document.createElement('option'); opt.value = c; opt.textContent = c;
                filterClass.appendChild(opt);
            });
        }

        // 3. Apply Filters and Render Table
        function applyFiltersAndRender() {
            const selectedMonth = filterMonth.value; // format: "YYYY-MM"
            const selectedJamia = filterJamia.value;
            const selectedClass = filterClass.value;

            const filteredData = allFlattenedStudents.filter(s => {
                const matchMonth = (selectedMonth === '' || s.monthKey === selectedMonth);
                const matchJamia = (selectedJamia === 'All' || s.jamia === selectedJamia);
                const matchClass = (selectedClass === 'All' || s.className === selectedClass);
                return matchMonth && matchJamia && matchClass;
            });

            renderTable(filteredData);
        }

        // 4. Render Table UI
        function renderTable(data) {
            tableBody.innerHTML = '';
            
            // Stats Variables
            let m_sharaf = 0, behtar = 0, kamzor = 0;

            if (data.length === 0) {
                noDataMsg.classList.remove('hidden');
                document.querySelector('.table-container').classList.add('hidden');
            } else {
                noDataMsg.classList.add('hidden');
                document.querySelector('.table-container').classList.remove('hidden');

                data.forEach((st, index) => {
                    // Badge Colors Logic
                    let gradeBadge = '';
                    if(st.grade === 'mumtaz-sharaf' || st.grade === 'mumtaz') { 
                        gradeBadge = '<span class="bg-emerald-100 text-emerald-800 border border-emerald-300 px-2 py-1 rounded text-xs font-bold urdu-font">ممتاز</span>'; 
                        m_sharaf++; 
                    }
                    else if(st.grade === 'behtar') { 
                        gradeBadge = '<span class="bg-blue-100 text-blue-800 border border-blue-300 px-2 py-1 rounded text-xs font-bold urdu-font">بہتر</span>'; 
                        behtar++; 
                    }
                    else if(st.grade === 'kamzor') { 
                        gradeBadge = '<span class="bg-red-100 text-red-800 border border-red-300 px-2 py-1 rounded text-xs font-bold urdu-font">کمزور</span>'; 
                        kamzor++; 
                    }
                    else { 
                        gradeBadge = '<span class="text-slate-400 font-bold">-</span>'; 
                    }

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-50 transition border-b border-slate-100";
                    tr.innerHTML = `
                        <td class="p-3 text-center text-slate-400 font-bold eng-font text-sm">${index + 1}</td>
                        <td class="p-3 text-slate-800 font-bold urdu-font text-lg whitespace-normal min-w-[200px]">${st.studentName}</td>
                        <td class="p-3 text-teal-700 font-bold urdu-font text-base">${st.jamia}</td>
                        <td class="p-3">
                            <p class="text-slate-800 font-bold urdu-font text-base leading-tight">${st.className}</p>
                            <p class="text-slate-500 urdu-font text-sm leading-tight mt-1">${st.teacher}</p>
                        </td>
                        <td class="p-3 text-center text-slate-700 font-black eng-font text-xl">${st.totalMarks}</td>
                        <td class="p-3 text-center">${gradeBadge}</td>
                        <td class="p-3 text-slate-600 urdu-font text-sm whitespace-normal min-w-[200px]">${st.remarks !== '' ? st.remarks : '-'}</td>
                    `;
                    tableBody.appendChild(tr);
                });
            }

            // Update Top Stats
            document.getElementById('stat-total').textContent = data.length;
            document.getElementById('stat-mumtaz').textContent = m_sharaf;
            document.getElementById('stat-behtar').textContent = behtar;
            document.getElementById('stat-kamzor').textContent = kamzor;
        }

        // 5. Event Listeners for Filters
        filterMonth.addEventListener('change', applyFiltersAndRender);
        filterJamia.addEventListener('change', applyFiltersAndRender);
        filterClass.addEventListener('change', applyFiltersAndRender);

    </script>
</body>
</html>
