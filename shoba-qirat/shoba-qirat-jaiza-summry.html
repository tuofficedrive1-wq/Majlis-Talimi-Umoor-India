<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شعبہ قراءت - جائزہ سمری</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
    
    <!-- Excel Generation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- html2pdf for perfect rendering without canvas blur/cut issues -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        @font-face {
            font-family: 'Jameel Noori Nastaleeq';
            src: url('https://cdn.jsdelivr.net/gh/sajjadsaeed/UrduFontsWeb@master/fonts/JameelNooriNastaleeq.woff2') format('woff2');
            font-weight: normal; font-style: normal; font-display: swap;
        }
        body { font-family: 'Poppins', 'Jameel Noori Nastaleeq', sans-serif; background-color: #f8fafc; margin: 0; padding: 0; }
        .urdu-font { font-family: 'Poppins', 'Jameel Noori Nastaleeq', sans-serif; font-size: 1.1rem; line-height: 1.8; }
        .eng-font { font-family: 'Poppins', sans-serif !important; }

        /* Custom Scrollbar for list container */
        .list-container {
            max-height: 65vh; 
            overflow-y: auto; 
            padding-right: 4px;
        }
        
        .list-container::-webkit-scrollbar { width: 6px; }
        .list-container::-webkit-scrollbar-track { background: transparent; }
        .list-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .list-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Loader */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #0d9488; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- PDF PRINT STYLES --- */
        #pdf-content { background: white; padding: 20px; }
        .pdf-table { width: 100%; border-collapse: collapse; direction: rtl; margin-top: 20px; font-family: 'Jameel Noori Nastaleeq', sans-serif; }
        .pdf-table th, .pdf-table td { border: 1px solid #e2e8f0; padding: 8px; text-align: right; font-size: 14px; line-height: 1.5; }
        .pdf-table th { background-color: #0f766e; color: white; font-weight: bold; }
        .pdf-table tr:nth-child(even) { background-color: #f8fafc; }
        .pdf-header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #0f766e; padding-bottom: 10px; }
        .pdf-header h2 { font-family: 'Jameel Noori Nastaleeq', sans-serif; font-size: 24px; color: #0f766e; margin: 0 0 5px 0; }
        .pdf-header p { margin: 0; color: #475569; font-family: 'Poppins', sans-serif; font-size: 12px; }
        
        .hide-in-pdf { display: none !important; }
    </style>
</head>
<body class="text-slate-800">

    <div class="bg-white flex flex-col h-screen overflow-hidden">
        
        <!-- COMPACT HEADER & FILTERS -->
        <div class="bg-teal-700 p-3 md:p-4 text-white shadow-md z-10 shrink-0">
            <div class="max-w-7xl mx-auto">
                <div class="flex flex-col sm:flex-row justify-between items-center gap-3 mb-3">
                    <h1 class="text-xl md:text-2xl font-bold urdu-font m-0 drop-shadow-md">تفصیلی جائزہ رپورٹ (طلبہ)</h1>
                    <div class="flex gap-2 w-full sm:w-auto">
                        <button id="btn-export-excel" class="flex-1 sm:flex-none bg-white/20 hover:bg-white/30 border border-white/40 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm transition flex justify-center items-center gap-2 backdrop-blur-sm">
                            <i class="fas fa-file-excel text-emerald-300 text-lg"></i> <span class="eng-font">Excel</span>
                        </button>
                        <button id="btn-export-pdf-html" class="flex-1 sm:flex-none bg-white/20 hover:bg-white/30 border border-white/40 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm transition flex justify-center items-center gap-2 backdrop-blur-sm">
                            <i class="fas fa-file-pdf text-red-300 text-lg"></i> <span class="eng-font">PDF</span>
                        </button>
                    </div>
                </div>
                
                <div class="flex flex-wrap gap-2">
                    <div class="flex-1 min-w-[120px]">
                        <input type="month" id="filter-month" class="w-full px-3 py-2 rounded-lg bg-teal-800/60 text-white border border-teal-600 focus:border-teal-300 outline-none eng-font text-sm">
                    </div>
                    <div class="flex-1 min-w-[120px]">
                        <select id="filter-jamia" class="w-full px-3 py-2 rounded-lg bg-teal-800/60 text-white border border-teal-600 focus:border-teal-300 outline-none urdu-font text-sm appearance-none">
                            <option value="All">تمام جامعات</option>
                        </select>
                    </div>
                    <div class="flex-1 min-w-[120px]">
                        <select id="filter-class" class="w-full px-3 py-2 rounded-lg bg-teal-800/60 text-white border border-teal-600 focus:border-teal-300 outline-none urdu-font text-sm appearance-none">
                            <option value="All">تمام درجات</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- STATS SUMMARY (Compact Horizontal Scroll for Mobile) -->
        <div class="bg-slate-50 border-b border-slate-200 p-3 shrink-0">
            <div class="max-w-7xl mx-auto flex gap-3 overflow-x-auto pb-1 scrollbar-hide">
                <div class="bg-white px-4 py-2 rounded-xl border border-slate-200 shadow-sm min-w-[120px] flex-1 flex flex-col items-center justify-center">
                    <p class="text-[10px] md:text-xs text-slate-500 font-bold urdu-font mb-0.5 whitespace-nowrap">کل طلبہ</p>
                    <h3 id="stat-total" class="text-xl md:text-2xl font-black text-slate-800 eng-font leading-none">0</h3>
                </div>
                <div class="bg-emerald-50 px-4 py-2 rounded-xl border border-emerald-200 shadow-sm min-w-[120px] flex-1 flex flex-col items-center justify-center">
                    <p class="text-[10px] md:text-xs text-emerald-700 font-bold urdu-font mb-0.5 whitespace-nowrap">ممتاز</p>
                    <h3 id="stat-mumtaz" class="text-xl md:text-2xl font-black text-emerald-800 eng-font leading-none">0</h3>
                </div>
                <div class="bg-blue-50 px-4 py-2 rounded-xl border border-blue-200 shadow-sm min-w-[120px] flex-1 flex flex-col items-center justify-center">
                    <p class="text-[10px] md:text-xs text-blue-700 font-bold urdu-font mb-0.5 whitespace-nowrap">بہتر</p>
                    <h3 id="stat-behtar" class="text-xl md:text-2xl font-black text-blue-800 eng-font leading-none">0</h3>
                </div>
                <div class="bg-red-50 px-4 py-2 rounded-xl border border-red-200 shadow-sm min-w-[120px] flex-1 flex flex-col items-center justify-center">
                    <p class="text-[10px] md:text-xs text-red-700 font-bold urdu-font mb-0.5 whitespace-nowrap">کمزور</p>
                    <h3 id="stat-kamzor" class="text-xl md:text-2xl font-black text-red-800 eng-font leading-none">0</h3>
                </div>
            </div>
        </div>

        <!-- MAIN UI (Modern List View) -->
        <div class="relative flex-grow overflow-hidden bg-slate-100 p-2 md:p-4">
            <div id="loading-spinner" class="absolute inset-0 bg-white/90 z-20 flex flex-col items-center justify-center">
                <div class="loader"></div>
                <p class="urdu-font text-teal-700 font-bold mt-2">ڈیٹا لوڈ ہو رہا ہے...</p>
            </div>

            <div class="max-w-7xl mx-auto h-full">
                <div class="list-container h-full space-y-3 pb-20" id="students-list-container">
                    <!-- Clean modern list items will be generated here -->
                </div>
                
                <div id="no-data-msg" class="hidden text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300 mt-4 mx-2">
                    <div class="bg-slate-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 border border-slate-100">
                        <i class="fas fa-search text-3xl text-slate-300"></i>
                    </div>
                    <p class="urdu-font text-slate-500 font-bold text-lg">اس مہینے یا جامعہ کا کوئی ڈیٹا موجود نہیں ہے۔</p>
                </div>
            </div>
        </div>

        <!-- HIDDEN PDF CONTENT STRUCTURE -->
        <div id="pdf-export-container" style="display: none;">
            <div id="pdf-content" dir="rtl">
                <div class="pdf-header">
                    <h2>شعبہ قراءت - تفصیلی جائزہ رپورٹ</h2>
                    <p id="pdf-subtitle">Month: - | Jamia: All</p>
                </div>
                <!-- Clean HTML Table for PDF -->
                <table class="pdf-table" id="pdf-data-table">
                    <thead>
                        <tr>
                            <th style="width: 5%; text-align: center;">#</th>
                            <th style="width: 15%;">جامعہ</th>
                            <th style="width: 15%;">درجہ</th>
                            <th style="width: 25%;">طالب علم کا نام</th>
                            <th style="width: 10%; text-align: center;">نمبر</th>
                            <th style="width: 10%; text-align: center;">کیفیت</th>
                            <th style="width: 20%;">ریمارکس</th>
                        </tr>
                    </thead>
                    <tbody id="pdf-table-body">
                        <!-- PDF rows will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- FIREBASE & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDhPuyX0y1gb3uXoIRcdcQPkd5Q4KJFgl0",
          authDomain: "data-f15ab.firebaseapp.com",
          projectId: "data-f15ab",
          storageBucket: "data-f15ab.appspot.com",
          messagingSenderId: "449137002393",
          appId: "1:449137002393:web:6a23721d00b1b0daeb3508"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Variables
        let allFlattenedStudents = [];
        let uniqueJamias = new Set();
        let uniqueClasses = new Set();
        let currentFilteredData = [];
        
        // UI Elements
        const filterMonth = document.getElementById('filter-month');
        const filterJamia = document.getElementById('filter-jamia');
        const filterClass = document.getElementById('filter-class');
        const listContainer = document.getElementById('students-list-container');
        const loadingSpinner = document.getElementById('loading-spinner');
        const noDataMsg = document.getElementById('no-data-msg');

        const setInitialMonth = () => {
            const now = new Date();
            const monthVal = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            filterMonth.value = monthVal;
        };
        setInitialMonth();

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await fetchJaizaData(user.uid);
            } else {
                listContainer.innerHTML = '<div class="text-center p-8 bg-white rounded-xl text-red-500 font-bold urdu-font">براہ کرم لاگ ان کریں۔</div>';
                loadingSpinner.classList.add('hidden');
            }
        });

        async function fetchJaizaData(userId) {
            loadingSpinner.classList.remove('hidden');
            allFlattenedStudents = [];
            uniqueJamias.clear();
            uniqueClasses.clear();

            try {
                const q = query(collection(db, "monthly_reports"), where("userId", "==", userId));
                const querySnapshot = await getDocs(q);

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const docMonthKey = data.monthKey || data.month;
                    
                    if (data.jaizaReport && data.jaizaReport.data) {
                        data.jaizaReport.data.forEach((jamiaEntry) => {
                            if (jamiaEntry.status === 'Jaiza' && jamiaEntry.students && jamiaEntry.students.length > 0) {
                                const jName = jamiaEntry.name;
                                const cName = jamiaEntry.details?.class || 'نامعلوم';
                                const tName = jamiaEntry.details?.teacher || 'نامعلوم';
                                
                                uniqueJamias.add(jName);
                                uniqueClasses.add(cName);

                                jamiaEntry.students.forEach((student) => {
                                    allFlattenedStudents.push({
                                        monthKey: docMonthKey,
                                        jamia: jName,
                                        className: cName,
                                        teacher: tName,
                                        studentName: student.name || 'نامعلوم',
                                        totalMarks: student.total !== null ? student.total : '-',
                                        grade: student.grade || '-',
                                        remarks: student.remarks || '-',
                                        date: jamiaEntry.submittedAt || '-'
                                    });
                                });
                            }
                        });
                    }
                });

                populateDropdowns();
                applyFiltersAndRender();

            } catch (error) {
                console.error("Data Fetch Error:", error);
                listContainer.innerHTML = '<div class="text-center p-8 bg-white rounded-xl text-red-500 font-bold urdu-font">ڈیٹا لوڈ کرنے میں ایرر آیا۔</div>';
            } finally {
                loadingSpinner.classList.add('hidden');
            }
        }

        function populateDropdowns() {
            filterJamia.innerHTML = '<option value="All">تمام جامعات</option>';
            Array.from(uniqueJamias).sort().forEach(j => {
                const opt = document.createElement('option'); opt.value = j; opt.textContent = j;
                filterJamia.appendChild(opt);
            });

            filterClass.innerHTML = '<option value="All">تمام درجات</option>';
            Array.from(uniqueClasses).sort().forEach(c => {
                const opt = document.createElement('option'); opt.value = c; opt.textContent = c;
                filterClass.appendChild(opt);
            });
        }

        function applyFiltersAndRender() {
            const selectedMonth = filterMonth.value;
            const selectedJamia = filterJamia.value;
            const selectedClass = filterClass.value;

            currentFilteredData = allFlattenedStudents.filter(s => {
                const matchMonth = (selectedMonth === '' || s.monthKey === selectedMonth);
                const matchJamia = (selectedJamia === 'All' || s.jamia === selectedJamia);
                const matchClass = (selectedClass === 'All' || s.className === selectedClass);
                return matchMonth && matchJamia && matchClass;
            });

            currentFilteredData.sort((a, b) => {
                if(a.jamia !== b.jamia) return a.jamia.localeCompare(b.jamia, 'ur');
                if(a.className !== b.className) return a.className.localeCompare(b.className, 'ur');
                return a.studentName.localeCompare(b.studentName, 'ur');
            });

            renderList(currentFilteredData);
        }

        // ==========================================
        // NEW MOBILE-FRIENDLY LIST RENDERING
        // ==========================================
        function renderList(data) {
            listContainer.innerHTML = '';
            let m_sharaf = 0, behtar = 0, kamzor = 0;

            if (data.length === 0) {
                noDataMsg.classList.remove('hidden');
            } else {
                noDataMsg.classList.add('hidden');

                // Group by Jamia and Class for cleaner UI (Optional, but looks better)
                let currentJamiaClass = '';

                data.forEach((st, index) => {
                    let gradeBg = 'bg-slate-100 border-slate-200 text-slate-600';
                    let gradeBadgeBg = 'bg-slate-200 text-slate-600';
                    let gradeText = '-';
                    let iconClass = 'fa-minus';

                    if(st.grade === 'mumtaz-sharaf' || st.grade === 'mumtaz') { 
                        gradeBg = 'bg-emerald-50 border-emerald-100 text-emerald-800 hover:border-emerald-300 hover:shadow-md';
                        gradeBadgeBg = 'bg-emerald-100 text-emerald-700 border border-emerald-200';
                        gradeText = 'ممتاز';
                        iconClass = 'fa-star text-emerald-500';
                        m_sharaf++; 
                    }
                    else if(st.grade === 'behtar') { 
                        gradeBg = 'bg-blue-50 border-blue-100 text-blue-800 hover:border-blue-300 hover:shadow-md';
                        gradeBadgeBg = 'bg-blue-100 text-blue-700 border border-blue-200';
                        gradeText = 'بہتر';
                        iconClass = 'fa-thumbs-up text-blue-500';
                        behtar++; 
                    }
                    else if(st.grade === 'kamzor') { 
                        gradeBg = 'bg-red-50 border-red-100 text-red-800 hover:border-red-300 hover:shadow-md';
                        gradeBadgeBg = 'bg-red-100 text-red-700 border border-red-200';
                        gradeText = 'کمزور';
                        iconClass = 'fa-exclamation-circle text-red-500';
                        kamzor++; 
                    }

                    // Check if we need a new section header
                    const itemJamiaClass = `${st.jamia} - ${st.className}`;
                    if(itemJamiaClass !== currentJamiaClass) {
                        const header = document.createElement('div');
                        header.className = "sticky top-0 bg-slate-100 py-2 px-1 z-10 flex items-center gap-2 mt-4 first:mt-0";
                        header.innerHTML = `
                            <div class="h-1 flex-grow bg-slate-200 rounded-full"></div>
                            <span class="text-xs font-bold text-slate-500 urdu-font bg-white px-3 py-1 rounded-full border border-slate-200 shadow-sm inline-flex items-center gap-2">
                                <i class="fas fa-building text-teal-600"></i> ${st.jamia} <span class="text-slate-300">|</span> <i class="fas fa-chalkboard text-teal-600"></i> ${st.className}
                            </span>
                            <div class="h-1 flex-grow bg-slate-200 rounded-full"></div>
                        `;
                        listContainer.appendChild(header);
                        currentJamiaClass = itemJamiaClass;
                    }

                    const card = document.createElement('div');
                    card.className = `flex flex-col sm:flex-row bg-white border-l-4 rounded-xl p-3 sm:p-4 shadow-sm transition-all duration-200 w-full mb-3 ${gradeBg}`;
                    
                    // Force border-left color based on grade
                    if(gradeText === 'ممتاز') card.style.borderLeftColor = '#10b981';
                    else if(gradeText === 'بہتر') card.style.borderLeftColor = '#3b82f6';
                    else if(gradeText === 'کمزور') card.style.borderLeftColor = '#ef4444';
                    else card.style.borderLeftColor = '#cbd5e1';

                    card.innerHTML = `
                        <!-- Top Row for Mobile / Left Side for Desktop -->
                        <div class="flex justify-between items-start w-full sm:w-2/3 gap-3">
                            <div class="flex items-start gap-3 w-full">
                                <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0 shadow-sm ${gradeBadgeBg} mt-1 border">
                                    <span class="eng-font font-black text-xs opacity-70">${index + 1}</span>
                                </div>
                                <div class="flex flex-col w-full">
                                    <h4 class="font-bold urdu-font text-lg md:text-xl text-slate-800 leading-tight mb-1">${st.studentName}</h4>
                                    
                                    <div class="flex items-center gap-2 text-xs md:text-sm font-medium urdu-font opacity-80 mt-1 flex-wrap">
                                        <span class="inline-flex items-center gap-1 bg-white/50 px-2 py-0.5 rounded border border-black/5"><i class="fas fa-user-tie text-[10px] opacity-60"></i> ${st.teacher}</span>
                                    </div>

                                    ${st.remarks !== '' ? `
                                        <div class="mt-3 bg-white/60 p-2.5 rounded-lg border border-black/5 text-sm urdu-font text-slate-600 leading-snug flex items-start gap-2">
                                            <i class="fas fa-comment-dots text-slate-400 mt-1 shrink-0"></i>
                                            <span class="break-words">${st.remarks}</span>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        </div>

                        <!-- Divider for Mobile -->
                        <div class="w-full h-px bg-black/5 my-3 sm:hidden block"></div>

                        <!-- Bottom Row for Mobile / Right Side for Desktop -->
                        <div class="flex sm:flex-col justify-between sm:justify-center items-center w-full sm:w-1/3 sm:border-l sm:border-black/5 sm:pl-4 sm:ml-4">
                            <div class="text-center">
                                <p class="text-[10px] uppercase font-bold text-slate-400 eng-font tracking-wider mb-0.5 sm:mb-1">Score</p>
                                <div class="font-black eng-font text-2xl md:text-3xl leading-none">${st.totalMarks}</div>
                            </div>
                            
                            <div class="text-center sm:mt-2">
                                <span class="px-3 py-1.5 rounded-lg font-bold urdu-font text-sm md:text-base inline-flex items-center gap-1.5 shadow-sm ${gradeBadgeBg}">
                                    <i class="fas ${iconClass} text-xs opacity-80"></i> ${gradeText}
                                </span>
                            </div>
                        </div>
                    `;
                    listContainer.appendChild(card);
                });
            }

            document.getElementById('stat-total').textContent = data.length;
            document.getElementById('stat-mumtaz').textContent = m_sharaf;
            document.getElementById('stat-behtar').textContent = behtar;
            document.getElementById('stat-kamzor').textContent = kamzor;
        }

        // 5. Event Listeners for Filters
        filterMonth.addEventListener('change', applyFiltersAndRender);
        filterJamia.addEventListener('change', applyFiltersAndRender);
        filterClass.addEventListener('change', applyFiltersAndRender);

        // ==========================================
        // EXPORT FUNCTIONALITY (EXCEL & PDF)
        // ==========================================

        document.getElementById('btn-export-excel').addEventListener('click', () => {
            if(currentFilteredData.length === 0) { alert('ڈاؤنلوڈ کرنے کے لیے کوئی ڈیٹا نہیں ہے۔'); return; }

            const excelData = [];
            excelData.push(['S.No', 'Jamia', 'Class', 'Teacher', 'Student Name', 'Total Marks', 'Grade', 'Remarks']);

            currentFilteredData.forEach((st, index) => {
                 let gradeText = '-';
                 if(st.grade === 'mumtaz-sharaf' || st.grade === 'mumtaz') gradeText = 'ممتاز';
                 else if(st.grade === 'behtar') gradeText = 'بہتر';
                 else if(st.grade === 'kamzor') gradeText = 'کمزور';

                excelData.push([
                    index + 1,
                    st.jamia,
                    st.className,
                    st.teacher,
                    st.studentName,
                    st.totalMarks,
                    gradeText,
                    st.remarks
                ]);
            });

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(excelData);
            if(!ws['!views']) ws['!views'] = [];
            ws['!views'].push({rightToLeft: true});

            XLSX.utils.book_append_sheet(wb, ws, "Jaiza Report");
            
            const month = document.getElementById('filter-month').value;
            XLSX.writeFile(wb, `Jaiza_Report_${month}.xlsx`);
        });

        // ==========================================
        // HTML2PDF.JS EXPORT (Clean Urdu Font Render)
        // ==========================================
        document.getElementById('btn-export-pdf-html').addEventListener('click', () => {
            if(currentFilteredData.length === 0) { alert('ڈاؤنلوڈ کرنے کے لیے کوئی ڈیٹا نہیں ہے۔'); return; }
            
            const month = document.getElementById('filter-month').value;
            const jamiaFilter = document.getElementById('filter-jamia').value;
            document.getElementById('pdf-subtitle').textContent = `Month: ${month || 'All'} | Jamia: ${jamiaFilter === 'All' ? 'All Jamiaat' : jamiaFilter}`;
            
            const pdfTableBody = document.getElementById('pdf-table-body');
            pdfTableBody.innerHTML = ''; 

            currentFilteredData.forEach((st, index) => {
                 let gradeText = '-';
                 if(st.grade === 'mumtaz-sharaf' || st.grade === 'mumtaz') gradeText = 'ممتاز';
                 else if(st.grade === 'behtar') gradeText = 'بہتر';
                 else if(st.grade === 'kamzor') gradeText = 'کمزور';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="text-align: center;">${index + 1}</td>
                    <td>${st.jamia}</td>
                    <td>${st.className}<br><span style="font-size: 10px; color: #64748b;">${st.teacher}</span></td>
                    <td>${st.studentName}</td>
                    <td style="text-align: center;">${st.totalMarks}</td>
                    <td style="text-align: center;">${gradeText}</td>
                    <td>${st.remarks !== '' ? st.remarks : '-'}</td>
                `;
                pdfTableBody.appendChild(tr);
            });

            const pdfContainer = document.getElementById('pdf-export-container');
            pdfContainer.style.display = 'block';

            const opt = {
                margin:       10,
                filename:     `Jaiza_Report_${month}.pdf`,
                image:        { type: 'jpeg', quality: 1 },
                html2canvas:  { scale: 2, useCORS: true }, 
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
            };

            const element = document.getElementById('pdf-content');

            html2pdf().set(opt).from(element).save().then(() => {
                pdfContainer.style.display = 'none';
            });
        });

    </script>
</body>
</html>
