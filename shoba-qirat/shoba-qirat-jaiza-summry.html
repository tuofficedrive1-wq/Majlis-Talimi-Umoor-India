<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شعبہ قراءت - جائزہ سمری</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
    
    <!-- PDF Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <!-- Excel Generation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        @font-face {
            font-family: 'Jameel Noori Nastaleeq';
            src: url('https://cdn.jsdelivr.net/gh/sajjadsaeed/UrduFontsWeb@master/fonts/JameelNooriNastaleeq.woff2') format('woff2');
            font-weight: normal; font-style: normal; font-display: swap;
        }
        body { font-family: 'Poppins', 'Jameel Noori Nastaleeq', sans-serif; background-color: #f8fafc; margin: 0; padding: 0; }
        .urdu-font { font-family: 'Poppins', 'Jameel Noori Nastaleeq', sans-serif; font-size: 1.1rem; line-height: 1.8; }
        .eng-font { font-family: 'Poppins', sans-serif !important; }

        /* Custom Scrollbar for Table */
        .table-container {
            max-height: 60vh; /* Set a maximum height for the table container */
            overflow-y: auto; /* Enable vertical scrolling */
        }
        
        .table-container::-webkit-scrollbar { width: 8px; height: 8px; }
        .table-container::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Make header sticky */
        thead th {
            position: sticky;
            top: 0;
            background-color: #f1f5f9;
            z-index: 10;
        }

        /* Loader */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #0d9488; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-2 md:p-4 text-slate-800">

    <div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden h-full flex flex-col">
        
        <!-- HEADER & FILTERS -->
        <div class="bg-teal-700 p-4 md:p-5 text-white border-b-4 border-teal-900 shrink-0">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-xl md:text-2xl font-bold urdu-font m-0">تفصیلی جائزہ رپورٹ (طلبہ)</h1>
                <div class="flex gap-2">
                    <button id="btn-export-excel" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded text-sm font-bold shadow transition flex items-center gap-1" title="Download Excel">
                        <i class="fas fa-file-excel"></i> <span class="hidden sm:inline eng-font">Excel</span>
                    </button>
                    <button id="btn-export-pdf" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded text-sm font-bold shadow transition flex items-center gap-1" title="Download PDF">
                        <i class="fas fa-file-pdf"></i> <span class="hidden sm:inline eng-font">PDF</span>
                    </button>
                </div>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-teal-800/50 p-3 rounded-xl border border-teal-600/50 shadow-inner">
                <!-- Month Filter -->
                <div class="flex flex-col">
                    <label class="text-teal-100 text-[10px] font-bold mb-1 urdu-font">مہینہ (Month)</label>
                    <input type="month" id="filter-month" class="w-full p-2 rounded-md text-slate-800 eng-font font-semibold text-sm outline-none focus:ring-2 focus:ring-teal-300 border-none shadow-sm">
                </div>
                <!-- Jamia Filter -->
                <div class="flex flex-col">
                    <label class="text-teal-100 text-[10px] font-bold mb-1 urdu-font">جامعہ (Jamia)</label>
                    <select id="filter-jamia" class="w-full p-2 rounded-md text-slate-800 urdu-font font-bold text-sm outline-none focus:ring-2 focus:ring-teal-300 border-none shadow-sm">
                        <option value="All">تمام جامعات (All)</option>
                    </select>
                </div>
                <!-- Class Filter -->
                <div class="flex flex-col">
                    <label class="text-teal-100 text-[10px] font-bold mb-1 urdu-font">درجہ (Class)</label>
                    <select id="filter-class" class="w-full p-2 rounded-md text-slate-800 urdu-font font-bold text-sm outline-none focus:ring-2 focus:ring-teal-300 border-none shadow-sm">
                        <option value="All">تمام درجات (All)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- STATS SUMMARY -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 p-3 border-b border-slate-100 bg-slate-50 shrink-0">
            <div class="bg-white p-2 rounded-lg border border-slate-200 shadow-sm text-center">
                <p class="text-[10px] text-slate-500 font-bold urdu-font mb-0.5">کل طلبہ (Filtered)</p>
                <h3 id="stat-total" class="text-lg font-black text-slate-800 eng-font leading-none">0</h3>
            </div>
            <div class="bg-emerald-50 p-2 rounded-lg border border-emerald-200 shadow-sm text-center">
                <p class="text-[10px] text-emerald-700 font-bold urdu-font mb-0.5">ممتاز / ممتاز مع الشرف</p>
                <h3 id="stat-mumtaz" class="text-lg font-black text-emerald-800 eng-font leading-none">0</h3>
            </div>
            <div class="bg-blue-50 p-2 rounded-lg border border-blue-200 shadow-sm text-center">
                <p class="text-[10px] text-blue-700 font-bold urdu-font mb-0.5">بہتر</p>
                <h3 id="stat-behtar" class="text-lg font-black text-blue-800 eng-font leading-none">0</h3>
            </div>
            <div class="bg-red-50 p-2 rounded-lg border border-red-200 shadow-sm text-center">
                <p class="text-[10px] text-red-700 font-bold urdu-font mb-0.5">کمزور</p>
                <h3 id="stat-kamzor" class="text-lg font-black text-red-800 eng-font leading-none">0</h3>
            </div>
        </div>

        <!-- TABLE SECTION -->
        <div class="p-3 relative flex-grow overflow-hidden flex flex-col">
            <div id="loading-spinner" class="absolute inset-0 bg-white/90 z-20 flex flex-col items-center justify-center">
                <div class="loader"></div>
                <p class="urdu-font text-teal-700 font-bold mt-2">ڈیٹا لوڈ ہو رہا ہے...</p>
            </div>

            <!-- Table Container with Scroll -->
            <div class="table-container rounded-lg border border-slate-200 shadow-sm bg-white relative w-full h-full">
                <table id="report-table" class="w-full text-right whitespace-nowrap min-w-[800px] border-collapse">
                    <thead class="bg-slate-100 border-b border-slate-200 text-slate-600 shadow-sm">
                        <tr>
                            <th class="p-2 text-xs font-bold urdu-font w-10 text-center border-l border-slate-200">#</th>
                            <!-- Changed Order: Jamia, Class, Student -->
                            <th class="p-2 text-xs font-bold urdu-font border-l border-slate-200 w-32">جامعہ</th>
                            <th class="p-2 text-xs font-bold urdu-font border-l border-slate-200 w-32">درجہ</th>
                            <th class="p-2 text-xs font-bold urdu-font border-l border-slate-200">طالب علم کا نام</th>
                            <th class="p-2 text-xs font-bold urdu-font border-l border-slate-200 w-32 text-center">کل نمبر</th>
                            <th class="p-2 text-xs font-bold urdu-font border-l border-slate-200 w-24 text-center">کیفیت</th>
                            <th class="p-2 text-xs font-bold urdu-font w-48 max-w-xs truncate">ریمارکس (اغلاط)</th>
                        </tr>
                    </thead>
                    <tbody id="students-table-body" class="divide-y divide-slate-100">
                        <!-- Rows js se aayengi -->
                    </tbody>
                </table>
            </div>
            
            <div id="no-data-msg" class="hidden text-center py-8 bg-slate-50 rounded-lg mt-2 border border-dashed border-slate-300">
                <i class="fas fa-folder-open text-3xl text-slate-300 mb-2"></i>
                <p class="urdu-font text-slate-500 font-bold text-sm">اس مہینے یا جامعہ کا کوئی ڈیٹا موجود نہیں ہے۔</p>
            </div>
        </div>
    </div>

    <!-- FIREBASE & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDhPuyX0y1gb3uXoIRcdcQPkd5Q4KJFgl0",
          authDomain: "data-f15ab.firebaseapp.com",
          projectId: "data-f15ab",
          storageBucket: "data-f15ab.appspot.com",
          messagingSenderId: "449137002393",
          appId: "1:449137002393:web:6a23721d00b1b0daeb3508"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Variables
        let allFlattenedStudents = [];
        let uniqueJamias = new Set();
        let uniqueClasses = new Set();
        
        // UI Elements
        const filterMonth = document.getElementById('filter-month');
        const filterJamia = document.getElementById('filter-jamia');
        const filterClass = document.getElementById('filter-class');
        const tableBody = document.getElementById('students-table-body');
        const loadingSpinner = document.getElementById('loading-spinner');
        const noDataMsg = document.getElementById('no-data-msg');

        // Set Default Month to Current Month
        const setInitialMonth = () => {
            const now = new Date();
            const monthVal = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            filterMonth.value = monthVal;
        };
        setInitialMonth();

        // 1. Fetch Data from Firebase
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await fetchJaizaData(user.uid);
            } else {
                tableBody.innerHTML = '<tr><td colspan="7" class="text-center p-4 text-red-500 font-bold urdu-font">براہ کرم لاگ ان کریں۔</td></tr>';
                loadingSpinner.classList.add('hidden');
            }
        });

        async function fetchJaizaData(userId) {
            loadingSpinner.classList.remove('hidden');
            allFlattenedStudents = [];
            uniqueJamias.clear();
            uniqueClasses.clear();

            try {
                // Fetch all reports for the user
                const q = query(collection(db, "monthly_reports"), where("userId", "==", userId));
                const querySnapshot = await getDocs(q);

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const docMonthKey = data.monthKey || data.month; // e.g., "2026-09"
                    
                    if (data.jaizaReport && data.jaizaReport.data) {
                        data.jaizaReport.data.forEach((jamiaEntry) => {
                            // Sirf wohi entry lenge jis me student ka data ho (Visit ya Nahi Hua ko skip karenge)
                            if (jamiaEntry.status === 'Jaiza' && jamiaEntry.students && jamiaEntry.students.length > 0) {
                                const jName = jamiaEntry.name;
                                const cName = jamiaEntry.details?.class || 'نامعلوم';
                                const tName = jamiaEntry.details?.teacher || 'نامعلوم';
                                
                                uniqueJamias.add(jName);
                                uniqueClasses.add(cName);

                                // Har student ka alag record banayen table ke liye
                                jamiaEntry.students.forEach((student) => {
                                    allFlattenedStudents.push({
                                        monthKey: docMonthKey,
                                        jamia: jName,
                                        className: cName,
                                        teacher: tName,
                                        studentName: student.name || 'نامعلوم',
                                        totalMarks: student.total !== null ? student.total : '-',
                                        grade: student.grade || '-',
                                        remarks: student.remarks || '-',
                                        date: jamiaEntry.submittedAt || '-'
                                    });
                                });
                            }
                        });
                    }
                });

                populateDropdowns();
                applyFiltersAndRender();

            } catch (error) {
                console.error("Data Fetch Error:", error);
                tableBody.innerHTML = '<tr><td colspan="7" class="text-center p-4 text-red-500 font-bold urdu-font">ڈیٹا لوڈ کرنے میں ایرر آیا۔</td></tr>';
            } finally {
                loadingSpinner.classList.add('hidden');
            }
        }

        // 2. Populate Dropdowns Dynamically
        function populateDropdowns() {
            // Jamia Dropdown
            filterJamia.innerHTML = '<option value="All">تمام جامعات (All)</option>';
            Array.from(uniqueJamias).sort().forEach(j => {
                const opt = document.createElement('option'); opt.value = j; opt.textContent = j;
                filterJamia.appendChild(opt);
            });

            // Class Dropdown
            filterClass.innerHTML = '<option value="All">تمام درجات (All)</option>';
            Array.from(uniqueClasses).sort().forEach(c => {
                const opt = document.createElement('option'); opt.value = c; opt.textContent = c;
                filterClass.appendChild(opt);
            });
        }

        // 3. Apply Filters and Render Table
        function applyFiltersAndRender() {
            const selectedMonth = filterMonth.value; // format: "YYYY-MM"
            const selectedJamia = filterJamia.value;
            const selectedClass = filterClass.value;

            const filteredData = allFlattenedStudents.filter(s => {
                const matchMonth = (selectedMonth === '' || s.monthKey === selectedMonth);
                const matchJamia = (selectedJamia === 'All' || s.jamia === selectedJamia);
                const matchClass = (selectedClass === 'All' || s.className === selectedClass);
                return matchMonth && matchJamia && matchClass;
            });

            // Yahan Sorting kar rahe hain taake Jamia -> Class -> Student order me aaye
            filteredData.sort((a, b) => {
                if(a.jamia !== b.jamia) return a.jamia.localeCompare(b.jamia, 'ur');
                if(a.className !== b.className) return a.className.localeCompare(b.className, 'ur');
                return a.studentName.localeCompare(b.studentName, 'ur');
            });

            renderTable(filteredData);
        }

        // 4. Render Table UI
        function renderTable(data) {
            tableBody.innerHTML = '';
            
            // Stats Variables
            let m_sharaf = 0, behtar = 0, kamzor = 0;

            if (data.length === 0) {
                noDataMsg.classList.remove('hidden');
                document.querySelector('.table-container').classList.add('hidden');
            } else {
                noDataMsg.classList.add('hidden');
                document.querySelector('.table-container').classList.remove('hidden');

                data.forEach((st, index) => {
                    // Badge Colors Logic
                    let gradeBadge = '';
                    let gradeText = '-';
                    if(st.grade === 'mumtaz-sharaf' || st.grade === 'mumtaz') { 
                        gradeBadge = '<span class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded text-[10px] md:text-xs font-bold urdu-font inline-block">ممتاز</span>'; 
                        gradeText = 'ممتاز';
                        m_sharaf++; 
                    }
                    else if(st.grade === 'behtar') { 
                        gradeBadge = '<span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded text-[10px] md:text-xs font-bold urdu-font inline-block">بہتر</span>'; 
                        gradeText = 'بہتر';
                        behtar++; 
                    }
                    else if(st.grade === 'kamzor') { 
                        gradeBadge = '<span class="bg-red-100 text-red-800 px-2 py-0.5 rounded text-[10px] md:text-xs font-bold urdu-font inline-block">کمزور</span>'; 
                        gradeText = 'کمزور';
                        kamzor++; 
                    }
                    else { 
                        gradeBadge = '<span class="text-slate-400 font-bold">-</span>'; 
                    }

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-50 transition border-b border-slate-100";
                    // Data attributes added for export functionality
                    tr.dataset.jamia = st.jamia;
                    tr.dataset.class = st.className;
                    tr.dataset.teacher = st.teacher;
                    tr.dataset.student = st.studentName;
                    tr.dataset.marks = st.totalMarks;
                    tr.dataset.grade = gradeText;
                    tr.dataset.remarks = st.remarks;

                    tr.innerHTML = `
                        <td class="p-2 text-center text-slate-400 font-bold eng-font text-xs border-l border-slate-100">${index + 1}</td>
                        <!-- Changed Order in Table Body -->
                        <td class="p-2 text-teal-700 font-bold urdu-font text-sm border-l border-slate-100 truncate max-w-[120px]" title="${st.jamia}">${st.jamia}</td>
                        <td class="p-2 border-l border-slate-100 truncate max-w-[120px]">
                            <p class="text-slate-800 font-bold urdu-font text-sm leading-tight" title="${st.className}">${st.className}</p>
                            <p class="text-slate-500 urdu-font text-[10px] leading-tight mt-0.5 truncate" title="${st.teacher}">${st.teacher}</p>
                        </td>
                        <td class="p-2 text-slate-800 font-bold urdu-font text-sm md:text-base border-l border-slate-100 whitespace-normal min-w-[150px]">${st.studentName}</td>
                        <td class="p-2 text-center text-slate-700 font-black eng-font text-sm md:text-base border-l border-slate-100">${st.totalMarks}</td>
                        <td class="p-2 text-center border-l border-slate-100">${gradeBadge}</td>
                        <td class="p-2 text-slate-600 urdu-font text-xs md:text-sm whitespace-normal min-w-[150px] leading-snug">${st.remarks !== '' ? st.remarks : '-'}</td>
                    `;
                    tableBody.appendChild(tr);
                });
            }

            // Update Top Stats
            document.getElementById('stat-total').textContent = data.length;
            document.getElementById('stat-mumtaz').textContent = m_sharaf;
            document.getElementById('stat-behtar').textContent = behtar;
            document.getElementById('stat-kamzor').textContent = kamzor;
        }

        // 5. Event Listeners for Filters
        filterMonth.addEventListener('change', applyFiltersAndRender);
        filterJamia.addEventListener('change', applyFiltersAndRender);
        filterClass.addEventListener('change', applyFiltersAndRender);

        // ==========================================
        // EXPORT FUNCTIONALITY (EXCEL & PDF)
        // ==========================================

        // EXCEL EXPORT
        document.getElementById('btn-export-excel').addEventListener('click', () => {
            const rows = Array.from(document.querySelectorAll('#students-table-body tr'));
            if(rows.length === 0) { alert('ڈاؤنلوڈ کرنے کے لیے کوئی ڈیٹا نہیں ہے۔'); return; }

            const excelData = [];
            // Excel Header (RTL Support issue hoti hai Excel me isliye English names rakhte hain taake error na aaye, ya phir simple urdu)
            excelData.push(['S.No', 'Jamia', 'Class', 'Teacher', 'Student Name', 'Total Marks', 'Grade', 'Remarks']);

            rows.forEach((row, index) => {
                excelData.push([
                    index + 1,
                    row.dataset.jamia,
                    row.dataset.class,
                    row.dataset.teacher,
                    row.dataset.student,
                    row.dataset.marks,
                    row.dataset.grade,
                    row.dataset.remarks
                ]);
            });

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(excelData);
            
            // RTL setup for Excel (Optional, works in newer Excel versions)
            if(!ws['!views']) ws['!views'] = [];
            ws['!views'].push({rightToLeft: true});

            XLSX.utils.book_append_sheet(wb, ws, "Jaiza Report");
            
            const month = document.getElementById('filter-month').value;
            XLSX.writeFile(wb, `Jaiza_Report_${month}.xlsx`);
        });

        // PDF EXPORT (Using jsPDF & AutoTable)
        document.getElementById('btn-export-pdf').addEventListener('click', () => {
            const rows = Array.from(document.querySelectorAll('#students-table-body tr'));
            if(rows.length === 0) { alert('ڈاؤنلوڈ کرنے کے لیے کوئی ڈیٹا نہیں ہے۔'); return; }

            // jsPDF initialization (Landscape mode for better fit)
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'landscape' });
            
            // Add custom font for Urdu support in PDF (Jameel Noori Nastaleeq is complex for jsPDF, using a simpler Arabic/Urdu compatible font if possible, or standard for fallback)
            // Note: True RTL and complex Arabic scripting in base jsPDF is limited. We will use AutoTable's basic text rendering.
            
            const month = document.getElementById('filter-month').value;
            const jamiaFilter = document.getElementById('filter-jamia').value;
            
            doc.setFontSize(16);
            doc.text(`Jaiza Report - ${month}`, 14, 15);
            doc.setFontSize(10);
            doc.text(`Jamia: ${jamiaFilter === 'All' ? 'All Jamiaat' : jamiaFilter}`, 14, 22);

            const tableColumn = ["#", "Jamia", "Class / Teacher", "Student Name", "Marks", "Grade", "Remarks"];
            const tableRows = [];

            rows.forEach((row, index) => {
                const rowData = [
                    index + 1,
                    row.dataset.jamia,
                    `${row.dataset.class} 
(${row.dataset.teacher})`,
                    row.dataset.student,
                    row.dataset.marks,
                    row.dataset.grade,
                    row.dataset.remarks
                ];
                tableRows.push(rowData);
            });

            doc.autoTable({
                head: [tableColumn],
                body: tableRows,
                startY: 30,
                styles: { 
                    font: 'helvetica', // Fallback font
                    fontSize: 9,
                    cellPadding: 3,
                    overflow: 'linebreak',
                    halign: 'right' // RTL alignment
                },
                headStyles: {
                    fillColor: [15, 118, 110], // Teal-700
                    textColor: 255,
                    fontStyle: 'bold',
                    halign: 'center'
                },
                columnStyles: {
                    0: { halign: 'center', cellWidth: 10 }, // S.No
                    1: { cellWidth: 35 }, // Jamia
                    2: { cellWidth: 40 }, // Class
                    3: { cellWidth: 50 }, // Student
                    4: { halign: 'center', cellWidth: 15 }, // Marks
                    5: { halign: 'center', cellWidth: 20 }, // Grade
                    6: { cellWidth: 'auto' } // Remarks takes remaining space
                },
                didDrawPage: function (data) {
                    // Footer
                    let str = "Page " + doc.internal.getNumberOfPages();
                    doc.setFontSize(8);
                    let pageSize = doc.internal.pageSize;
                    let pageHeight = pageSize.height ? pageSize.height : pageSize.getHeight();
                    doc.text(str, data.settings.margin.left, pageHeight - 10);
                }
            });

            doc.save(`Jaiza_Report_${month}.pdf`);
        });

    </script>
</body>
</html>
