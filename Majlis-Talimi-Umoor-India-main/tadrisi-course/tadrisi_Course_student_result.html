<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Result Card</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
@font-face { font-family: 'Jameel Noori Nastaleeq'; src: url('https://cdn.jsdelivr.net/gh/font-to-width/jameel-noori-nastaleeq-regular@1.1/jameel-noori-nastaleeq-regular.woff2') format('woff2'); }
body { font-family: 'Poppins', sans-serif; background: #f1f5f9; }
.urdu-font { font-family: 'Jameel Noori Nastaleeq', 'Poppins', sans-serif; line-height: 1.8; }
</style>
</head>
<body class="text-gray-800">

<!-- Code daalein -->
<div id="login" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm text-center border-t-4 border-teal-600">
    <h1 class="text-2xl font-bold text-teal-800 mb-1">Tadrisi Course Result</h1>
    <p class="text-sm text-gray-500 mb-6">Registration ke waqt mila hua apna code darj karein</p>
    <input id="code" maxlength="30" placeholder="Your Code" autocomplete="off"
      class="w-full p-3 border-2 rounded-lg text-center text-xl font-mono tracking-widest outline-none focus:border-teal-500 uppercase"
      onkeydown="if(event.key==='Enter')showResult()">
    <button id="go" onclick="showResult()" class="w-full mt-4 bg-teal-600 hover:bg-teal-700 text-white py-3 rounded-lg font-bold text-lg">Result Dekhein</button>
    <p id="err" class="text-red-600 text-sm mt-3 min-h-[1.25rem]"></p>
  </div>
</div>

<!-- Result card -->
<div id="card" class="hidden max-w-xl mx-auto p-4">
  <div id="resultCardInner" class="bg-white rounded-2xl shadow-xl overflow-hidden border">
    <div class="bg-gradient-to-r from-teal-700 to-teal-500 text-white p-4 text-center">
      <div class="urdu-font text-2xl font-bold">تدریسی کورس</div>
      <div class="text-sm opacity-90">Result Card &middot; <span id="c-year"></span></div>
    </div>
    <div class="p-4 flex gap-4 items-center">
      <img id="c-photo" alt="Photo" class="w-28 h-36 object-cover rounded-lg border-4 border-teal-100 bg-gray-100 shrink-0">
      <div class="min-w-0 flex-1 space-y-1 text-sm">
        <div class="urdu-font text-2xl font-bold text-teal-800 break-words" id="c-name"></div>
        <div><span class="text-gray-400">Father:</span> <span class="urdu-font text-lg font-semibold" id="c-father"></span></div>
        <div><span class="text-gray-400">Mobile:</span> <span class="font-mono font-semibold" id="c-mobile"></span></div>
        <div><span class="text-gray-400">Jamia:</span> <span class="urdu-font text-lg font-semibold" id="c-jamia"></span></div>
        <div><span class="text-gray-400">Code:</span> <span class="font-mono font-bold text-teal-700" id="c-code"></span></div>
      </div>
    </div>
    <div id="headline" class="mx-4 mb-4 text-center rounded-xl py-3 px-2 font-bold text-lg"></div>
    <div id="tiles" class="px-4 pb-4 space-y-3"></div>
    <div class="bg-gray-50 border-t text-center text-xs text-gray-400 p-2">Last updated: <span id="c-upd"></span></div>
  </div>
  <div class="flex gap-2 mt-4 no-print">
    <button id="dl-btn" onclick="downloadImage()" class="flex-1 bg-teal-600 text-white py-3 rounded-lg font-bold">Download Image</button>
    <button onclick="location.reload()" class="flex-1 bg-white border border-gray-300 py-3 rounded-lg font-bold">Back</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const db = getFirestore(initializeApp({ apiKey: "AIzaSyDhPuyX0y1gb3uXoIRcdcQPkd5Q4KJFgl0", authDomain: "data-f15ab.firebaseapp.com", projectId: "data-f15ab", storageBucket: "data-f15ab.appspot.com", messagingSenderId: "449137002393", appId: "1:449137002393:web:6a23721d00b1b0daeb3508" }));

const MASK_MOBILE = true; // false karne par poora mobile number dikhega
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cardId = c => String(c).trim().replace(/\//g, '-');
const fmt = d => d ? new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const mask = m => (MASK_MOBILE && m && m.length > 6) ? m.slice(0, 4) + '****' + m.slice(-3) : (m || '-');
const NOPHOTO = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="120" height="150"><rect width="120" height="150" fill="#e2e8f0"/><circle cx="60" cy="55" r="24" fill="#94a3b8"/><rect x="24" y="90" width="72" height="50" rx="24" fill="#94a3b8"/></svg>');

const B = {
  pass: ['Pass', 'bg-green-100 text-green-700'], fail: ['Fail', 'bg-red-100 text-red-700'], pending: ['Result tayyar nahi', 'bg-gray-100 text-gray-500']
};
const badge = k => { const v = B[k] || B.pending; return `<span class="px-3 py-1 rounded-full text-sm font-bold ${v[1]}">${v[0]}</span>`; };
const tile = (title, date, body) => `<div class="border rounded-xl p-3"><div class="flex justify-between items-center mb-2"><b>${title}</b><span class="text-xs text-gray-500">${fmt(date)}</span></div>${body}</div>`;
const soon = t => `<div class="text-gray-400 text-sm">${t || 'Result abhi jari nahi hua'}</div>`;
const marksRow = e => `<div class="flex justify-between items-center"><span class="text-2xl font-bold">${e.marks ?? '-'}<span class="text-sm text-gray-400 font-normal"> / 100</span></span>${badge(e.status)}</div>`;

let lastCode = '';

window.showResult = async () => {
  const raw = $('code').value.trim();
  if (!raw) return;
  $('err').textContent = ''; $('go').disabled = true;
  try {
    let snap = await getDoc(doc(db, 'tadrisi_result_cards', cardId(raw)));
    if (!snap.exists()) snap = await getDoc(doc(db, 'tadrisi_result_cards', cardId(raw.toUpperCase())));
    if (!snap.exists()) { $('err').textContent = 'Ye code nahi mila, ya abhi result jari nahi hua.'; return; }
    render(snap.data());
  } catch (e) { console.error(e); $('err').textContent = 'Connection ka masla hai, dobara koshish karein.'; }
  finally { $('go').disabled = false; }
};

// Entry test ka SIRF EK result tile dikhta hai - jo test student ke liye decisive hai.
// Pass ho gaya to sirf us test ka result; fail hoker dusre me pass/fail hua to sirf dusre ka - pehla kabhi saath nahi dikhta.
function render(c) {
  lastCode = c.code || '';
  $('c-year').textContent = c.academicYear || '';
  $('c-name').textContent = c.name; $('c-father').textContent = c.fatherName;
  $('c-mobile').textContent = mask(c.mobile); $('c-jamia').textContent = c.jamia; $('c-code').textContent = c.code;
  $('c-photo').src = c.photo || NOPHOTO;
  $('c-upd').textContent = c.updatedAt ? new Date(c.updatedAt).toLocaleString('en-GB') : '-';

  // Purane format ke (ya adhoore) cards crash na karein - sirf valid object ko hi "entry" maano,
  // warna "abhi jari nahi hua" dikha do (admin ko "Update Result Cards" dobara chalana hoga)
  const entry = (c.entry && typeof c.entry === 'object' && c.entry.status) ? c.entry : null;

  // Headline: final result ho to wo, warna entry test (jo bhi test decisive hai)
  let h = ['Result abhi jari nahi hua', 'bg-gray-100 text-gray-500'];
  if (c.final && c.final.status !== 'pending') h = c.final.status === 'pass'
    ? [`Tadrisi Test: PASS${c.final.quality ? ' (' + c.final.quality + ')' : ''}`, 'bg-green-100 text-green-800']
    : ['Tadrisi Test: FAIL', 'bg-red-100 text-red-800'];
  else if (entry) {
    const tag = entry.test === 2 ? ' (Test 2)' : '';
    h = entry.status === 'pass' ? [`Entry Test: PASS${tag}`, 'bg-green-100 text-green-800']
      : entry.status === 'fail' ? [`Entry Test: FAIL${tag}`, 'bg-red-100 text-red-800']
      : [`Entry Test${tag}: Result tayyar nahi`, 'bg-gray-100 text-gray-500'];
  }
  $('headline').textContent = h[0]; $('headline').className = `mx-4 mb-4 text-center rounded-xl py-3 px-2 font-bold text-lg ${h[1]}`;

  // Sirf ek Entry Test tile - jo test abhi decisive hai usi ka naam/date/marks
  const eTitle = entry && entry.test === 2 ? 'Entry Test 2' : 'Entry Test';
  const eBody = !entry ? soon() : entry.status === 'pending' ? soon() : marksRow(entry);
  let t = tile(eTitle, entry ? entry.date : '', eBody);

  let fb = soon();
  if (c.pf && !c.final) fb = soon('Is test me aapka result mojood nahi');
  if (c.final) {
    const f = c.final, names = ['عبارت', 'ترجمہ', 'صرف', 'نحو', 'انداز'];
    fb = f.status === 'pending' ? soon('Result tayyar nahi') : `
      <div class="grid grid-cols-5 gap-1 text-center mb-2">${f.subjects.map((v, i) => `<div class="rounded bg-gray-50 border p-1"><div class="urdu-font text-sm">${names[i]}</div><div class="font-bold ${v < 56 ? 'text-red-600' : ''}">${v}<span class="text-[10px] text-gray-400">/80</span></div></div>`).join('')}</div>
      <div class="flex justify-between items-center"><span class="font-bold">${f.total}<span class="text-sm text-gray-400 font-normal"> / 400 &middot; ${f.pct}%</span></span>${badge(f.status)}</div>
      ${f.quality ? `<div class="urdu-font text-lg text-teal-700 mt-1">${esc(f.quality)}</div>` : ''}
      ${f.remarks ? `<div class="urdu-font text-sm text-gray-600 mt-1">${esc(f.remarks)}</div>` : ''}`;
  }
  t += tile('Tadrisi Final Test', '', fb);
  $('tiles').innerHTML = t;
  $('login').classList.add('hidden'); $('card').classList.remove('hidden');
}

window.downloadImage = async () => {
  const el = $('resultCardInner'), btn = $('dl-btn');
  if (!el || typeof html2canvas === 'undefined') return;
  btn.disabled = true; const old = btn.textContent; btn.textContent = 'Taiyar ho raha hai...';
  try {
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    const a = document.createElement('a');
    a.download = `Result_${lastCode || 'card'}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
  } catch (e) { console.error(e); alert('Image download nahi hui, dobara koshish karein.'); }
  finally { btn.disabled = false; btn.textContent = old; }
};
</script>
</body>
</html>
