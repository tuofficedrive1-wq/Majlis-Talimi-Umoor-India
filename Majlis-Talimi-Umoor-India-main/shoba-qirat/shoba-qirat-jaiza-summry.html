<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شعبہ قراءت - جائزہ سمری</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
    
    <!-- Excel Generation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- html2pdf for perfect rendering without canvas blur/cut issues -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        @font-face {
            font-family: 'Jameel Noori Nastaleeq';
            src: url('https://cdn.jsdelivr.net/gh/sajjadsaeed/UrduFontsWeb@master/fonts/JameelNooriNastaleeq.woff2') format('woff2');
            font-weight: normal; font-style: normal; font-display: swap;
        }
        body { font-family: 'Poppins', 'Jameel Noori Nastaleeq', sans-serif; background-color: #f8fafc; margin: 0; padding: 0; }
        .urdu-font { font-family: 'Poppins', 'Jameel Noori Nastaleeq', sans-serif; font-size: 1.1rem; line-height: 1.8; }
        .eng-font { font-family: 'Poppins', sans-serif !important; }

        /* Custom Scrollbar for Table */
        .table-container {
            max-height: 60vh; 
            overflow-y: auto; 
        }
        
        .table-container::-webkit-scrollbar { width: 8px; height: 8px; }
        .table-container::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Make header sticky */
        thead th {
            position: sticky;
            top: 0;
            background-color: #f1f5f9; 
            z-index: 10;
        }

        /* Loader */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #0d9488; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- PDF PRINT STYLES --- */
        #pdf-content { background: white; padding: 20px; }
        
        /* Changed border color and added page break logic */
        .pdf-table { width: 100%; border-collapse: collapse; direction: rtl; margin-top: 20px; font-family: 'Jameel Noori Nastaleeq', sans-serif; }
        
        /* Page break prevention inside rows */
        .pdf-table tr {
            page-break-inside: avoid;
        }
        
        .pdf-table th, .pdf-table td { border: 1px solid #cbd5e1; padding: 10px; text-align: right; font-size: 16px; line-height: 1.6; }
        .pdf-table th { background-color: #0f766e; color: white; font-weight: bold; }
        .pdf-table tr:nth-child(even) { background-color: #f8fafc; }
        
        /* Colored badges for PDF */
        .pdf-badge-mumtaz { background-color: #d1fae5; color: #065f46; padding: 4px 8px; border-radius: 4px; font-weight: bold; border: 1px solid #6ee7b7; display: inline-block; }
        .pdf-badge-behtar { background-color: #dbeafe; color: #1e40af; padding: 4px 8px; border-radius: 4px; font-weight: bold; border: 1px solid #93c5fd; display: inline-block; }
        .pdf-badge-kamzor { background-color: #fee2e2; color: #991b1b; padding: 4px 8px; border-radius: 4px; font-weight: bold; border: 1px solid #fca5a5; display: inline-block; }
        
        .pdf-badge-sharaf { background-color: #a7f3d0; color: #064e3b; padding: 4px 8px; border-radius: 4px; font-weight: bold; border: 1px solid #34d399; display: inline-block; }
        .pdf-header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #0f766e; padding-bottom: 10px; }
        .pdf-header h2 { font-family: 'Jameel Noori Nastaleeq', sans-serif; font-size: 26px; color: #0f766e; margin: 0 0 5px 0; }
        .pdf-header p { margin: 0; color: #475569; font-family: 'Poppins', sans-serif; font-size: 14px; }
        
        .hide-in-pdf { display: none !important; }
    </style>
</head>
<body class="p-2 md:p-4 text-slate-800">

    <div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden h-full flex flex-col">
        
        <!-- HEADER & FILTERS -->
        <div class="bg-teal-700 p-4 md:p-5 text-white border-b-4 border-teal-900 shrink-0 hide-on-print">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-xl md:text-2xl font-bold urdu-font m-0">تفصیلی جائزہ رپورٹ (طلبہ)</h1>
                <div class="flex gap-2">
                    <button id="btn-export-excel" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded text-sm font-bold shadow transition flex items-center gap-1" title="Download Excel">
                        <i class="fas fa-file-excel"></i> <span class="hidden sm:inline eng-font">Excel</span>
                    </button>
                    <button id="btn-export-pdf-html" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded text-sm font-bold shadow transition flex items-center gap-1" title="Download PDF">
                        <i class="fas fa-file-pdf"></i> <span class="hidden sm:inline eng-font">PDF</span>
                    </button>
                </div>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 bg-teal-800/50 p-3 rounded-xl border border-teal-600/50 shadow-inner">
                <!-- Report Type Filter -->
                <div class="flex flex-col">
                    <label class="text-teal-100 text-[10px] font-bold mb-1 urdu-font">رپورٹ کی قسم (Report Type)</label>
                    <select id="filter-report-type" class="w-full p-2 rounded-md text-slate-800 urdu-font font-bold text-sm outline-none focus:ring-2 focus:ring-teal-300 border-none shadow-sm">
                        <option value="detail">طلبہ رپورٹ (ہر مضمون کے نمبر)</option>
                        <option value="class">کلاس وائز مجموعی رپورٹ</option>
                        <option value="weak">کمزور کلاسز + وضاحت</option>
                    </select>
                </div>
                <!-- Month Filter -->
                <div class="flex flex-col">
                    <label class="text-teal-100 text-[10px] font-bold mb-1 urdu-font">مہینہ (Month)</label>
                    <input type="month" id="filter-month" class="w-full p-2 rounded-md text-slate-800 eng-font font-semibold text-sm outline-none focus:ring-2 focus:ring-teal-300 border-none shadow-sm">
                </div>
                <!-- Jamia Filter -->
                <div class="flex flex-col">
                    <label class="text-teal-100 text-[10px] font-bold mb-1 urdu-font">جامعہ (Jamia)</label>
                    <select id="filter-jamia" class="w-full p-2 rounded-md text-slate-800 urdu-font font-bold text-sm outline-none focus:ring-2 focus:ring-teal-300 border-none shadow-sm">
                        <option value="All">تمام جامعات (All)</option>
                    </select>
                </div>
                <!-- Class Filter -->
                <div class="flex flex-col">
                    <label class="text-teal-100 text-[10px] font-bold mb-1 urdu-font">درجہ (Class)</label>
                    <select id="filter-class" class="w-full p-2 rounded-md text-slate-800 urdu-font font-bold text-sm outline-none focus:ring-2 focus:ring-teal-300 border-none shadow-sm">
                        <option value="All">تمام درجات (All)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- STATS SUMMARY -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 p-3 border-b border-slate-100 bg-slate-50 shrink-0 hide-on-print">
            <div class="bg-white p-2 rounded-lg border border-slate-200 shadow-sm text-center">
                <p class="text-[10px] text-slate-500 font-bold urdu-font mb-0.5">کل طلبہ (Filtered)</p>
                <h3 id="stat-total" class="text-lg font-black text-slate-800 eng-font leading-none">0</h3>
            </div>
            <div class="bg-emerald-50 p-2 rounded-lg border border-emerald-200 shadow-sm text-center">
                <p class="text-[10px] text-emerald-700 font-bold urdu-font mb-0.5">ممتاز / ممتاز مع الشرف</p>
                <h3 id="stat-mumtaz" class="text-lg font-black text-emerald-800 eng-font leading-none">0</h3>
            </div>
            <div class="bg-blue-50 p-2 rounded-lg border border-blue-200 shadow-sm text-center">
                <p class="text-[10px] text-blue-700 font-bold urdu-font mb-0.5">بہتر</p>
                <h3 id="stat-behtar" class="text-lg font-black text-blue-800 eng-font leading-none">0</h3>
            </div>
            <div class="bg-red-50 p-2 rounded-lg border border-red-200 shadow-sm text-center">
                <p class="text-[10px] text-red-700 font-bold urdu-font mb-0.5">کمزور</p>
                <h3 id="stat-kamzor" class="text-lg font-black text-red-800 eng-font leading-none">0</h3>
            </div>
        </div>

        <!-- MAIN UI TABLE SECTION -->
        <div class="p-3 relative flex-grow overflow-hidden flex flex-col hide-on-print">
            <div id="loading-spinner" class="absolute inset-0 bg-white/90 z-20 flex flex-col items-center justify-center">
                <div class="loader"></div>
                <p class="urdu-font text-teal-700 font-bold mt-2">ڈیٹا لوڈ ہو رہا ہے...</p>
            </div>

            <div id="view-note" class="hidden mb-2 p-2 rounded-lg bg-amber-50 border border-amber-200 text-amber-800 urdu-font text-xs font-bold"></div>

            <!-- Table Container with Scroll -->
            <div class="table-container rounded-lg border border-slate-200 shadow-sm bg-white relative w-full h-full">
                <table id="report-table" class="w-full text-right whitespace-nowrap min-w-[800px] border-collapse">
                    <thead class="bg-slate-100 border-b border-slate-200 text-slate-600 shadow-sm"><tr id="table-head-row"></tr></thead>
                    <tbody id="students-table-body" class="divide-y divide-slate-100">
                        <!-- Rows js se aayengi -->
                    </tbody>
                </table>
            </div>
            
            <div id="no-data-msg" class="hidden text-center py-8 bg-slate-50 rounded-lg mt-2 border border-dashed border-slate-300">
                <i class="fas fa-folder-open text-3xl text-slate-300 mb-2"></i>
                <p class="urdu-font text-slate-500 font-bold text-sm">اس مہینے یا جامعہ کا کوئی ڈیٹا موجود نہیں ہے۔</p>
            </div>
        </div>

        <!-- HIDDEN PDF CONTENT STRUCTURE -->
        <!-- Ye hissa sirf PDF generate hote waqt use hoga, normal UI me chupa rahega -->
        <div id="pdf-export-container" style="display: none;">
            <div id="pdf-content" dir="rtl">
                <!-- Removed static header here, it will be added dynamically by html2pdf -->
                
                <!-- Clean HTML Table for PDF -->
                <table class="pdf-table" id="pdf-data-table">
                   <thead id="pdf-thead"></thead>
                    <tbody id="pdf-table-body">
                        <!-- PDF rows will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- FIREBASE & LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, addDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDhPuyX0y1gb3uXoIRcdcQPkd5Q4KJFgl0",
          authDomain: "data-f15ab.firebaseapp.com",
          projectId: "data-f15ab",
          storageBucket: "data-f15ab.appspot.com",
          messagingSenderId: "449137002393",
          appId: "1:449137002393:web:6a23721d00b1b0daeb3508"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Variables
        let allFlattenedStudents = [];
        let uniqueJamias = new Set();
        let uniqueClasses = new Set();
        let currentFilteredData = [];

        // ==========================================
        // SETTINGS
        // ==========================================
        // Ajeer code dhoondhne ke liye user profile ka collection (form wali file me bhi 'users' hai)
        const USER_PROFILE_COLLECTION = 'users';
        const WAZAHAT_BASE_URL = 'https://tuofficedrive1-wq.github.io/Majlis-Talimi-Umoor-India/teacher-wazahat.html';

        // Form ke mutabiq: darja me "اولیٰ / اولی / ثانیہ" ho to advanced format, warna basic format
        const isAdvancedClass = (c) => /اولیٰ|اولی|ثانیہ/.test(c || '');
        const SUBJECTS = {
            basic: [['مخارج', 30], ['قواعد', 10], ['رواں', 20], ['ہجے', 5], ['اجراء', 20], ['حفظ سورت', 10], ['حسن صوت', 5]],
            adv: [['تعریفات و قواعد', 20], ['مثال', 5], ['حدر', 20], ['ترتیل', 20], ['اجراء قواعد', 20], ['حفظ سورت', 10], ['حسن صوت', 5]]
        };

        let currentUser = null;
        let currentView = null;
        let renderToken = 0;
        let userProfileCache = null;

        const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const gradeKey = (g) => g === 'mumtaz-sharaf' ? 'sharaf' : g === 'mumtaz' ? 'mumtaz' : g === 'behtar' ? 'behtar' : g === 'kamzor' ? 'kamzor' : 'none';
        const GRADE_TEXT = { sharaf: 'ممتاز مع الشرف', mumtaz: 'ممتاز', behtar: 'بہتر', kamzor: 'کمزور', none: '-' };
        const GRADE_UI = {
            sharaf: 'bg-emerald-100 text-emerald-800 border border-emerald-300',
            mumtaz: 'bg-teal-100 text-teal-800 border border-teal-300',
            behtar: 'bg-blue-100 text-blue-800 border border-blue-300',
            kamzor: 'bg-red-100 text-red-800 border border-red-300'
        };
        const GRADE_TXT_CLS = { sharaf: 'text-emerald-700', mumtaz: 'text-teal-700', behtar: 'text-blue-700', kamzor: 'text-red-600', none: 'text-slate-400' };
        // Form wala class kaifiyat formula
        const classKaifiyat = (p) => p >= 90 ? 'sharaf' : p >= 80 ? 'mumtaz' : p >= 70 ? 'behtar' : 'kamzor';

        const isSameJamia = (j1, j2) => {
            if (!j1 || !j2) return false;
            const clean = (x) => String(x).replace(/[‎‏‪-‮﻿]/g, '').trim().toLowerCase().replace(/[\s_\-]+/g, ' ').trim();
            const c1 = clean(j1), c2 = clean(j2);
            if (c1 === c2) return true;
            const strip = (x) => x.replace(/^(jamia[\s_-]*tul[\s_-]*madina|jamia|جامعۃ\s*المدینہ|جامعہ)[\s_-]*/gi, '').trim();
            return strip(c1) === strip(c2);
        };

        // Table cell helper: UI td + PDF td
        function cell(inner, o = {}) {
            return {
                td: `<td class="p-2 border-l border-slate-100 urdu-font text-sm ${o.center ? 'text-center' : ''} ${o.cls || ''}">${inner}</td>`,
                pdf: `<td style="${o.center ? 'text-align:center;' : ''}${o.pdfStyle || ''}">${o.pdfInner !== undefined ? o.pdfInner : inner}</td>`
            };
        }
        const txt = (v, o = {}) => cell(esc(v), { ...o, pdfInner: esc(v) });
        function badgeCell(k) {
            const ui = k === 'none' ? '<span class="text-slate-400 font-bold">-</span>'
                : `<span class="${GRADE_UI[k]} px-2 py-1 rounded text-xs md:text-sm font-bold urdu-font inline-block shadow-sm">${GRADE_TEXT[k]}</span>`;
            const pdfInner = k === 'none' ? '-' : `<span class="pdf-badge-${k}">${GRADE_TEXT[k]}</span>`;
            return cell(ui, { center: true, pdfInner });
        }
        const idxCell = (i) => txt(i, { center: true, cls: 'text-slate-400 font-bold eng-font text-xs' });
        const jamiaCell = (j) => txt(j, { cls: 'text-teal-700 font-bold' });
        const classTeacherCell = (c, t) => cell(
            `<p class="text-slate-800 font-bold leading-tight">${esc(c)}</p><p class="text-slate-500 text-[10px] leading-tight mt-0.5">${esc(t)}</p>`,
            { pdfInner: esc(c) });
        const scoreText = (v) => (v === '' || v === null || v === undefined) ? '-' : v;

        // ---------- DETAIL VIEW (ہر مضمون کے نمبر) ----------
        function buildDetailView(data) {
            const rank = { basic: 0, adv: 1 };
            const sorted = [...data].sort((a, b) =>
                rank[a.fmt] - rank[b.fmt] ||
                a.jamia.localeCompare(b.jamia, 'ur') ||
                a.className.localeCompare(b.className, 'ur') ||
                a.studentName.localeCompare(b.studentName, 'ur'));
            const fmts = [...new Set(sorted.map(s => s.fmt))];
            const labelsFor = (f) => ['#', 'طالب علم کا نام', 'جامعہ', 'درجہ و استاد', ...SUBJECTS[f].map(([n, m]) => `${n} (${m})`), 'کل (100)', 'کیفیت', 'ریمارکس'];
            const columns = labelsFor(fmts[0]).map((label, i) => ({ label, center: i === 0 || (i >= 4 && i <= 11) }));

            const rows = [];
            let cur = null, n = 0;
            sorted.forEach(st => {
                if (st.fmt !== cur) {
                    if (cur !== null) rows.push({ header: labelsFor(st.fmt), plain: labelsFor(st.fmt) });
                    cur = st.fmt;
                }
                n++;
                const gk = gradeKey(st.grade);
                rows.push({
                    cells: [idxCell(n),
                        txt(st.studentName, { cls: 'text-slate-800 font-bold whitespace-normal min-w-[150px]' }),
                        jamiaCell(st.jamia),
                        classTeacherCell(st.className, st.teacher),
                        ...SUBJECTS[st.fmt].map((_, i) => txt(scoreText(st.scores[i]), { center: true, cls: 'text-slate-700 eng-font font-semibold' })),
                        txt(st.totalMarks, { center: true, cls: 'text-slate-900 font-black eng-font bg-slate-50' }),
                        badgeCell(gk),
                        txt(st.remarks, { cls: 'text-slate-600 text-xs whitespace-normal min-w-[120px]' })],
                    plain: [n, st.studentName, st.jamia, `${st.className} - ${st.teacher}`, ...SUBJECTS[st.fmt].map((_, i) => scoreText(st.scores[i])), st.totalMarks, GRADE_TEXT[gk], st.remarks]
                });
            });
            return {
                key: 'detail',
                title: 'شعبہ قراءت - تفصیلی جائزہ رپورٹ (طلبہ)',
                note: fmts.length > 1 ? 'ابتدائی درجات اور اولیٰ/ثانیہ کے مضامین الگ الگ ہیں، اس لیے دوسرے گروپ کا عنوان درمیان میں دوبارہ دیا گیا ہے۔' : '',
                columns,
                exportHeaders: labelsFor(fmts[0]),
                rows
            };
        }

        // ---------- CLASS WISE ----------
        function groupByClass(data) {
            const m = new Map();
            data.forEach(s => {
                const k = [s.monthKey, s.jamia, s.className, s.teacher].join('||');
                if (!m.has(k)) m.set(k, { monthKey: s.monthKey, jamia: s.jamia, className: s.className, teacher: s.teacher, kul: s.totalStudents || 0, students: [], c: { sharaf: 0, mumtaz: 0, behtar: 0, kamzor: 0 }, sum: 0, present: 0 });
                const g = m.get(k);
                g.students.push(s);
                const gk = gradeKey(s.grade);
                if (gk !== 'none') {
                    g.c[gk]++; g.present++;
                    const t = parseFloat(s.totalMarks);
                    if (!isNaN(t)) g.sum += t;
                }
            });
            m.forEach(g => {
                g.percent = g.present ? Math.round(g.sum / (g.present * 100) * 100) : 0;   // form wala formula
                g.kaif = g.present ? classKaifiyat(g.percent) : 'none';
            });
            return [...m.values()];
        }
        // Jamia ka total: kul/hazir/ginti sab jama, percent = classes ke percent ka average (form wala formula)
        function summarize(gs) {
            const S = { kul: 0, present: 0, sum: 0, c: { sharaf: 0, mumtaz: 0, behtar: 0, kamzor: 0 } };
            let pSum = 0, pN = 0;
            gs.forEach(g => {
                S.kul += g.kul; S.present += g.present; S.sum += g.sum;
                Object.keys(S.c).forEach(k => S.c[k] += g.c[k]);
                if (g.present > 0) { pSum += g.percent; pN++; }
            });
            S.percent = pN ? Math.round(pSum / pN) : 0;
            S.kaif = pN ? classKaifiyat(S.percent) : 'none';
            return S;
        }

        function buildClassView(data) {
            const showMonth = !filterMonth.value;
            const groups = groupByClass(data);
            const lead = showMonth ? 4 : 3;
            const tail = ['کل طلبہ', 'حاضر', 'ممتاز مع الشرف', 'ممتاز', 'بہتر', 'کمزور', 'مجموعی نمبر', 'فیصد', 'کیفیت'];
            const columns = [{ label: '#', center: true }, ...(showMonth ? [{ label: 'ماہ', center: true }] : []),
                { label: 'جامعہ' }, { label: 'درجہ و استاد' }, ...tail.map(label => ({ label, center: true }))];

            const numCells = (S) => [
                txt(S.kul || '-', { center: true, cls: 'font-bold eng-font' }),
                txt(S.present, { center: true, cls: 'font-black eng-font' }),
                txt(S.c.sharaf, { center: true, cls: 'text-emerald-700 font-bold eng-font' }),
                txt(S.c.mumtaz, { center: true, cls: 'text-teal-700 font-bold eng-font' }),
                txt(S.c.behtar, { center: true, cls: 'text-blue-700 font-bold eng-font' }),
                txt(S.c.kamzor, { center: true, cls: 'text-red-600 font-bold eng-font' }),
                txt(S.sum, { center: true, cls: 'font-bold eng-font' }),
                txt(S.present ? S.percent + '%' : '-', { center: true, cls: `font-black eng-font ${GRADE_TXT_CLS[S.kaif]}` }),
                badgeCell(S.kaif)
            ];
            const numPlain = (S) => [S.kul || '-', S.present, S.c.sharaf, S.c.mumtaz, S.c.behtar, S.c.kamzor, S.sum, S.present ? S.percent + '%' : '-', GRADE_TEXT[S.kaif]];

            const totalRow = (label, gs) => {
                const S = summarize(gs);
                const leadCell = {
                    td: `<td colspan="${lead}" class="p-2 border-l border-slate-100 urdu-font text-sm font-black text-center bg-teal-50 text-teal-800">${esc(label)}</td>`,
                    pdf: `<td colspan="${lead}" style="text-align:center;font-weight:bold;background:#ecfdf5;">${esc(label)}</td>`
                };
                const nums = numCells(S).map(c => ({ td: c.td.replace('class="p-2', 'class="bg-teal-50 p-2'), pdf: c.pdf.replace('<td style="', '<td style="background:#ecfdf5;font-weight:bold;') }));
                return { cells: [leadCell, ...nums], plain: ['', ...(showMonth ? [''] : []), '', label, ...numPlain(S)] };
            };

            const rows = [];
            let idx = 0;
            const jamiaList = [...new Set(groups.map(g => g.jamia))];
            jamiaList.forEach(j => {
                const gs = groups.filter(g => g.jamia === j);
                gs.forEach(g => {
                    idx++;
                    rows.push({
                        cells: [idxCell(idx), ...(showMonth ? [txt(g.monthKey, { center: true, cls: 'eng-font text-xs' })] : []),
                            jamiaCell(g.jamia), classTeacherCell(g.className, g.teacher), ...numCells(g)],
                        plain: [idx, ...(showMonth ? [g.monthKey] : []), g.jamia, `${g.className} - ${g.teacher}`, ...numPlain(g)]
                    });
                });
                rows.push(totalRow(`${j} - جامعہ کل`, gs));
            });
            if (jamiaList.length > 1) rows.push(totalRow('کل میزان (تمام جامعات)', groups));

            return {
                key: 'class',
                title: 'شعبہ قراءت - کلاس وائز مجموعی رپورٹ',
                note: 'کلاس فیصد = کل نمبر ÷ (حاضر طلبہ × 100)۔ جامعہ کل فیصد = درجات کے فیصد کا اوسط۔ کیفیت: 90+ ممتاز مع الشرف، 80+ ممتاز، 70+ بہتر، باقی کمزور۔',
                columns,
                exportHeaders: ['#', ...(showMonth ? ['ماہ'] : []), 'جامعہ', 'درجہ و استاد', ...tail],
                rows
            };
        }

        async function loadUserProfile() {
            if (userProfileCache) return userProfileCache;
            try {
                if (currentUser) {
                    const snap = await getDoc(doc(db, USER_PROFILE_COLLECTION, currentUser.uid));
                    if (snap.exists()) userProfileCache = snap.data();
                }
            } catch (e) { console.warn('Profile load failed:', e); }
            return userProfileCache || {};

        function findAjeerCode(profile, jamia, teacher) {
            let code = '';
            Object.values(profile.academicYears || {}).forEach(y => {
                (y.karkardagiStructure || []).forEach(j => {
                    const jn = j.jamiaName || j.name;
                    if (jn === jamia || isSameJamia(jn, jamia)) {
                        const t = (j.teachers || []).find(t => t.name === teacher);
                        if (t && t.loginCode) code = String(t.loginCode);
                    }
                });
            });
            return code;
        }

        async function buildWeakView(data) {
            const month = filterMonth.value;
            const submitted = {};
            try {
                const ref = collection(db, 'mahana_wazahat_records');
                const wSnap = month ? await getDocs(query(ref, where('month', '==', month))) : await getDocs(ref);
                wSnap.forEach(d => { const w = d.data(); submitted[`${w.jamia}_${w.teacherName}_${w.month}`] = w; });
            } catch (e) { console.warn('Wazahat fetch failed:', e); }
            const profile = await loadUserProfile();

            // Kamzor class = jis class ki kaifiyat (form ke formula se) "کمزور" ho
            const weakClasses = groupByClass(data).filter(g => g.kaif === 'kamzor');
            weakClasses.sort((a, b) => a.percent - b.percent);
            // Aik wazahat aik ustad ke liye aik mahine ki (teacher page ka same system)
            const byTeacher = new Map();
            weakClasses.forEach(g => {
                const key = `${g.jamia}_${g.teacher}_${g.monthKey}`;
                if (!byTeacher.has(key)) byTeacher.set(key, { key, jamia: g.jamia, teacher: g.teacher, month: g.monthKey, classes: [] });
                byTeacher.get(key).classes.push(g);
            });

            const fmtDT = (ts) => { const d = new Date(ts); return `${d.toLocaleDateString('en-GB')} | ${d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true })}`; };
            const weakStu = (g) => g.students.filter(s => gradeKey(s.grade) === 'kamzor');

            const rows = [...byTeacher.values()].map((item, i) => {
                const chipsUi = item.classes.map(g => `
                    <div class="bg-white border border-red-200 rounded p-2 m-1 text-right shadow-sm">
                        <p class="text-xs font-bold text-slate-800">${esc(g.className)} <span class="eng-font text-red-600">(${g.percent}%)</span>
                            <span class="text-[10px] text-slate-500 eng-font">حاضر ${g.present}${g.kul ? ' / ' + g.kul : ''}</span></p>
                        <p class="text-[11px] text-slate-600 leading-snug whitespace-normal">${weakStu(g).length ? 'کمزور طلبہ: ' + weakStu(g).map(s => esc(s.studentName) + ' <span class="eng-font font-bold">(' + esc(s.totalMarks) + ')</span>').join('، ') : ''}</p>
                    </div>`).join('');
                const chipsPlain = item.classes.map(g => `${g.className}: ${g.percent}% (حاضر ${g.present})` + (weakStu(g).length ? ` - کمزور طلبہ: ${weakStu(g).map(s => s.studentName).join('، ')}` : '')).join(' | ');

                const w = submitted[item.key];
                const wazahatUi = w
                    ? `<div class="text-right"><p class="text-sm text-gray-800 leading-relaxed mb-3 whitespace-pre-wrap break-words">${esc(w.wazahat)}</p>
                        <span class="text-[11px] text-gray-600 eng-font font-bold bg-gray-100 px-2 py-1 rounded border inline-flex items-center gap-1"><i class="far fa-clock text-gray-400"></i> ${fmtDT(w.timestamp)}</span></div>`
                    : '<span class="text-red-500 bg-red-50 px-2 py-1 rounded text-xs font-bold border border-red-200">انتظار میں...</span>';

                const payload = {
                    jamia: item.jamia, teacher: item.teacher, month: item.month,
                    data: item.classes.map(g => ({ class: g.className, book: 'طلبہ کا مجموعی فیصد', percent: g.percent, grade: 'کمزور' })),
                    classes: item.classes.map(g => ({ class: g.className, percent: g.percent, present: g.present, total: g.kul, names: weakStu(g).map(s => s.studentName) })),
                    expectedCode: findAjeerCode(profile, item.jamia, item.teacher)
                };
                const enc = encodeURIComponent(JSON.stringify(payload));
                const actions = `
                    <button data-payload="${enc}" class="js-wa-btn bg-green-500 hover:bg-green-600 text-white eng-font text-xs font-bold py-2 px-3 rounded shadow transition w-full flex items-center justify-center mb-2"><i class="fab fa-whatsapp text-base mr-2"></i> WhatsApp</button>
                    <button data-payload="${enc}" class="js-copy-link-btn bg-teal-600 hover:bg-teal-700 text-white eng-font text-xs font-bold py-2 px-3 rounded shadow transition w-full flex items-center justify-center"><i class="fas fa-link mr-2"></i> Copy Link</button>`;

                return {

                    cells: [idxCell(i + 1), jamiaCell(item.jamia),
                        cell(`<p class="text-slate-800 font-bold">${esc(item.teacher)}</p><p class="text-slate-500 eng-font text-[10px]">${esc(item.month)}</p>`, { pdfInner: esc(item.teacher) }),
                        cell(chipsUi, { cls: 'whitespace-normal min-w-[260px] align-top', pdfInner: esc(chipsPlain) }),
                        cell(wazahatUi, { cls: 'whitespace-normal min-w-[240px] align-top', pdfInner: esc(w ? w.wazahat : 'انتظار میں') }),
                        { td: `<td class="p-2 text-center align-middle min-w-[130px]">${actions}</td>`, pdf: null }],
                    plain: [i + 1, item.jamia, item.teacher, item.month, chipsPlain, w ? w.wazahat : 'انتظار میں']
                };
            });

            return {
                key: 'weak',
                title: 'شعبہ قراءت - کمزور کلاسز اور وضاحت',
                note: rows.length ? 'وہ کلاسز جن کی مجموعی کیفیت کمزور (70% سے کم) ہے۔ استاذ کو WhatsApp یا لنک بھیج کر وضاحت طلب کریں۔' : '',
                emptyMsg: 'الحمدللہ! اس فلٹر میں کوئی کمزور کلاس نہیں ملی۔',
                columns: [{ label: '#', center: true }, { label: 'جامعہ' }, { label: 'استاذ / ماہ' }, { label: 'کمزور کلاسز (فیصد)' }, { label: 'جمع شدہ وضاحت' }, { label: 'ایکشن', noPdf: true }],
                exportHeaders: ['#', 'جامعہ', 'استاذ', 'ماہ', 'کمزور کلاسز', 'وضاحت'],
                rows
            };
        }

       async function fetchJaizaData(userId) {
            loadingSpinner.classList.remove('hidden');
            allFlattenedStudents = [];
            uniqueJamias.clear();
            uniqueClasses.clear();

            // NAYA LOGIC: Duplicate rokne ke liye ek set banaya hai
            const uniqueStudentIds = new Set(); 

            try {
                // Fetch all reports for the user
                const q = query(collection(db, "monthly_reports"), where("userId", "==", userId));
                const querySnapshot = await getDocs(q);

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const docMonthKey = data.monthKey || data.month; // e.g., "2026-09"
                    
                    if (data.jaizaReport && data.jaizaReport.data) {
                        data.jaizaReport.data.forEach((jamiaEntry) => {
                            if (jamiaEntry.status === 'Jaiza' && jamiaEntry.students && jamiaEntry.students.length > 0) {
                                const jName = jamiaEntry.name;
                                const cName = jamiaEntry.details?.class || 'نامعلوم';
                                const tName = jamiaEntry.details?.teacher || 'نامعلوم';
                                
                                uniqueJamias.add(jName);
                                uniqueClasses.add(cName);

                                jamiaEntry.students.forEach((student) => {
                                    // NAYA LOGIC: Har student ka ek unique code banaya (Month + Jamia + Class + StudentName)
                                    const studentUniqueKey = `${docMonthKey}_${jName}_${cName}_${student.name}`;
                                    
                                    // Agar ye bacha pehle se list me nahi hai to hi add karo
                                    if (!uniqueStudentIds.has(studentUniqueKey)) {
                                        uniqueStudentIds.add(studentUniqueKey); // Ab ye bacha Set me chala gaya
                                        
                                        allFlattenedStudents.push({
                                            monthKey: docMonthKey,
                                            jamia: jName,
                                            className: cName,
                                            teacher: tName,
                                            studentName: student.name || 'نامعلوم',
                                            totalMarks: student.total !== null ? student.total : '-',
                                            grade: student.grade || '-',
                                            remarks: student.remarks || '-',
                                            date: jamiaEntry.submittedAt || '-',
                                            fmt: isAdvancedClass(cName) ? 'adv' : 'basic',
                                            scores: Array.isArray(student.scores) ? student.scores : [],
                                            totalStudents: parseInt(jamiaEntry.details?.totalStudents) || 0
                                        });
                                    }
                                });
                            }
                        });
                    }
                });

                populateDropdowns();
                applyFiltersAndRender();

            } catch (error) {
                console.error("Data Fetch Error:", error);
                tableBody.innerHTML = '<tr><td colspan="7" class="text-center p-4 text-red-500 font-bold urdu-font">ڈیٹا لوڈ کرنے میں ایرر آیا۔</td></tr>';
            } finally {
                loadingSpinner.classList.add('hidden');
            }
        }

        // 2. Populate Dropdowns Dynamically
        function populateDropdowns() {
            filterJamia.innerHTML = '<option value="All">تمام جامعات (All)</option>';
            Array.from(uniqueJamias).sort().forEach(j => {
                const opt = document.createElement('option'); opt.value = j; opt.textContent = j;
                filterJamia.appendChild(opt);
            });

            filterClass.innerHTML = '<option value="All">تمام درجات (All)</option>';
            Array.from(uniqueClasses).sort().forEach(c => {
                const opt = document.createElement('option'); opt.value = c; opt.textContent = c;
                filterClass.appendChild(opt);
            });
        }

        // 3. Apply Filters and Render Table
        function applyFiltersAndRender() {
            const selectedMonth = filterMonth.value;
            const prevJamia = filterJamia.value; 
            const prevClass = filterClass.value; 

            let selectedMonthWord = '';
            if (selectedMonth !== '') {
                const dateObj = new Date(selectedMonth + "-01");
                selectedMonthWord = dateObj.toLocaleString('default', { month: 'long', year: 'numeric' });
            }

            // STEP 1: Sirf Mahine (Month) ke hisab se data filter karein
            const monthFilteredData = allFlattenedStudents.filter(s => {
                return (selectedMonth === '' || s.monthKey === selectedMonth || s.monthKey === selectedMonthWord);
            });

            // STEP 2: Dropdowns ko is mahine ke data ke hisab se update karein (Khali Jamia hat jayenge)
            const currentJamias = new Set();
            const currentClasses = new Set();
            
            monthFilteredData.forEach(s => {
                currentJamias.add(s.jamia);
                currentClasses.add(s.className);
            });

            // Jamia Dropdown update
            filterJamia.innerHTML = '<option value="All">تمام جامعات (All)</option>';
            Array.from(currentJamias).sort().forEach(j => {
                const opt = document.createElement('option'); opt.value = j; opt.textContent = j;
                if (j === prevJamia) opt.selected = true; 
                filterJamia.appendChild(opt);
            });

            // Class Dropdown update
            filterClass.innerHTML = '<option value="All">تمام درجات (All)</option>';
            Array.from(currentClasses).sort().forEach(c => {
                const opt = document.createElement('option'); opt.value = c; opt.textContent = c;
                if (c === prevClass) opt.selected = true;
                filterClass.appendChild(opt);
            });

            // STEP 3: Ab Jamia aur Class ka filter apply karein
            const finalJamia = filterJamia.value;
            const finalClass = filterClass.value;

            currentFilteredData = monthFilteredData.filter(s => {
                const matchJamia = (finalJamia === 'All' || s.jamia === finalJamia);
                const matchClass = (finalClass === 'All' || s.className === finalClass);
                return matchJamia && matchClass;
            });

            // Sorting: Jamia -> Class -> Student
            currentFilteredData.sort((a, b) => {
                if(a.jamia !== b.jamia) return a.jamia.localeCompare(b.jamia, 'ur');
                if(a.className !== b.className) return a.className.localeCompare(b.className, 'ur');
                return a.studentName.localeCompare(b.studentName, 'ur');
            });

            renderTable(currentFilteredData);
        }

                if (k === 'sharaf' || k === 'mumtaz') m_sharaf++; else if (k === 'behtar') behtar++; else if (k === 'kamzor') kamzor++;
            });
            document.getElementById('stat-total').textContent = data.length;
            document.getElementById('stat-mumtaz').textContent = m_sharaf;
            document.getElementById('stat-behtar').textContent = behtar;
            document.getElementById('stat-kamzor').textContent = kamzor;

                currentView = null;
                noDataMsg.classList.remove('hidden');
                container.classList.add('hidden');
                document.getElementById('view-note').classList.add('hidden');

            noDataMsg.classList.add('hidden');

                    <td colspan="${cols.length}" style="border: none; text-align: center; padding-bottom: 15px;">
                        <h2 style="font-family: 'Jameel Noori Nastaleeq', sans-serif; font-size: 26px; color: #0f766e; margin: 0;">${esc(currentView.title)}</h2>
                        <p id="pdf-subtitle-text" style="font-family: 'Poppins', sans-serif; font-size: 14px; color: #475569; margin: 5px 0 0 0;"></p>
                    </td>
                </tr>
                <tr>${cols.map(c => `<th style="${c.center ? 'text-align:center;' : ''}${dStyle}">${esc(c.label)}</th>`).join('')}</tr>`;

            const body = document.getElementById('pdf-table-body');
            body.innerHTML = '';
            currentView.rows.forEach(r => {
                const tr = document.createElement('tr');
                if (r.header) {
                    tr.innerHTML = r.header.map(l => `<th style="text-align:center;background:#0f766e;color:white;${dStyle}">${esc(l)}</th>`).join('');
                } else {
                    tr.innerHTML = r.cells.filter(c => c.pdf !== null).map(c => dense ? c.pdf.replace('<td style="', `<td style="${dStyle}`) : c.pdf).join('');
                }
                body.appendChild(tr);
            });

            document.getElementById('pdf-subtitle-text').innerText = `Month: ${month || 'All'} | Jamia: ${jamiaFilter === 'All' ? 'All Jamiaat' : jamiaFilter}`;

            const pdfContainer = document.getElementById('pdf-export-container');
            pdfContainer.style.display = 'block';

            const opt = {
                margin: [10, 10, 15, 10],
                filename: `Jaiza_${currentView.key}_${month || 'All'}.pdf`,
                image: { type: 'jpeg', quality: 1 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' },
                pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
            };

            html2pdf().set(opt).from(document.getElementById('pdf-content')).toPdf().get('pdf').then(function (pdf) {
                const totalPages = pdf.internal.getNumberOfPages();
                for (let i = 1; i <= totalPages; i++) {
                    pdf.setPage(i);
                    pdf.setFontSize(8);
                    pdf.setTextColor(71, 85, 105);
                    pdf.text(`Page ${i} of ${totalPages}`, 15, pdf.internal.pageSize.getHeight() - 8);
                }
            }).save().then(() => { pdfContainer.style.display = 'none'; });
        });
    </script>
</body>
</html>
