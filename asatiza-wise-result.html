<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asatiza Wise Result</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.cdnfonts.com/css/jameel-noori-nastaleeq" rel="stylesheet" />
  <style>
  body, input, button, textarea, select { font-family:'Jameel Noori Nastaleeq', serif; }
  .inner-table select, .inner-table input {
    width:100%; border:1px solid #cbd5e1; text-align:center; padding:6px; border-radius:6px; font-size:0.95rem;
  }
  .inner-table input[readonly] { background-color: #f1f5f9; cursor: not-allowed; color: #475569; font-weight: bold; }
  </style>
</head>
<body class="bg-gray-100 p-2 sm:p-6">

<div class="max-w-7xl mx-auto bg-white shadow-xl rounded-lg overflow-hidden border-t-4 border-teal-700">
  <div class="bg-white p-4 flex justify-between items-center border-b">
    <h1 class="text-xl font-bold text-teal-800">اساتذہ وائز رزلٹ</h1>
    <div id="jamia-name-head" class="text-teal-600 font-bold border-b-2 border-teal-600"></div>
  </div>

  <div class="p-4">
    <input type="hidden" id="jamiaName"><input type="hidden" id="examType"><input type="hidden" id="examYear">
    
    <div class="flex flex-wrap gap-4 mb-6 bg-teal-50 p-4 rounded-lg border border-teal-100 shadow-sm">
      <div><label class="block text-[10px] font-bold text-teal-600 mb-1">امتحان</label><div id="display-type" class="p-2 bg-white border rounded font-bold text-gray-700 min-w-[120px]">---</div></div>
      <div><label class="block text-[10px] font-bold text-teal-600 mb-1">تعلیمی سال</label><div id="display-year" class="p-2 bg-white border rounded font-bold text-gray-700 min-w-[120px]">---</div></div>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full border-collapse border border-gray-300">
        <thead class="bg-teal-50 text-sm">
          <tr>
            <th class="border p-2 w-10">نمبر</th>
            <th class="border p-2 w-48">نام استاد</th>
            <th class="border p-2">تفصیل (کلاس اور مضمون منتخب کریں)</th>
            <th class="border p-2 w-28">مجموعی فیصد</th>
          </tr>
        </thead>
        <tbody id="main-teacher-body"></tbody>
      </table>
    </div>

    <div class="mt-6 flex items-center justify-between">
      <button onclick="addTeacherRow()" class="w-44 bg-slate-800 text-white py-2.5 rounded-lg font-bold text-sm hover:bg-slate-700">+ استاذ شامل کریں</button>
      <button onclick="saveData()" class="w-44 bg-teal-600 text-white py-2.5 rounded-lg font-bold text-sm hover:bg-teal-700">محفوظ کریں</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDhPuyX0y1gb3uXoIRcdcQPkd5Q4KJFgl0", authDomain: "data-f15ab.firebaseapp.com",
  projectId: "data-f15ab", storageBucket: "data-f15ab.appspot.com", messagingSenderId: "449137002393",
  appId: "1:449137002393:web:6a23721d00b1b0daeb3508"
};
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
const params = new URLSearchParams(window.location.search);
const jamiaName = params.get('jamia') || 'Jamia';
const examType = params.get('examType') || '';
const examYear = params.get('examYear') || '';

window.excelSubjectsData = {}; // Excel se aaye hui classes aur subjects yahan rahenge

// 1. Pura Excel Data Load Karein
async function loadExcelData() {
  const customId = `${jamiaName}_${examYear}_${examType}`.replace(/\//g, '-').replace(/\s+/g, '_');
  const q = query(collection(db, "excel_subjects_data"), where("jamia", "==", jamiaName), where("examType", "==", examType), where("examYear", "==", examYear));
  const snap = await getDocs(q);
  if(!snap.empty) window.excelSubjectsData = snap.docs[0].data().classes || {};
}

// 2. Saved Asatiza Data Load Karein
async function loadFirestore() {
  const q = query(collection(db, "asatiza_wise_results"), where("jamia", "==", jamiaName), where("examType", "==", examType), where("examYear", "==", examYear));
  const snap = await getDocs(q);
  if (snap.empty) return;
  let latestDoc = snap.docs[0];
  snap.docs.forEach(d => { if (d.data().timestamp > latestDoc.data().timestamp) latestDoc = d; });
  document.getElementById('main-teacher-body').innerHTML = "";
  latestDoc.data().data.forEach(t => addTeacherRow(t.teacher, t.periods));
}

let teacherCount = 0;
window.addTeacherRow = function(name='', periods=null) {
  teacherCount++;
  const tbody = document.getElementById('main-teacher-body');
  const tr = document.createElement('tr');
  tr.className = 'border-b hover:bg-gray-50';
  let pHTML = '';
  if(periods) periods.forEach(p => { pHTML += periodRowHTML(p); });
  else for(let i=0; i<2; i++) pHTML += periodRowHTML();

  tr.innerHTML = `
    <td class='border p-2 text-center'>${teacherCount}</td>
    <td class='border p-2'>
      <div class='flex gap-2'><input value='${name}' placeholder='نام استاد' class='w-full p-2 border rounded'><button onclick='this.closest("tr").remove()' class='text-red-600'>🗑</button></div>
    </td>
    <td class='border p-2'>
      <table class='w-full inner-table'><thead class="bg-gray-100 text-[11px]"><tr>
        <th class="w-32">کلاس</th><th>مضمون</th><th class="w-16">کل</th><th class="w-16">کامیاب</th><th class="w-20">فیصد</th><th class="w-24">کیفیت</th><th class="w-10">حذف</th>
      </tr></thead><tbody id='periods-${teacherCount}'>${pHTML}</tbody></table>
      <button onclick='addPeriodRow(${teacherCount})' class='text-teal-600 text-xs mt-2 font-bold'>+ مزید مضمون</button>
    </td>
    <td class='border p-2 text-center'><div id='total-${teacherCount}' class='font-bold text-teal-700'>0%</div></td>`;
  tbody.appendChild(tr);
};

window.periodRowHTML = function(p={}) {
  let classOpts = '<option value="">کلاس منتخب کریں</option>';
  for(let c in window.excelSubjectsData) classOpts += `<option value="${c}" ${p.class===c?'selected':''}>${c}</option>`;
  
  let subjOpts = '<option value="">مضمون</option>';
  if(p.class && window.excelSubjectsData[p.class]) {
    for(let s in window.excelSubjectsData[p.class]) subjOpts += `<option value="${s}" ${p.subject===s?'selected':''}>${s}</option>`;
  }

  return `<tr>
    <td><select class="class-select bg-white" onchange="updateSubjects(this)">${classOpts}</select></td>
    <td><select class="subj-select bg-white" onchange="fillMarks(this)">${subjOpts}</select></td>
    <td><input type='number' value='${p.total||""}' readonly class="total-inp"></td>
    <td><input type='number' value='${p.passed||""}' readonly class="passed-inp"></td>
    <td><input readonly value='${p.percentage||""}'></td>
    <td><input readonly value='${p.kaifiyat||""}'></td>
    <td style="text-align:center"><button onclick="removePeriodRow(this)" style="color:#dc2626;font-weight:bold">🗑</button></td>
  </tr>`;
};

window.addPeriodRow = (id) => document.getElementById(`periods-${id}`).insertAdjacentHTML('beforeend', window.periodRowHTML());

window.updateSubjects = function(sel) {
  const tr = sel.closest('tr'); const subSel = tr.querySelector('.subj-select'); const c = sel.value;
  subSel.innerHTML = '<option value="">مضمون منتخب کریں</option>';
  if(c && window.excelSubjectsData[c]) {
    Object.keys(window.excelSubjectsData[c]).forEach(s => subSel.innerHTML += `<option value="${s}">${s}</option>`);
  }
  tr.querySelector('.total-inp').value = ''; tr.querySelector('.passed-inp').value = ''; window.calcRow(tr);
};

window.fillMarks = function(sel) {
  const tr = sel.closest('tr'); const c = tr.querySelector('.class-select').value; const s = sel.value;
  if(c && s && window.excelSubjectsData[c][s]) {
    const data = window.excelSubjectsData[c][s];
    tr.querySelector('.total-inp').value = data.total; tr.querySelector('.passed-inp').value = data.passed;
  } else { tr.querySelector('.total-inp').value = ''; tr.querySelector('.passed-inp').value = ''; }
  window.calcRow(tr);
};

window.calcRow = function(tr) {
  const t = parseFloat(tr.querySelector('.total-inp').value) || 0;
  const p = parseFloat(tr.querySelector('.passed-inp').value) || 0;
  const percInp = tr.children[4].children[0]; const kaifInp = tr.children[5].children[0];

  if(t > 0) {
    const val = (p/t)*100; percInp.value = val.toFixed(1)+'%';
    let k='', c='';
    if(val>=90){k='ممتاز';c='#059669';} else if(val>=70){k='بہتر';c='#2563eb';} else if(val>=60){k='مناسب';c='#d97706';}
    else if(val>=51){k='کمزور';c='#7c3aed';} else {k='تشویش ناک';c='#dc2626';}
    kaifInp.value=k; kaifInp.style.color=c; percInp.style.color=c;
  } else { percInp.value=''; kaifInp.value=''; }
  updateTotal(tr.closest('tbody').id.split('-')[1]);
};

function updateTotal(id) {
  let t=0, p=0;
  document.querySelectorAll(`#periods-${id} tr`).forEach(r => {
    t += parseFloat(r.querySelector('.total-inp').value)||0; p += parseFloat(r.querySelector('.passed-inp').value)||0;
  });
  const box = document.getElementById(`total-${id}`);
  if(t>0) {
    const val = (p/t)*100; let k='', c='';
    if(val>=90){k='ممتاز';c='#059669';} else if(val>=70){k='بہتر';c='#2563eb';} else if(val>=60){k='مناسب';c='#d97706';}
    else if(val>=51){k='کمزور';c='#7c3aed';} else {k='تشویش ناک';c='#dc2626';}
    box.innerHTML=`<div style="color:${c};font-weight:bold">${val.toFixed(1)}%</div><div style="color:${c};font-size:12px">${k}</div>`;
  } else box.innerText = '0%';
}

window.removePeriodRow = (btn) => {
  const tr = btn.closest('tr'); const id = tr.closest('tbody').id.split('-')[1]; tr.remove(); updateTotal(id);
};

window.saveData = async function() {
  const allTeachers = [];
  document.querySelectorAll(".border-b.hover\\:bg-gray-50").forEach(tr => {
    const tName = tr.querySelector('input[placeholder="نام استاد"]')?.value;
    if(!tName) return;
    const periods = [];
    tr.querySelectorAll('.inner-table tbody tr').forEach(r => {
      const c = r.querySelector('.class-select').value; const s = r.querySelector('.subj-select').value;
      if(c && s) {
        periods.push({
          class: c, subject: s, total: r.querySelector('.total-inp').value, passed: r.querySelector('.passed-inp').value,
          percentage: r.children[4].children[0].value, kaifiyat: r.children[5].children[0].value
        });
      }
    });
    if(periods.length > 0) allTeachers.push({ teacher: tName, periods });
  });

  try {
    await addDoc(collection(db, "asatiza_wise_results"), { jamia: jamiaName, examType, examYear, data: allTeachers, timestamp: Date.now() });
    alert("رزلٹ کامیابی سے محفوظ ہو گیا ہے۔ ✅");
  } catch (e) { alert("Save error: " + e.message); }
};

document.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('jamiaName').value = jamiaName; document.getElementById('examType').value = examType; document.getElementById('examYear').value = examYear;
  document.getElementById('jamia-name-head').innerText = decodeURIComponent(jamiaName);
  document.getElementById('display-type').innerText = decodeURIComponent(examType);
  document.getElementById('display-year').innerText = decodeURIComponent(examYear);

  await loadExcelData(); // 1st Step: Load Dropdown Options
  await loadFirestore(); // 2nd Step: Load Saved Teachers

  if(document.getElementById('main-teacher-body').children.length === 0) {
    addTeacherRow(); // Agar koi data nahi hai to ek khali row de dein
  }
});
</script>
</body>
</html>
