<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asatiza Wise Result</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.cdnfonts.com/css/jameel-noori-nastaleeq" rel="stylesheet" />
  <style>
  body, input, button, textarea, select { font-family:'Jameel Noori Nastaleeq', serif; }
  .inner-table select, .inner-table input {
    width:100%; border:1px solid #cbd5e1; text-align:center; padding:6px; border-radius:6px; font-size:0.95rem;
  }
  .inner-table input[readonly] { background-color: #f1f5f9; cursor: not-allowed; color: #475569; font-weight: bold; }
  </style>
</head>
<body class="bg-gray-100 p-2 sm:p-6">

<div class="max-w-7xl mx-auto bg-white shadow-xl rounded-lg overflow-hidden border-t-4 border-teal-700">
  <div class="bg-white p-4 flex justify-between items-center border-b">
    <h1 class="text-xl font-bold text-teal-800">اساتذہ وائز رزلٹ</h1>
    <div id="jamia-name-head" class="text-teal-600 font-bold border-b-2 border-teal-600"></div>
  </div>

  <div class="p-4">
    <input type="hidden" id="jamiaName"><input type="hidden" id="examType"><input type="hidden" id="examYear">
    
    <div class="flex flex-wrap gap-4 mb-6 bg-teal-50 p-4 rounded-lg border border-teal-100 shadow-sm">
      <div><label class="block text-[10px] font-bold text-teal-600 mb-1">امتحان</label><div id="display-type" class="p-2 bg-white border rounded font-bold text-gray-700 min-w-[120px]">---</div></div>
      <div><label class="block text-[10px] font-bold text-teal-600 mb-1">تعلیمی سال</label><div id="display-year" class="p-2 bg-white border rounded font-bold text-gray-700 min-w-[120px]">---</div></div>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full border-collapse border border-gray-300">
        <thead class="bg-teal-50 text-sm">
          <tr>
            <th class="border p-2 w-10">نمبر</th>
            <th class="border p-2 w-48">نام استاد</th>
            <th class="border p-2">تفصیل (کلاس اور مضمون منتخب کریں)</th>
            <th class="border p-2 w-28">مجموعی فیصد</th>
          </tr>
        </thead>
        <tbody id="main-teacher-body"></tbody>
      </table>
    </div>

    <div class="mt-6 flex items-center justify-between">
      <button onclick="addTeacherRow()" class="w-44 bg-slate-800 text-white py-2.5 rounded-lg font-bold text-sm hover:bg-slate-700">+ مزید استاذ</button>
      <button onclick="saveData()" class="w-44 bg-teal-600 text-white py-2.5 rounded-lg font-bold text-sm hover:bg-teal-700">محفوظ کریں</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"; // 👈 NAYA IMPORT

const firebaseConfig = {
  apiKey: "AIzaSyDhPuyX0y1gb3uXoIRcdcQPkd5Q4KJFgl0", authDomain: "data-f15ab.firebaseapp.com",
  projectId: "data-f15ab", storageBucket: "data-f15ab.appspot.com", messagingSenderId: "449137002393",
  appId: "1:449137002393:web:6a23721d00b1b0daeb3508"
};
const app = initializeApp(firebaseConfig); 
const auth = getAuth(app); // 👈 AUTH INITIALIZE
const db = getFirestore(app);
const params = new URLSearchParams(window.location.search);

const jamiaName = params.get('jamia') || 'Jamia';
const examType = params.get('examType') || '';
const examYear = params.get('examYear') || '';

window.excelSubjectsData = {}; 
window.academicConfigData = null;

// 🔹 1. Load Admin Academic Config
async function loadAcademicConfig() {
  try {
    const snap = await getDoc(doc(db, "settings", "academic_config"));
    if(snap.exists()) window.academicConfigData = snap.data();
  } catch(e){}
}

// 🔹 2. Load Excel Data
async function loadExcelData() {
  const q = query(collection(db, "excel_subjects_data"), where("jamia", "==", jamiaName), where("examType", "==", examType), where("examYear", "==", examYear));
  const snap = await getDocs(q);
  if(!snap.empty) {
      let docData = snap.docs[0].data();
      window.excelSubjectsData = docData.classes || {};
  }
}

// 🔹 3. SMART MATCHING LOGIC
function cleanUrdu(str) {
  if(!str) return "";
  return String(str).toLowerCase().replace(/\s+/g, ' ').replace(/ي|ى/g, 'ی').replace(/ك/g, 'ک').replace(/آ/g, 'ا').replace(/ة/g, 'ہ').replace(/[\u200B-\u200D\uFEFF]/g, '').trim();
}

function checkClassMatch(class1, class2) {
  let c1 = cleanUrdu(class1); let c2 = cleanUrdu(class2);
  if (c1 === c2 || c1.includes(c2) || c2.includes(c1)) return true;
  if (window.academicConfigData && window.academicConfigData.classes) {
      for (let c of window.academicConfigData.classes) {
          let urdu = cleanUrdu(c.classNameUrdu); let eng = cleanUrdu(c.classNameEng);
          let match1 = (c1 === urdu || c1 === eng || (urdu && c1.includes(urdu)) || (eng && c1.includes(eng)));
          let match2 = (c2 === urdu || c2 === eng || (urdu && c2.includes(urdu)) || (eng && c2.includes(eng)));
          if (match1 && match2) return true;
      }
  }
  return false;
}

function getExactExcelMapping(karkClass, karkSubj) {
  let cleanS = cleanUrdu(karkSubj);
  for (let exClass in window.excelSubjectsData) {
      if (checkClassMatch(karkClass, exClass)) {
          for (let exSubj in window.excelSubjectsData[exClass]) {
              let cleanExS = cleanUrdu(exSubj);
              if (cleanExS === cleanS || cleanExS.includes(cleanS) || cleanS.includes(cleanExS)) {
                  return { exClass: exClass, exSubj: exSubj, data: window.excelSubjectsData[exClass][exSubj] };
              }
          }
      }
  }
  return null;
}

// 🔹 4. Load Karkardagi Teachers (FIXED ERROR HANDLING)
async function loadKarkardagiTeachers() {
    let uid = params.get('uid');
    
    try {
        if (!uid) {
            // Yahan error aa raha tha, ab yeh successfully catch ho jayega agar permission block hui to
            const usersSnap = await getDocs(collection(db, "users"));
            for (let uDoc of usersSnap.docs) {
                const data = uDoc.data();
                if(data.jamiaatList && data.jamiaatList.some(j => (j.name || j.jamiaName || j) === jamiaName)) {
                    uid = uDoc.id; break;
                }
            }
        }
        
        if (!uid) return [];

        const userDoc = await getDoc(doc(db, "users", uid));
        if (userDoc.exists()) {
            const data = userDoc.data();
            const academicYears = data.academicYears || {};
            let latestYear = Object.keys(academicYears).sort().reverse()[0];
            if (latestYear) {
                const structure = academicYears[latestYear].karkardagiStructure || [];
                const jamiaData = structure.find(j => j.jamiaName === jamiaName);
                if (jamiaData) return jamiaData.teachers || [];
            }
        }
    } catch (e) { 
        console.error("Firebase Permission Error (Karkardagi):", e); 
        // Alert show kar sakte hain, par page crash nahi hoga
    }
    return [];
}

// 🔹 5. Load Already Saved Data
async function loadSavedFirestoreData() {
  const q = query(collection(db, "asatiza_wise_results"), where("jamia", "==", jamiaName), where("examType", "==", examType), where("examYear", "==", examYear));
  try {
      const snap = await getDocs(q);
      if (snap.empty) return false;
      
      let latestDoc = snap.docs[0];
      snap.docs.forEach(d => { if (d.data().timestamp > latestDoc.data().timestamp) latestDoc = d; });
      
      document.getElementById('main-teacher-body').innerHTML = "";
      latestDoc.data().data.forEach(t => window.addTeacherRow(t.teacher, t.periods));
      return true;
  } catch(e) {
      console.error("Saved Data Load Error:", e);
      return false;
  }
}

let teacherCount = 0;
window.addTeacherRow = function(name='', periods=null) {
  teacherCount++;
  const tbody = document.getElementById('main-teacher-body');
  const tr = document.createElement('tr');
  tr.className = 'border-b hover:bg-gray-50';
  let pHTML = '';
  if(periods && periods.length > 0) {
      periods.forEach(p => { pHTML += window.periodRowHTML(p); });
  } else {
      for(let i=0; i<1; i++) pHTML += window.periodRowHTML(); 
  }

  tr.innerHTML = `
    <td class='border p-2 text-center font-bold'>${teacherCount}</td>
    <td class='border p-2'>
      <div class='flex gap-2'>
          <input value='${name}' placeholder='نام استاد' class='w-full p-2 border rounded font-bold text-indigo-900'>
          <button onclick='this.closest("tr").remove()' class='text-red-600' title="Delete Teacher">🗑</button>
      </div>
    </td>
    <td class='border p-2'>
      <table class='w-full inner-table'><thead class="bg-gray-100 text-[11px]"><tr>
        <th class="w-32">کلاس</th><th>مضمون</th><th class="w-16">کل</th><th class="w-16">کامیاب</th><th class="w-20">فیصد</th><th class="w-24">کیفیت</th><th class="w-10">حذف</th>
      </tr></thead><tbody id='periods-${teacherCount}'>${pHTML}</tbody></table>
      <button onclick='addPeriodRow(${teacherCount})' class='text-teal-600 text-xs mt-2 font-bold bg-teal-50 px-3 py-1 rounded border border-teal-200'>+ مزید مضمون</button>
    </td>
    <td class='border p-2 text-center'><div id='total-${teacherCount}' class='font-bold text-teal-700 text-lg'>0%</div></td>`;
  tbody.appendChild(tr);
};

window.periodRowHTML = function(p={}) {
  let cVal = p.class || ''; let sVal = p.subject || '';

  // Class Dropdown 
  let classOpts = '<option value="">کلاس منتخب کریں</option>';
  let classFound = false;
  for(let c in window.excelSubjectsData) {
      let selected = (c === cVal) ? 'selected' : '';
      if (c === cVal) classFound = true;
      classOpts += `<option value="${c}" ${selected}>${c}</option>`;
  }
  if (cVal && !classFound) classOpts += `<option value="${cVal}" selected class="text-red-500">${cVal} (No Data)</option>`;

  // Subject Dropdown
  let subjOpts = '<option value="">مضمون</option>';
  let subjFound = false;
  if (classFound && window.excelSubjectsData[cVal]) {
      for(let s in window.excelSubjectsData[cVal]) {
          let selected = (s === sVal) ? 'selected' : '';
          if (s === sVal) subjFound = true;
          subjOpts += `<option value="${s}" ${selected}>${s}</option>`;
      }
  }
  if (sVal && !subjFound) subjOpts += `<option value="${sVal}" selected class="text-red-500">${sVal} (No Data)</option>`;

  return `<tr>
    <td><select class="class-select bg-white font-bold text-indigo-700" onchange="updateSubjects(this)">${classOpts}</select></td>
    <td><select class="subj-select bg-white font-bold text-indigo-700" onchange="fillMarks(this)">${subjOpts}</select></td>
    <td><input type='number' value='${p.total||""}' readonly class="total-inp font-bold bg-gray-100"></td>
    <td><input type='number' value='${p.passed||""}' readonly class="passed-inp font-bold bg-gray-100"></td>
    <td><input readonly value='${p.percentage||""}' class="font-bold"></td>
    <td><input readonly value='${p.kaifiyat||""}' class="font-bold"></td>
    <td style="text-align:center"><button onclick="removePeriodRow(this)" style="color:#dc2626;font-weight:bold" title="Delete Period">🗑</button></td>
  </tr>`;
};

window.addPeriodRow = (id) => document.getElementById(`periods-${id}`).insertAdjacentHTML('beforeend', window.periodRowHTML());

window.updateSubjects = function(sel) {
  const tr = sel.closest('tr'); const subSel = tr.querySelector('.subj-select'); const c = sel.value;
  subSel.innerHTML = '<option value="">مضمون منتخب کریں</option>';
  if(c && window.excelSubjectsData[c]) {
    Object.keys(window.excelSubjectsData[c]).forEach(s => subSel.innerHTML += `<option value="${s}">${s}</option>`);
  }
  tr.querySelector('.total-inp').value = ''; tr.querySelector('.passed-inp').value = ''; window.calcRow(tr);
};

window.fillMarks = function(sel) {
  const tr = sel.closest('tr'); const c = tr.querySelector('.class-select').value; const s = sel.value;
  if(c && s && window.excelSubjectsData[c] && window.excelSubjectsData[c][s]) {
    const data = window.excelSubjectsData[c][s];
    tr.querySelector('.total-inp').value = data.total; tr.querySelector('.passed-inp').value = data.passed;
  } else { tr.querySelector('.total-inp').value = ''; tr.querySelector('.passed-inp').value = ''; }
  window.calcRow(tr);
};

window.calcRow = function(tr) {
  const t = parseFloat(tr.querySelector('.total-inp').value) || 0;
  const p = parseFloat(tr.querySelector('.passed-inp').value) || 0;
  const percInp = tr.children[4].children[0]; const kaifInp = tr.children[5].children[0];

  if(t > 0) {
    const val = (p/t)*100; percInp.value = val.toFixed(1)+'%';
    let k='', c='';
    if(val>=90){k='ممتاز';c='#059669';} else if(val>=70){k='بہتر';c='#2563eb';} else if(val>=60){k='مناسب';c='#d97706';}
    else if(val>=51){k='کمزور';c='#7c3aed';} else {k='تشویش ناک';c='#dc2626';}
    kaifInp.value=k; kaifInp.style.color=c; percInp.style.color=c;
  } else { percInp.value=''; kaifInp.value=''; }
  updateTotal(tr.closest('tbody').id.split('-')[1]);
};

function updateTotal(id) {
  let t=0, p=0;
  document.querySelectorAll(`#periods-${id} tr`).forEach(r => {
    t += parseFloat(r.querySelector('.total-inp').value)||0; p += parseFloat(r.querySelector('.passed-inp').value)||0;
  });
  const box = document.getElementById(`total-${id}`);
  if(t>0) {
    const val = (p/t)*100; let k='', c='';
    if(val>=90){k='ممتاز';c='#059669';} else if(val>=70){k='بہتر';c='#2563eb';} else if(val>=60){k='مناسب';c='#d97706';}
    else if(val>=51){k='کمزور';c='#7c3aed';} else {k='تشویش ناک';c='#dc2626';}
    box.innerHTML=`<div style="color:${c};font-weight:bold">${val.toFixed(1)}%</div><div style="color:${c};font-size:12px">${k}</div>`;
  } else box.innerText = '0%';
}

window.removePeriodRow = (btn) => {
  const tr = btn.closest('tr'); const id = tr.closest('tbody').id.split('-')[1]; tr.remove(); updateTotal(id);
};

window.saveData = async function() {
  const allTeachers = [];
  document.querySelectorAll(".border-b.hover\\:bg-gray-50").forEach(tr => {
    const tName = tr.querySelector('input[placeholder="نام استاد"]')?.value;
    if(!tName) return;
    const periods = [];
    tr.querySelectorAll('.inner-table tbody tr').forEach(r => {
      const c = r.querySelector('.class-select').value; const s = r.querySelector('.subj-select').value;
      if(c && s) {
        periods.push({
          class: c, subject: s, total: r.querySelector('.total-inp').value, passed: r.querySelector('.passed-inp').value,
          percentage: r.children[4].children[0].value, kaifiyat: r.children[5].children[0].value
        });
      }
    });
    if(periods.length > 0) allTeachers.push({ teacher: tName, periods });
  });

  try {
    await addDoc(collection(db, "asatiza_wise_results"), { jamia: jamiaName, examType, examYear, data: allTeachers, timestamp: Date.now() });
    alert("الحمدللہ! رزلٹ کامیابی سے محفوظ ہو گیا ہے۔ ✅");
  } catch (e) { alert("Save error: " + e.message); }
};

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('jamiaName').value = jamiaName; 
  document.getElementById('examType').value = examType; 
  document.getElementById('examYear').value = examYear;
  document.getElementById('jamia-name-head').innerText = decodeURIComponent(jamiaName);
  document.getElementById('display-type').innerText = decodeURIComponent(examType);
  document.getElementById('display-year').innerText = decodeURIComponent(examYear);

  // 👈 FIX: Auth load hone ka wait karein taake Session verify ho sake
  onAuthStateChanged(auth, async (user) => {
      await loadAcademicConfig();
      await loadExcelData();
      const karkardagiTeachers = await loadKarkardagiTeachers();

      const savedDataExists = await loadSavedFirestoreData();

      if (!savedDataExists) {
          if (karkardagiTeachers.length > 0) {
              karkardagiTeachers.forEach(t => {
                  let periodsForUI = [];
                  (t.periods || []).forEach(p => {
                      let matchInfo = getExactExcelMapping(p.className, p.bookName);
                      
                      if (matchInfo) {
                          periodsForUI.push({
                              class: matchInfo.exClass,
                              subject: matchInfo.exSubj,
                              total: matchInfo.data.total,
                              passed: matchInfo.data.passed,
                              percentage: '', kaifiyat: ''
                          });
                      } else {
                          periodsForUI.push({
                              class: p.className, subject: p.bookName,
                              total: '', passed: '', percentage: '', kaifiyat: ''
                          });
                      }
                  });
                  if(periodsForUI.length === 0) periodsForUI = [{}];
                  window.addTeacherRow(t.name, periodsForUI);
              });
          } else {
              window.addTeacherRow(); 
          }
      }

      setTimeout(() => {
          document.querySelectorAll('.total-inp').forEach(inp => {
              if (inp.value) window.calcRow(inp.closest('tr'));
          });
      }, 800);
  });
});
</script>
</body>
</html>
