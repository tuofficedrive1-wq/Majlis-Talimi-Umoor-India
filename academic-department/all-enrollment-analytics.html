<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Users Enrollment Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #4f46e5; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="antialiased text-slate-800">

    <div id="loader" class="fixed inset-0 bg-slate-900/40 flex justify-center items-center z-[100] hidden backdrop-blur-sm">
        <div class="loader"></div>
    </div>

    <header class="bg-white shadow-sm sticky top-0 z-50 border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <h1 class="text-lg md:text-xl font-bold text-slate-800 tracking-tight">All Users Enrollment Analytics</h1>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6">
        <!-- Filters / Search -->
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Filter by Region</label>
                <select id="filter-region" onchange="applyFilters()" class="w-full p-2.5 border border-slate-200 rounded-lg text-sm outline-none">
                    <option value="">All Regions</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Filter by State</label>
                <select id="filter-state" onchange="applyFilters()" class="w-full p-2 border border-slate-200 rounded-lg text-sm outline-none">
                    <option value="">All States</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Filter by City</label>
                <select id="filter-city" onchange="applyFilters()" class="w-full p-2 border border-slate-200 rounded-lg text-sm outline-none">
                    <option value="">All Cities</option>
                </select>
            </div>
        </div>

        <!-- Data Table -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                <h3 class="font-bold text-slate-700 text-sm">Total Records Found: <span id="total-records" class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-md">0</span></h3>
            </div>
            <div class="overflow-x-auto max-h-[600px]">
                <table class="w-full text-left border-collapse whitespace-nowrap">
                    <thead class="sticky top-0 bg-slate-100 z-10">
                        <tr class="text-slate-600 text-xs font-bold uppercase tracking-wider border-b border-slate-200">
                            <th class="p-3">Region</th>
                            <th class="p-3">State</th>
                            <th class="p-3">City</th>
                            <th class="p-3">Jamia Name</th>
                            <th class="p-3">Student Name</th>
                            <th class="p-3">Father's Name</th>
                            <th class="p-3">JM Class</th>
                            <th class="p-3">Admission Type</th>
                            <th class="p-3">Status</th>
                        </tr>
                    </thead>
                    <tbody id="analytics-tbody" class="text-xs md:text-sm text-slate-600 divide-y divide-slate-100">
                        <tr><td colspan="9" class="p-8 text-center text-slate-400">Data load ho raha hai...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDhPuyX0y1gb3uXoIRcdcQPkd5Q4KJFgl0",
            authDomain: "data-f15ab.firebaseapp.com",
            projectId: "data-f15ab",
            storageBucket: "data-f15ab.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let masterData = [];

        async function loadAllData() {
            document.getElementById('loader').classList.remove('hidden');
            try {
                const recordsSnap = await getDocs(collection(db, "enrollment_records"));
                let records = [];
                recordsSnap.forEach(d => records.push({ id: d.id, ...d.data() }));

                const usersSnap = await getDocs(collection(db, "users"));
                let usersMap = {};
                usersSnap.forEach(d => {
                    usersMap[d.id] = d.data();
                });

                masterData = records.map(r => {
                    const inspector = usersMap[r.inspectorId] || {};
                    return {
                        ...r,
                        region: r.region || inspector.region || '—',
                        state: r.state || inspector.state || '—',
                        city: r.city || inspector.city || '—'
                    };
                });

                populateDropdowns(masterData);
                renderTable(masterData);

            } catch (err) {
                console.error("Error loading analytics data:", err);
                alert("Data load karne mein masla aaya.");
            } finally {
                document.getElementById('loader').classList.add('hidden');
            }
        }

        function populateDropdowns(data) {
            const regions = [...new Set(data.map(item => item.region).filter(x => x && x !== '—'))].sort();
            const states = [...new Set(data.map(item => item.state).filter(x => x && x !== '—'))].sort();
            const cities = [...new Set(data.map(item => item.city).filter(x => x && x !== '—'))].sort();

            document.getElementById('filter-region').innerHTML = '<option value="">All Regions</option>' + regions.map(r => `<option value="${r}">${r}</option>`).join('');
            document.getElementById('filter-state').innerHTML = '<option value="">All States</option>' + states.map(s => `<option value="${s}">${s}</option>`).join('');
            document.getElementById('filter-city').innerHTML = '<option value="">All Cities</option>' + cities.map(c => `<option value="${c}">${c}</option>`).join('');
        }

        window.applyFilters = function() {
            const reg = document.getElementById('filter-region').value;
            const st = document.getElementById('filter-state').value;
            const ct = document.getElementById('filter-city').value;

            const filtered = masterData.filter(item => {
                return (!reg || item.region === reg) &&
                       (!st || item.state === st) &&
                       (!ct || item.city === ct);
            });

            renderTable(filtered);
        }

        function renderTable(data) {
            const tbody = document.getElementById('analytics-tbody');
            document.getElementById('total-records').textContent = data.length;

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="p-8 text-center text-slate-400">Koi record nahi mila.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(r => `
                <tr class="hover:bg-slate-50">
                    <td class="p-3 font-semibold text-indigo-600">${r.region}</td>
                    <td class="p-3 font-semibold text-slate-700">${r.state}</td>
                    <td class="p-3 text-slate-600">${r.city}</td>
                    <td class="p-3 font-bold text-slate-800">${r.jamiaName || '—'}</td>
                    <td class="p-3 font-bold text-indigo-700">${r.studentName || '—'}</td>
                    <td class="p-3">${r.fatherName || '—'}</td>
                    <td class="p-3">${r.jmClass || '—'}</td>
                    <td class="p-3"><span class="bg-blue-50 text-blue-700 px-2 py-0.5 rounded text-[10px] font-bold uppercase">${r.admissionType || '—'}</span></td>
                    <td class="p-3">${r.status || '—'}</td>
                </tr>
            `).join('');
        }

        loadAllData();
    </script>
</body>
</html>
