<div id="academic-pdf-report-container" style="display: none; background: #ffffff; width: 755px; max-width: 755px; margin: 0 auto; padding: 0; box-sizing: border-box;"></div>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, serverTimestamp, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDhPuyX0y1gb3uXoIRcdcQPkd5Q4KJFgl0",
        authDomain: "data-f15ab.firebaseapp.com",
        projectId: "data-f15ab",
        storageBucket: "data-f15ab.firebasestorage.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const urlParams = new URLSearchParams(window.location.search);
    const jamiaName = urlParams.get('jamia') || '';
    let currentJamiaId = urlParams.get('jamiaId') || '';
    const urlMonth = urlParams.get('month');
    document.getElementById('jamia-title').innerHTML = `${jamiaName} <br> <span class="text-yellow-300 font-bold text-[13px] border-t border-indigo-500 pt-1 mt-1 inline-block tracking-wide"><i class="far fa-calendar-alt"></i> Month: ${getMonthName(getCurrentMonthKey())}</span>`;

    let currentUser = null;
    let fullStructure = []; 

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = user;
            await loadJamiaStructure();
            await loadExistingReport();
        } else {
            window.location.href = "index.html";
        }
    });
    function getMonthName(monthKey) {
        if (!monthKey) return "";
        const [year, month] = monthKey.split('-');
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        return `${monthNames[parseInt(month) - 1]} ${year}`;
    }
// Current month nikalne ka helper function
function getCurrentMonthKey() {
        if (urlMonth) return urlMonth; // Agar URL me month hai to usay use karein
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    }
    function getAcademicYear(monthKey) {
        const key = monthKey || getCurrentMonthKey();
        if (key && /^\d{4}-\d{2}$/.test(key)) {
            const [y, m] = key.split('-').map(Number);
            return m >= 4 ? `${y}-${y + 1}` : `${y - 1}-${y}`;
        }
        const now = new Date();
        const month = now.getMonth() + 1;
        const year = now.getFullYear();
        return month >= 4 ? `${year}-${year + 1}` : `${year - 1}-${year}`;
    }
        
async function loadJamiaStructure(targetJamiaId = null, targetMonthKey = null) {
        let effectiveJamiaId = targetJamiaId || currentJamiaId;
        const effectiveMonth = targetMonthKey || getCurrentMonthKey();
        const activeYear = getAcademicYear(effectiveMonth);
        
        try {
            const userRef = doc(db, "users", currentUser.uid);
            const userSnap = await getDoc(userRef);

            if (userSnap.exists()) {
                const userData = userSnap.data();

                // 1. Agar jamiaId URL ya param me nahi mili, to userData.jamiaatList se dhoondhein
                if (!effectiveJamiaId && Array.isArray(userData.jamiaatList)) {
                    const cleanTarget = String(jamiaName || '').trim().toLowerCase();
                    const foundJ = userData.jamiaatList.find(j => {
                        if (typeof j === 'object' && j) {
                            const jn = String(j.name || j.jamiaName || '').trim().toLowerCase();
                            return jn === cleanTarget;
                        }
                        return false;
                    });
                    if (foundJ && foundJ.id) {
                        effectiveJamiaId = foundJ.id;
                        currentJamiaId = foundJ.id;
                    }
                }

                // 2. Agar phir bhi jamiaId na mile, to jamiaat_master se exact name match se dhoondhein
                if (!effectiveJamiaId && jamiaName) {
                    try {
                        const mSnap = await getDocs(collection(db, "jamiaat_master"));
                        const cleanTarget = String(jamiaName).trim().toLowerCase();
                        mSnap.forEach(d => {
                            const mData = d.data();
                            const mName = String(mData.name || mData.jamiaName || '').trim().toLowerCase();
                            if (mName === cleanTarget) {
                                effectiveJamiaId = d.id;
                                currentJamiaId = d.id;
                            }
                        });
                    } catch(e) { console.warn("Master jamia fetch error:", e); }
                }

                const cleanTargetName = String(jamiaName || '').trim().toLowerCase();

                // Jamia ko karkardagiStructure array me dhoondne ka helper
                const findInStruct = (struct) => {
                    if (!Array.isArray(struct)) return null;
                    // Primary: Jamia ID match
                    if (effectiveJamiaId) {
                        const byId = struct.find(j => (j.jamiaId && String(j.jamiaId) === String(effectiveJamiaId)) || (j.id && String(j.id) === String(effectiveJamiaId)));
                        if (byId) return byId;
                    }
                    // Fallback: Exact Name match (No substring / partial match taake Jabalpur aur Jabalpur Bypass mix na hon)
                    if (cleanTargetName) {
                        const byExact = struct.find(j => String(j.jamiaName || j.name || '').trim().toLowerCase() === cleanTargetName);
                        if (byExact) return byExact;
                    }
                    return null;
                };

                // Pehle target month ke academic year me dhoondhein
                let jamiaData = null;
                if (userData.academicYears?.[activeYear]?.karkardagiStructure) {
                    jamiaData = findInStruct(userData.academicYears[activeYear].karkardagiStructure);
                }

                // Agar target year me na mile, to tamam doosre saal check karein
                if (!jamiaData && userData.academicYears) {
                    const allYears = Object.keys(userData.academicYears).sort().reverse();
                    for (const yr of allYears) {
                        const candidate = findInStruct(userData.academicYears[yr]?.karkardagiStructure);
                        if (candidate && Array.isArray(candidate.teachers) && candidate.teachers.length > 0) {
                            jamiaData = candidate;
                            console.log(`Structure found in alternate year ${yr} for:`, jamiaName);
                            break;
                        }
                    }
                }

                if (jamiaData && Array.isArray(jamiaData.teachers)) {
                    fullStructure = jamiaData.teachers;
                    if (jamiaData.jamiaId && !currentJamiaId) currentJamiaId = jamiaData.jamiaId;
                    console.log("Structure Loaded Successfully for:", activeYear, "Teachers count:", fullStructure.length);
                }
            }
        } catch (err) {
            console.error("Structure load error:", err);
        }
    }

    // --- Dynamic UI Logic ---

    document.getElementById('add-class-btn').onclick = () => {
    const classId = Date.now();
    // Unique classes nikalna
    const classes = [...new Set(fullStructure.flatMap(t => t.periods?.map(p => p.className) || []))];
    const classOptions = classes.map(c => `<option value="${c}">${c}</option>`).join('');

    const classTemplate = `
        <div class="class-card bg-white border border-slate-200 rounded-3xl shadow-sm overflow-hidden mb-8" id="class-${classId}">
            <div class="bg-slate-50 p-4 sm:p-5 border-b">
                <div class="flex items-center gap-2 sm:gap-3">
                    <select class="class-select flex-1 min-w-0 p-2.5 font-bold text-indigo-800 outline-none bg-white border border-slate-200 rounded-xl text-sm sm:text-base focus:border-indigo-400" onchange="updateTeachers(this, ${classId})">
                        <option value="">Select Class</option>
                        ${classOptions}
                    </select>
                    <button onclick="document.getElementById('class-${classId}').remove(); updateCalculations();" class="btn-icon-danger" title="Remove Class"><i class="fas fa-trash"></i></button>
                </div>
                <div class="mt-3">
                    <span class="inline-flex items-center gap-1.5 bg-indigo-600 text-white px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-bold">Class Score: <span class="class-avg">0%</span></span>
                </div>
            </div>
            <div class="p-4 sm:p-8">
                <div class="grid grid-cols-2 gap-4 sm:gap-8 mb-6 sm:mb-8 bg-indigo-50/30 p-4 sm:p-6 rounded-2xl border border-indigo-50">
                    <div><label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Total Students</label><input type="number" class="total-students w-full p-3 bg-white border rounded-xl font-bold outline-none" placeholder="e.g. 30" oninput="updateCalculations()"></div>
                    <div><label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Present Students</label><input type="number" class="present-students w-full p-3 bg-white border rounded-xl font-bold outline-none" placeholder="e.g. 25" oninput="updateCalculations()"></div>
                </div>
                <div class="books-container space-y-4 sm:space-y-6"></div>
                <div class="mt-6 sm:mt-8 flex justify-start">
                    <button onclick="addBookRow(${classId})" type="button" class="btn btn-warning w-full sm:w-auto">
                        <i class="fas fa-plus"></i> Add Subject
                    </button>
                </div>
                <div class="mt-6 sm:mt-8">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-2"><i class="fas fa-comment-dots mr-1"></i> Class Remarks</label>
                    <textarea class="class-remark" rows="3" placeholder="Add any remarks about this class (optional)..."></textarea>
                </div>
            </div>
        </div>`;
    
    document.getElementById('classes-list').insertAdjacentHTML('beforeend', classTemplate);
};

    window.updateTeachers = (selectElem, classId) => {
    const card = document.getElementById(`class-${classId}`);
    card.dataset.selectedClass = selectElem.value;
    
    // Sirf container ko clear karein, baki functions safe rahenge
    const container = card.querySelector('.books-container');
    if (container) {
        container.innerHTML = ''; 
    }
};

    window.addBookRow = (classId) => {
        const card = document.getElementById(`class-${classId}`);
        const selectedClass = card.dataset.selectedClass;
        if(!selectedClass) return alert("Please select a class first!");

        const bookId = Date.now();
        let teachersInClass = fullStructure.filter(t => t.periods?.some(p => p.className === selectedClass));
        if (teachersInClass.length === 0) {
            teachersInClass = fullStructure;
        }
        const teacherOptions = teachersInClass.map(t => `<option value="${t.id}">${t.name || t.teacherName}</option>`).join('');

        const bookRow = `
            <div class="book-row bg-white p-4 rounded-2xl border border-slate-100" id="book-${bookId}">
                <div class="flex flex-col md:flex-row md:items-center gap-3 md:gap-4">
                    <div class="flex items-center justify-between md:justify-center md:w-10 md:shrink-0">
                        <span class="md:hidden text-[10px] font-black text-slate-400 uppercase tracking-wide">Subject</span>
                        <button onclick="this.closest('.book-row').remove(); updateCalculations();" class="icon-remove">×</button>
                    </div>
                    <div class="md:flex-1 md:min-w-0">
                        <label class="md:hidden block text-[10px] font-bold text-slate-400 uppercase mb-1">Teacher</label>
                        <select class="teacher-select w-full p-2.5 md:p-2 border md:border-0 md:border-b border-slate-200 rounded-xl md:rounded-none outline-none text-sm bg-slate-50 md:bg-transparent focus:border-indigo-400" onchange="updateBooks(this, ${bookId}, '${selectedClass}')">
                            <option value="">Select Teacher</option>${teacherOptions}
                        </select>
                    </div>
                    <div class="md:flex-1 md:min-w-0">
                        <label class="md:hidden block text-[10px] font-bold text-slate-400 uppercase mb-1">Subject</label>
                        <select class="book-select w-full p-2.5 md:p-2 border md:border-0 md:border-b border-slate-200 rounded-xl md:rounded-none outline-none text-sm font-medium bg-slate-50 md:bg-transparent focus:border-indigo-400">
                            <option value="">Select Subject</option>
                        </select>
                    </div>
                    <div class="text-center md:w-20 md:shrink-0">
                        <span class="md:hidden block text-[10px] font-bold text-slate-400 uppercase mb-1">Score</span>
                        <div class="text-lg font-black text-slate-300 book-percent">0%</div>
                    </div>
                </div>
            </div>`;
        
        card.querySelector('.books-container').insertAdjacentHTML('beforeend', bookRow);
    };

    window.updateBooks = (teacherSelect, bookRowId, className) => {
    const teacherId = teacherSelect.value;
    const teacher = fullStructure.find(t => t.id === teacherId);
    let books = teacher?.periods?.filter(p => p.className === className) || [];
    if (books.length === 0 && teacher?.periods) {
        books = teacher.periods; // Fallback to all periods of this teacher if class not specific
    }
    const bookSelect = document.querySelector(`#book-${bookRowId} .book-select`);
    
    bookSelect.innerHTML = '<option value="">Select Subject</option>' + 
        books.map(b => `<option value="${b.bookName}">${b.bookName}</option>`).join('');

    // Jab subject change ho, to questions dikhao
    bookSelect.onchange = () => {
        const selectedSubject = bookSelect.value;
        if(selectedSubject) {
            showQuestionsArea(bookRowId, selectedSubject);
        }
    };
};

// Naya function questions display karne ke liye
function showQuestionsArea(bookRowId, subjectName, savedEvaluations = null) {
    const bookRow = document.getElementById(`book-${bookRowId}`);
    
    const existingQ = document.getElementById(`q-area-${bookRowId}`);
    if(existingQ) existingQ.remove();

    const subjectLower = subjectName.toLowerCase();
    let qHtml = `<div id="q-area-${bookRowId}" class="bg-slate-50 p-4 rounded-xl mt-3 border border-dashed border-indigo-200">
                    <p class="text-[10px] font-bold text-indigo-500 mb-2 uppercase">Questions for ${subjectName}:</p>
                    <div class="grid grid-cols-1 gap-2">`;

    // Agar database se saved questions mil gaye hain
    if (savedEvaluations && savedEvaluations.length > 0) {
        savedEvaluations.forEach(ev => {
            const isPredefined = ['Reading', 'Writing', 'Translation'].includes(ev.text);
            qHtml += createQuestionInput(ev.text, !isPredefined, ev.score);
        });
    } else {
        // Naya subject select karne par (Default blank questions)
        if (subjectLower.includes('english')) {
            ['Reading', 'Writing', 'Translation'].forEach(q => {
                qHtml += createQuestionInput(q, false, '');
            });
        }
        for(let i=1; i<=3; i++) {
            qHtml += createQuestionInput('', true, '');
        }
    }

    qHtml += `</div></div>`;
    bookRow.insertAdjacentHTML('beforeend', qHtml);
}

function createQuestionInput(val = '', isBlank, scoreVal = '') {
    // Agar question mein double quotes (") hon to usay escape karein
    const safeVal = val ? val.replace(/"/g, '&quot;') : '';
    
    return `
        <div class="q-row flex items-center gap-4 bg-white p-2 rounded-lg shadow-sm">
            <div class="flex-1">
                ${isBlank ? `<input type="text" placeholder="Custom Question..." class="w-full text-xs outline-none border-b italic" value="${safeVal}">` : `<span class="text-xs font-bold text-slate-600">${val}</span>`}
            </div>
            <input type="number" class="q-score-input w-20 p-1 bg-indigo-50 rounded text-center text-xs font-bold" placeholder="Score" value="${scoreVal}" oninput="updateCalculations()">
        </div>`;
}

            // Grade aur color nikalne ka helper function
function getGradeInfo(perc) {
    if (perc >= 76) return { text: "Mumtaz", color: "text-green-500", topColor: "text-green-400" };
    if (perc >= 61) return { text: "Behtar", color: "text-blue-500", topColor: "text-blue-400" };
    if (perc >= 40) return { text: "Munasib", color: "text-orange-500", topColor: "text-orange-400" };
    return { text: "Kamzor", color: "text-red-500", topColor: "text-red-400" };
}
        
window.updateCalculations = () => {
    let jamiaTotalPerc = 0;
    const classes = document.querySelectorAll('.class-card');
    let totalBooks = 0;

    classes.forEach(card => {
        const present = parseFloat(card.querySelector('.present-students').value) || 0;
        let classSum = 0;
        const books = card.querySelectorAll('.book-row');
        totalBooks += books.length;

        books.forEach(row => {
            let scoreSum = 0;
            let scoreCount = 0;
            
            const questionInputs = row.querySelectorAll('.q-score-input');
            
            questionInputs.forEach(qInput => {
                // Sirf tab add karein jab value khali na ho
                if (qInput.value.trim() !== "") {
                    scoreSum += parseFloat(qInput.value) || 0;
                    scoreCount++;
                }
            });

            // Agar koi bhi sawal fill nahi hai, toh percentage 0 rahegi
            let avgCorrectFromQuestions = scoreCount > 0 ? (scoreSum / scoreCount) : 0;
            
            let perc = present > 0 ? (avgCorrectFromQuestions / present) * 100 : 0;
            if (perc > 100) perc = 100;

            const display = row.querySelector('.book-percent');
            if (display) {
                // Subject ka grade aur color apply karna
                const grade = getGradeInfo(perc);
                display.innerHTML = `${perc.toFixed(1)}% <br><span class="text-sm font-bold ${grade.color} leading-tight">${grade.text}</span>`;
                display.className = `text-lg font-black text-center ${perc > 0 ? 'text-indigo-600' : 'text-slate-300'} book-percent`;
            }
            
            classSum += perc;
        });

        const classAvg = books.length > 0 ? classSum / books.length : 0;
        const classDisplay = card.querySelector('.class-avg');
        if (classDisplay) {
            // Class ka grade aur color apply karna
            let finalClassPerc = Math.min(classAvg, 100);
            const classGrade = getGradeInfo(finalClassPerc);
            classDisplay.innerHTML = `${finalClassPerc.toFixed(1)}% <span class="ml-1 font-bold ${classGrade.color}">(${classGrade.text})</span>`;
        }
        jamiaTotalPerc += classAvg;
    });

    const jamiaAvg = classes.length > 0 ? jamiaTotalPerc / classes.length : 0;
    
    const jamiaDisplay = document.getElementById('jamia-total-percent');
    if (jamiaDisplay) {
        // Pure Jamia ka grade aur bright color apply karna top card ke liye
        let finalJamiaPerc = Math.min(jamiaAvg, 100);
        const jamiaGrade = getGradeInfo(finalJamiaPerc);
        jamiaDisplay.innerHTML = `${finalJamiaPerc.toFixed(1)}% <div class="text-xl md:text-2xl ${jamiaGrade.topColor} mt-1 font-black tracking-wide">${jamiaGrade.text}</div>`;
    }
    
    document.getElementById('total-classes-count').textContent = classes.length;
    document.getElementById('total-books-count').textContent = totalBooks;
};

async function loadExistingReport() {
        const monthKey = getCurrentMonthKey();
        const primaryReportId = `REP_${jamiaName.replace(/\s+/g, '_')}_${monthKey}`;
        
        try {
            let reportRef = doc(db, "academic_inspections", primaryReportId);
            let reportSnap = await getDoc(reportRef);

            // 2. Lookup by REP_JamiaId_Month if available
            if (!reportSnap.exists() && currentJamiaId) {
                try {
                    const idReportRef = doc(db, "academic_inspections", `REP_${currentJamiaId}_${monthKey}`);
                    const idSnap = await getDoc(idReportRef);
                    if (idSnap.exists()) reportSnap = idSnap;
                } catch(e) {}
            }

            // 3. Dual lookup fallback in academic_inspections collection
            if (!reportSnap.exists()) {
                try {
                    const qInsp = query(collection(db, "academic_inspections"), where("inspectorId", "==", currentUser.uid));
                    const inspDocs = await getDocs(qInsp);
                    const cleanTarget = String(jamiaName).trim().toLowerCase();
                    const found = inspDocs.docs.find(d => {
                        const dData = d.data();
                        const dMonth = dData.month || dData.monthKey;
                        if (dMonth !== monthKey) return false;
                        if (currentJamiaId && dData.jamiaId && String(dData.jamiaId) === String(currentJamiaId)) return true;
                        const dj = String(dData.jamiaName || '').trim().toLowerCase();
                        return dj === cleanTarget;
                    });
                    if (found) reportSnap = found;
                } catch(e) {}
            }

            if (reportSnap && reportSnap.exists()) {
                const savedData = reportSnap.data();
                console.log("Is mahine ka data mil gaya:", savedData);

                if (savedData.jamiaId && !currentJamiaId) {
                    currentJamiaId = savedData.jamiaId;
                }

                // Agar structure load nahi hua ya khali tha, report ke month aur jamiaId se reload karein
                if (!fullStructure || fullStructure.length === 0) {
                    await loadJamiaStructure(currentJamiaId, savedData.month || monthKey);
                }

                // Agar currentUser ke paas structure nahi hai aur savedData.inspectorId alag ho:
                if ((!fullStructure || fullStructure.length === 0) && savedData.inspectorId && savedData.inspectorId !== currentUser.uid) {
                    try {
                        const origUserSnap = await getDoc(doc(db, "users", savedData.inspectorId));
                        if (origUserSnap.exists()) {
                            const origData = origUserSnap.data();
                            const repAy = getAcademicYear(savedData.month || monthKey);
                            const struct = origData.academicYears?.[repAy]?.karkardagiStructure || [];
                            const cleanTarget = String(jamiaName).trim().toLowerCase();
                            const jObj = struct.find(j => (currentJamiaId && (j.jamiaId === currentJamiaId || j.id === currentJamiaId)) || String(j.jamiaName || j.name || '').trim().toLowerCase() === cleanTarget);
                            if (jObj && Array.isArray(jObj.teachers)) {
                                fullStructure = jObj.teachers;
                            }
                        }
                    } catch(e) {}
                }

                document.getElementById('classes-list').innerHTML = '';
                
                savedData.classes.forEach(cData => {
                    renderSavedClass(cData);
                });

                updateCalculations();
            } else {
                console.log("Is mahine ka form abhi fill nahi hua hai. Form blank rahega.");
                // Yahan form bilkul blank aayega taake naye mahine ki entry ki ja sake
            }
        } catch (error) {
            console.error("Data load karne me galti hui:", error);
        }
    }

function renderSavedBook(classId, sData, container) {
    const bookId = Date.now() + Math.random();
    const card = document.getElementById(`class-${classId}`);
    const selectedClass = card.dataset.selectedClass;

    let teachersInClass = fullStructure.filter(t => t.periods?.some(p => p.className === selectedClass));
    
    // Saved teacher ko fullStructure me dhoondhein
    let savedTeacher = fullStructure.find(t => t.id === sData.teacherId || (sData.teacherName && (t.name || t.teacherName) === sData.teacherName));
    if (savedTeacher && !teachersInClass.some(t => t.id === savedTeacher.id)) {
        teachersInClass.push(savedTeacher);
    }
    if (teachersInClass.length === 0 && fullStructure.length > 0) {
        teachersInClass = [...fullStructure];
    }

    let teacherOptions = teachersInClass.map(t => 
        `<option value="${t.id}" ${t.id === sData.teacherId ? 'selected' : ''}>${t.name || t.teacherName}</option>`
    ).join('');

    if (sData.teacherId && !teachersInClass.some(t => t.id === sData.teacherId)) {
        const displayName = sData.teacherName || (savedTeacher ? (savedTeacher.name || savedTeacher.teacherName) : `Teacher (${sData.teacherId})`);
        teacherOptions = `<option value="${sData.teacherId}" selected>${displayName}</option>` + teacherOptions;
    }

    const teacher = savedTeacher || fullStructure.find(t => t.id === sData.teacherId);
    let books = teacher?.periods?.filter(p => p.className === selectedClass) || [];
    if (books.length === 0 && teacher?.periods) {
        books = teacher.periods;
    }
    let bookNames = [...new Set(books.map(b => b.bookName).filter(Boolean))];
    if (sData.subjectName && !bookNames.includes(sData.subjectName)) {
        bookNames.push(sData.subjectName);
    }
    const bookOptions = bookNames.map(bName => 
        `<option value="${bName}" ${bName === sData.subjectName ? 'selected' : ''}>${bName}</option>`
    ).join('');

    const bookRow = `
        <div class="book-row bg-white p-4 rounded-2xl border border-slate-100" id="book-${bookId}">
            <div class="flex flex-col md:flex-row md:items-center gap-3 md:gap-4">

                </div>

                    <label class="md:hidden block text-[10px] font-bold text-slate-400 uppercase mb-1">Teacher</label>
                    <select class="teacher-select w-full p-2.5 md:p-2 border md:border-0 md:border-b border-slate-200 rounded-xl md:rounded-none outline-none text-sm bg-slate-50 md:bg-transparent focus:border-indigo-400" onchange="updateBooks(this, ${bookId}, '${selectedClass}')">
                        <option value="">Select Teacher</option>${teacherOptions}
                    </select>
                </div>
                <div class="md:flex-1 md:min-w-0">
                    <label class="md:hidden block text-[10px] font-bold text-slate-400 uppercase mb-1">Subject</label>
                    <select class="book-select w-full p-2.5 md:p-2 border md:border-0 md:border-b border-slate-200 rounded-xl md:rounded-none outline-none text-sm font-medium bg-slate-50 md:bg-transparent focus:border-indigo-400">
                        <option value="">Select Subject</option>${bookOptions}
                    </select>
                </div>
                <div class="text-center md:w-20 md:shrink-0">
                    <span class="md:hidden block text-[10px] font-bold text-slate-400 uppercase mb-1">Score</span>
                    <div class="text-lg font-black text-indigo-600 book-percent">${sData.subjectScore}</div>
                </div>
            </div>
        </div>`;
    
    container.insertAdjacentHTML('beforeend', bookRow);
    // Questions render karna
    showQuestionsArea(bookId, sData.subjectName, sData.evaluations);

                            <div style="font-size: 22px; font-weight: 900; color: #4f46e5;">${overallScore}</div>
                        </div>
                    </div>
                </div>

                ${classesHtml || '<div style="padding:20px; text-align:center; color:#94a3b8;">No classes added to report.</div>'}

                <div style="text-align: center; margin-top: 15px; font-size: 10px; color: #94a3b8; border-top: 1px solid #e2e8f0; padding-top: 8px;">
                    Report Generated by Majlis-e-Talimi Umoor Academic Inspection System on ${dateStr}
                </div>
            </div>
        `;

        // 3. Normal In-flow Container Switch (100% Reliable, zero margin clipping)
        pdfContainer.innerHTML = printTemplate;
        if (mainWrapper) mainWrapper.style.display = 'none';
        pdfContainer.style.display = 'block';
        document.body.style.backgroundColor = '#ffffff';
        window.scrollTo(0, 0);

        // DOM & Fonts Settle Wait
        try { await document.fonts.ready; } catch(e) {}
        await new Promise(r => setTimeout(r, 600));

        let safeJamia = 'Inspection';
        try {
            safeJamia = jamiaTitleText.replace(/[^a-zA-Z0-9_\-]/g, '_');
        } catch(e) {}

        const opt = {
            margin:       [6, 4, 8, 4], 
            filename:     `Academic_Inspection_${safeJamia}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { 
                scale: 2, 
                useCORS: true, 
                letterRendering: true,
                logging: false, 
                scrollX: 0,
                scrollY: 0,
                backgroundColor: '#ffffff'
            }, 
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true },
            pagebreak:    { mode: ['css', 'legacy'] }
        };

        await html2pdf().set(opt).from(pdfContainer).save();
    } catch (error) {
        console.error("PDF generation failed:", error);
        alert("Error downloading PDF: " + (error.message || error));
    } finally {
        if (pdfContainer) {
            pdfContainer.style.display = 'none';
            pdfContainer.innerHTML = '';
        }
        if (mainWrapper) mainWrapper.style.display = '';
        document.body.style.backgroundColor = '';
        window.scrollTo(0, savedScrollY);
        btn.innerHTML = originalText;
        btn.disabled = false;
    }
});

</script>
</body>
</html>
